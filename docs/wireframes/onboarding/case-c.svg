<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 500" width="696" height="500" role="img" aria-labelledby="title">
<title id="title">Case C — 순수 양육자 (임신 X · 양육 O)</title>
<rect width="696" height="500" fill="#FFFFFF"/>
  <text x="28" y="32" font-size="16" font-weight="500" fill="#2C2C2A" font-family="sans-serif">Case C — 순수 양육자 (임신 X · 양육 O)</text>
  <text x="28" y="52" font-size="12" fill="#5F5E5A" font-family="sans-serif">태아 정보 없이 양육 중인 아이 정보만 입력</text>
<g transform="translate(28,92)"><g>
  <rect x="0.5" y="0.5" width="199" height="379" rx="16" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <rect x="78" y="8" width="44" height="6" rx="3" fill="#F1EFE8"/>
  <rect x="20" y="32" width="160" height="3" rx="1.5" fill="#F1EFE8"/>
  <rect x="20" y="32" width="53" height="3" rx="1.5" fill="#378ADD"/>
  <text x="20" y="54" font-size="11" font-weight="500" fill="#0C447C" font-family="sans-serif">Case C · 1/3</text>
  
  <text x="20" y="80" font-size="13" font-weight="500" fill="#2C2C2A" font-family="sans-serif">양육 중인 아이가</text>
  <text x="20" y="98" font-size="13" font-weight="500" fill="#2C2C2A" font-family="sans-serif">몇 명인가요?</text>
  <rect x="20" y="124" width="160" height="50" rx="10" fill="#F1EFE8" stroke="#2C2C2A" stroke-width="1.5"/>
  <circle cx="42" cy="149" r="10" fill="#FFFFFF"/>
  <text x="62" y="153" font-size="12" font-weight="500" fill="#2C2C2A" font-family="sans-serif">1명</text>
  <rect x="20" y="182" width="160" height="50" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <circle cx="36" cy="207" r="9" fill="#F1EFE8"/>
  <circle cx="50" cy="207" r="9" fill="#F1EFE8"/>
  <text x="68" y="211" font-size="12" font-weight="500" fill="#2C2C2A" font-family="sans-serif">2명</text>
  <rect x="20" y="240" width="160" height="50" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <circle cx="36" cy="265" r="8" fill="#F1EFE8"/>
  <circle cx="50" cy="265" r="8" fill="#F1EFE8"/>
  <circle cx="64" cy="265" r="8" fill="#F1EFE8"/>
  <text x="80" y="269" font-size="12" font-weight="500" fill="#2C2C2A" font-family="sans-serif">3명 이상</text>

  <rect x="20" y="324" width="160" height="40" rx="10" fill="#2C2C2A"/>
  <text x="100" y="349" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif">다음</text>
</g></g>
<text x="28" y="492" font-size="12" font-weight="500" fill="#2C2C2A" font-family="sans-serif">C1</text><text x="52" y="492" font-size="12" fill="#5F5E5A" font-family="sans-serif">양육 아이 수</text>
<g transform="translate(248,92)"><g>
  <rect x="0.5" y="0.5" width="199" height="379" rx="16" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <rect x="78" y="8" width="44" height="6" rx="3" fill="#F1EFE8"/>
  <rect x="20" y="32" width="160" height="3" rx="1.5" fill="#F1EFE8"/>
  <rect x="20" y="32" width="107" height="3" rx="1.5" fill="#378ADD"/>
  <text x="20" y="54" font-size="11" font-weight="500" fill="#0C447C" font-family="sans-serif">Case C · 2/3</text>
  
  <text x="20" y="78" font-size="13" font-weight="500" fill="#2C2C2A" font-family="sans-serif">아이 정보를 알려주세요</text>
  <rect x="76" y="90" width="48" height="48" rx="24" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="100" y="119" font-size="14" fill="#888780" text-anchor="middle" font-family="sans-serif">+</text>
  <text x="100" y="152" font-size="9" fill="#888780" text-anchor="middle" font-family="sans-serif">사진 추가 (선택)</text>
  <text x="20" y="174" font-size="9" fill="#888780" font-family="sans-serif">이름</text>
  <rect x="20" y="180" width="160" height="24" rx="5" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <text x="20" y="218" font-size="9" fill="#888780" font-family="sans-serif">성별 · 생년월일</text>
  <rect x="20" y="224" width="76" height="24" rx="5" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <rect x="104" y="224" width="76" height="24" rx="5" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <text x="20" y="266" font-size="9" fill="#888780" font-family="sans-serif">한줄 소개 (선택)</text>
  <rect x="20" y="272" width="160" height="40" rx="5" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>

  <rect x="20" y="324" width="160" height="40" rx="10" fill="#2C2C2A"/>
  <text x="100" y="349" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif">다음</text>
</g></g>
<text x="248" y="492" font-size="12" font-weight="500" fill="#2C2C2A" font-family="sans-serif">C2</text><text x="272" y="492" font-size="12" fill="#5F5E5A" font-family="sans-serif">아이 정보 (반복)</text>
<g transform="translate(468,92)"><g>
  <rect x="0.5" y="0.5" width="199" height="379" rx="16" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <rect x="78" y="8" width="44" height="6" rx="3" fill="#F1EFE8"/>
  <rect x="20" y="32" width="160" height="3" rx="1.5" fill="#F1EFE8"/>
  <rect x="20" y="32" width="160" height="3" rx="1.5" fill="#378ADD"/>
  <text x="20" y="54" font-size="11" font-weight="500" fill="#0C447C" font-family="sans-serif">Case C · 3/3</text>
  
  <text x="20" y="80" font-size="13" font-weight="500" fill="#2C2C2A" font-family="sans-serif">어떤 목적으로 기록하시나요?</text>
  <text x="20" y="98" font-size="10" fill="#888780" font-family="sans-serif">복수 선택 가능</text>
  <rect x="20" y="118" width="160" height="38" rx="8" fill="#F1EFE8" stroke="#2C2C2A" stroke-width="1.5"/>
  <rect x="32" y="132" width="11" height="11" rx="2" fill="#2C2C2A"/>
  <text x="52" y="142" font-size="11" font-weight="500" fill="#2C2C2A" font-family="sans-serif">아이에게 줄 책 만들기</text>
  <rect x="20" y="164" width="160" height="38" rx="8" fill="#F1EFE8" stroke="#2C2C2A" stroke-width="1.5"/>
  <rect x="32" y="178" width="11" height="11" rx="2" fill="#2C2C2A"/>
  <text x="52" y="188" font-size="11" font-weight="500" fill="#2C2C2A" font-family="sans-serif">성장 일기</text>
  <rect x="20" y="210" width="160" height="38" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <rect x="32" y="224" width="11" height="11" rx="2" fill="none" stroke="#888780" stroke-width="1"/>
  <text x="52" y="234" font-size="11" fill="#2C2C2A" font-family="sans-serif">가족과 공유</text>
  <rect x="20" y="256" width="160" height="38" rx="8" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <rect x="32" y="270" width="11" height="11" rx="2" fill="none" stroke="#888780" stroke-width="1"/>
  <text x="52" y="280" font-size="11" fill="#2C2C2A" font-family="sans-serif">육아 회고</text>

  <rect x="20" y="324" width="160" height="40" rx="10" fill="#2C2C2A"/>
  <text x="100" y="349" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle" font-family="sans-serif">홈으로 시작하기</text>
</g></g>
<text x="468" y="492" font-size="12" font-weight="500" fill="#2C2C2A" font-family="sans-serif">C3</text><text x="492" y="492" font-size="12" fill="#5F5E5A" font-family="sans-serif">기록 목적</text>
</svg>
