  <text x="100" y="349" font-size="12" fill="#888780" text-anchor="middle" font-family="sans-serif">다음</text>
</g></g>
<text x="28" y="492" font-size="12" font-weight="500" fill="#2C2C2A" font-family="sans-serif">A1</text><text x="52" y="492" font-size="12" fill="#5F5E5A" font-family="sans-serif">임신 아이 수</text>
