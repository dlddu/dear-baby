<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 500" width="696" height="500" role="img" aria-labelledby="title">
<title id="title">Case A — 첫 아이 임신 중 (임신 O · 양육 X)</title>
<rect width="696" height="500" fill="#FFFFFF"/>
  <text x="28" y="32" font-size="16" font-weight="500" fill="#2C2C2A" font-family="sans-serif">Case A — 첫 아이 임신 중 (임신 O · 양육 X)</text>
  <text x="28" y="52" font-size="12" fill="#5F5E5A" font-family="sans-serif">태아 정보 한 그룹만 입력하는 가장 단순한 경로</text>
