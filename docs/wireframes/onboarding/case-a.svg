  <text x="20" y="84" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">임신 중인 아이는</text>
  <text x="20" y="103" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">몇 명인가요?</text>
  <rect x="20" y="132" width="76" height="92" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <circle cx="58" cy="166" r="14" fill="#F1EFE8"/>
  <text x="58" y="200" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" font-family="sans-serif">단태</text>
  <text x="58" y="215" font-size="10" fill="#888780" text-anchor="middle" font-family="sans-serif">1명</text>
  <rect x="104" y="132" width="76" height="92" rx="10" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="1"/>
  <circle cx="135" cy="160" r="11" fill="#F1EFE8"/>
  <circle cx="151" cy="160" r="11" fill="#F1EFE8"/>
  <text x="142" y="200" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" font-family="sans-serif">다태</text>
  <text x="142" y="215" font-size="10" fill="#888780" text-anchor="middle" font-family="sans-serif">2명 이상</text>
