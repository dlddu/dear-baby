name: Setup MinIO
description: |
  Install + start MinIO on the runner host so the backend's records-audio
  routes can be exercised against a real S3 API. Cross-platform: works on
  ubuntu (e2e-android) and macos (e2e-ios) runners. Creates the requested
  bucket using the bundled `mc` client, then writes the connection vars
  to GITHUB_ENV so subsequent steps (and the backend started after this
  action) inherit them automatically.

  Static credentials are non-secret: the runner's MinIO is reachable on
  127.0.0.1 only and disposed of when the job ends.

inputs:
  bucket:
    description: Bucket name to create.
    required: false
    default: "dear-baby-ci"
  port:
    description: Port MinIO listens on.
    required: false
    default: "9000"
  access-key:
    description: MinIO root access key (also used as AWS_ACCESS_KEY_ID).
    required: false
    default: "ci-minio-access-key"
  secret-key:
    description: MinIO root secret key (also used as AWS_SECRET_ACCESS_KEY).
    required: false
    default: "ci-minio-secret-key"
  region:
    description: AWS_REGION to export. MinIO accepts any value; this is
      only used for SigV4 signing.
    required: false
    default: "us-east-1"
  key-prefix:
    description: AWS_S3_KEY_PREFIX to export. Mirrors the production
      pattern of splitting environments by prefix.
    required: false
    default: "ci/"

runs:
  using: composite
  steps:
    # Resolve the right binary URL for the runner's OS+arch. MinIO ships
    # static Go binaries for both linux + darwin in amd64 + arm64.
    #
    # Source is the GitHub release, not dl.min.io: upstream took the
    # `https://dl.min.io/{server,client}/…/release/…` download paths down
    # (they answer 410 Gone), which broke every e2e job at this step. The
    # release assets carry the same static binaries and a `.sha256sum`
    # sibling, so we pin an explicit release per tool and verify what we
    # downloaded instead of following a floating "latest" pointer.
    #
    # MINIO_RELEASE matches scripts/minio/deployment.yaml so the host-run
    # server (e2e) and the in-cluster one (integration) stay on one
    # version. MC_RELEASE is pinned separately — mc and the server are
    # released on their own cadences.
    - name: Detect platform
      id: plat
      shell: bash
      env:
        MINIO_RELEASE: RELEASE.2024-09-13T20-26-02Z
        MC_RELEASE: RELEASE.2025-08-13T08-35-41Z
      run: |
        os=$(uname -s | tr '[:upper:]' '[:lower:]')
        arch=$(uname -m)
        case "$arch" in
          x86_64) arch=amd64 ;;
          arm64|aarch64) arch=arm64 ;;
        esac
        minio_base="https://github.com/minio/minio/releases/download/${MINIO_RELEASE}/minio.${os}-${arch}.${MINIO_RELEASE}"
        mc_base="https://github.com/minio/mc/releases/download/${MC_RELEASE}/mc.${os}-${arch}.${MC_RELEASE}"
        {
          echo "minio_url=${minio_base}"
          echo "minio_sha_url=${minio_base}.sha256sum"
          echo "mc_url=${mc_base}"
          echo "mc_sha_url=${mc_base}.sha256sum"
        } >> "$GITHUB_OUTPUT"

    # The published .sha256sum names the *unsuffixed* artifact
    # (`minio.RELEASE.…`), not the platform-suffixed file we save, so
    # `sha256sum -c` would fail on the filename. Compare the digest
    # field alone.
    - name: Install MinIO + mc
      shell: bash
      run: |
        set -eux
        bin="$RUNNER_TEMP/minio-bin"
        mkdir -p "$bin"
        curl -fsSL "${{ steps.plat.outputs.minio_url }}" -o "$bin/minio"
        curl -fsSL "${{ steps.plat.outputs.mc_url }}" -o "$bin/mc"
        # sha256sum is coreutils (ubuntu); macOS runners only have shasum.
        digest() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }
        verify() {
          want=$(curl -fsSL "$2" | awk '{print $1}')
          got=$(digest "$1")
          if [ "$want" != "$got" ]; then
            echo "checksum mismatch for $1: want $want, got $got" >&2
            exit 1
          fi
        }
        verify "$bin/minio" "${{ steps.plat.outputs.minio_sha_url }}"
        verify "$bin/mc" "${{ steps.plat.outputs.mc_sha_url }}"
        chmod +x "$bin/minio" "$bin/mc"
        echo "$bin" >> "$GITHUB_PATH"

    - name: Start MinIO
      shell: bash
      env:
        MINIO_ROOT_USER: ${{ inputs.access-key }}
        MINIO_ROOT_PASSWORD: ${{ inputs.secret-key }}
      run: |
        set -eux
        data="$RUNNER_TEMP/minio-data"
        mkdir -p "$data"
        nohup minio server "$data" --address ":${{ inputs.port }}" \
          > "$RUNNER_TEMP/minio.log" 2>&1 &
        echo $! > "$RUNNER_TEMP/minio.pid"
        for i in $(seq 1 30); do
          if curl -fsS "http://127.0.0.1:${{ inputs.port }}/minio/health/ready" >/dev/null 2>&1; then
            echo "minio ready"
            exit 0
          fi
          sleep 1
        done
        echo "minio failed to start"
        cat "$RUNNER_TEMP/minio.log"
        exit 1

    - name: Create bucket
      shell: bash
      run: |
        set -eux
        mc alias set local "http://127.0.0.1:${{ inputs.port }}" \
          "${{ inputs.access-key }}" "${{ inputs.secret-key }}"
        mc mb -p "local/${{ inputs.bucket }}"

    # Export the connection settings so the backend (started by
    # setup-backend in the same job) and any later step inherit them.
    # AWS_ENDPOINT_URL_S3 is the SDK-recognised env that redirects v2
    # clients off public AWS; AWS_S3_FORCE_PATH_STYLE is read by the
    # storage package since virtual-hosted style needs subdomain DNS.
    - name: Export AWS_* env vars
      shell: bash
      run: |
        {
          echo "AWS_REGION=${{ inputs.region }}"
          echo "AWS_S3_BUCKET=${{ inputs.bucket }}"
          echo "AWS_S3_KEY_PREFIX=${{ inputs.key-prefix }}"
          echo "AWS_S3_FORCE_PATH_STYLE=1"
          echo "AWS_ENDPOINT_URL_S3=http://127.0.0.1:${{ inputs.port }}"
          echo "AWS_ACCESS_KEY_ID=${{ inputs.access-key }}"
          echo "AWS_SECRET_ACCESS_KEY=${{ inputs.secret-key }}"
        } >> "$GITHUB_ENV"
