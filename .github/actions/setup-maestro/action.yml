name: Setup Maestro
description: Install and verify the Maestro CLI

runs:
  using: composite
  steps:
    - name: Install Maestro
      shell: bash
      run: |
        curl -fsSL "https://get.maestro.mobile.dev" | bash
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

    - name: Verify Maestro
      shell: bash
      run: maestro --version
