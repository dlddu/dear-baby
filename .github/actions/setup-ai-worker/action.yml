name: Setup AI Worker
description: Install Go, build the worker, start a mock OpenRouter server, and start the worker in the background pointing at the mock.

inputs:
  redis-url:
    description: REDIS_URL to connect to.
    required: true
  openrouter-api-key:
    description: OpenRouter API key. Optional in CI — the worker still
      requires the env to be non-empty, but the value is ignored by the
      mock server.
    required: false
    default: "ci-mock-key"
  openrouter-base-url:
    description: Override for the OpenRouter client baseURL. When empty
      (default) this action starts the local mock server on
      mock-port and points the worker at it. Set to a real URL to skip
      the mock and target an upstream provider instead.
    required: false
    default: ""
  mock-port:
    description: Port the local OpenRouter mock listens on. Only used
      when openrouter-base-url is empty.
    required: false
    default: "8088"
  openrouter-model:
    description: OpenRouter model slug. The mock echoes whatever value
      we send back, so this is only meaningful when openrouter-base-url
      points at a real provider.
    required: false
    default: "openrouter-mock"
  log-level:
    description: slog level. CI defaults to debug so AI-preview pipeline
      failures leave a full breadcrumb trail.
    required: false
    default: "debug"
  langfuse-public-key:
    description: Langfuse public key. When set together with the secret
      key, the worker boots its OTLP exporter and ships every OpenRouter
      span to Langfuse. When unset the tracer provider stays unset and
      spans are dropped.
    required: false
    default: ""
  langfuse-secret-key:
    description: Langfuse secret key. Paired with langfuse-public-key.
    required: false
    default: ""
  langfuse-baseurl:
    description: Langfuse OTLP base URL. Defaults to US region (our account).
    required: false
    default: "https://us.cloud.langfuse.com"

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25"
        cache-dependency-path: worker/go.sum

    - name: Build worker
      working-directory: worker
      shell: bash
      run: |
        go build -trimpath -o worker-bin ./cmd/worker

    # mock-exception: MB-4 — LLM 공급자로의 HTTP 왕복만 치환한다. 이 액션은
    # e2e-android.yml·e2e-ios.yml·integration.yml 이 모두 쓰므로, maestro e2e
    # 레인에서도 워커→백엔드→SSE→앱 구간은 실제 컴포넌트로 돈다.
    # Start the mock OpenRouter server in the background. Only runs when
    # openrouter-base-url is empty — callers that want to talk to a real
    # provider supply their own baseURL and skip this entirely.
    - name: Start openrouter-mock
      if: inputs.openrouter-base-url == ''
      shell: bash
      env:
        PORT: ${{ inputs.mock-port }}
      run: |
        nohup node "$GITHUB_WORKSPACE/scripts/openrouter-mock/server.js" \
          > "$GITHUB_WORKSPACE/openrouter-mock.log" 2>&1 &
        echo $! > "$GITHUB_WORKSPACE/openrouter-mock.pid"
        # Wait for the mock to come up before starting the worker —
        # otherwise the worker's first chat completion call could race
        # the listener and fail the integration test.
        for i in $(seq 1 20); do
          if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then
            echo "openrouter-mock ready on port ${PORT}"
            exit 0
          fi
          sleep 0.5
        done
        echo "openrouter-mock never came up"
        cat "$GITHUB_WORKSPACE/openrouter-mock.log" || true
        exit 1

    - name: Resolve worker baseURL
      id: worker_base_url
      shell: bash
      env:
        EXPLICIT: ${{ inputs.openrouter-base-url }}
        PORT: ${{ inputs.mock-port }}
      run: |
        if [ -n "$EXPLICIT" ]; then
          echo "value=$EXPLICIT" >> "$GITHUB_OUTPUT"
        else
          echo "value=http://127.0.0.1:${PORT}/v1" >> "$GITHUB_OUTPUT"
        fi

    - name: Start worker
      working-directory: worker
      shell: bash
      env:
        REDIS_URL: ${{ inputs.redis-url }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        # mock-exception: MB-4 — 워커를 위 mock 으로 물리는 주입 지점.
        OPENROUTER_BASE_URL: ${{ steps.worker_base_url.outputs.value }}
        OPENROUTER_MODEL: ${{ inputs.openrouter-model }}
        LOG_LEVEL: ${{ inputs.log-level }}
        LANGFUSE_PUBLIC_KEY: ${{ inputs.langfuse-public-key }}
        LANGFUSE_SECRET_KEY: ${{ inputs.langfuse-secret-key }}
        LANGFUSE_BASE_URL: ${{ inputs.langfuse-baseurl }}
      run: |
        echo "worker env:"
        echo "  REDIS_URL=$REDIS_URL"
        echo "  OPENROUTER_BASE_URL=$OPENROUTER_BASE_URL"
        echo "  OPENROUTER_MODEL=$OPENROUTER_MODEL"
        echo "  LOG_LEVEL=$LOG_LEVEL"
        echo "  OPENROUTER_API_KEY=$(printf '%s' "$OPENROUTER_API_KEY" | head -c 6)..."
        if [ -n "$LANGFUSE_PUBLIC_KEY" ] && [ -n "$LANGFUSE_SECRET_KEY" ]; then
          echo "  LANGFUSE_PUBLIC_KEY=$(printf '%s' "$LANGFUSE_PUBLIC_KEY" | head -c 6)..."
          echo "  LANGFUSE_BASE_URL=$LANGFUSE_BASE_URL"
        else
          echo "  LANGFUSE: disabled (keys not set — tracer provider unset, spans dropped)"
        fi
        nohup ./worker-bin > worker.log 2>&1 &
        echo $! > worker.pid
        sleep 2
        if ! kill -0 "$(cat worker.pid)"; then
          echo "Worker died on startup"
          cat worker.log
          exit 1
        fi
        echo "Worker started (pid=$(cat worker.pid))"
        echo "--- initial worker.log ---"
        cat worker.log
        echo "--- end ---"
