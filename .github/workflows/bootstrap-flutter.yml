name: Bootstrap Flutter Project

on:
  pull_request:
    branches: [main]

jobs:
  bootstrap:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/health-endpoint-e2e-tests-EVsxW

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: stable

      - name: Generate Flutter platform files
        run: |
          cd app
          flutter create --org com.dearbaby --project-name dear_baby .

      - name: Patch Android cleartext HTTP
        run: |
          cd app
          sed -i '' 's/android:name="${applicationName}"/android:name="${applicationName}" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Patch iOS local networking
        run: |
          cd app
          plutil -replace NSAppTransportSecurity -json '{"NSAllowsLocalNetworking":true}' ios/Runner/Info.plist

      - name: Commit and push platform files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/
          git status
          git commit -m "Add Flutter platform files (android, ios, web, linux, macos, windows)

          Generated by flutter create and patched for e2e testing:
          - Android: usesCleartextTraffic enabled
          - iOS: NSAllowsLocalNetworking enabled

          https://claude.ai/code/session_01FLbgdVYHnAEZHjWekQL44r"
          git push origin claude/health-endpoint-e2e-tests-EVsxW
