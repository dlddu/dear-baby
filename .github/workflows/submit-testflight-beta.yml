name: Submit iOS to TestFlight (Beta Review)

# Triggered when a PR is labeled `closed-beta` (shared with the
# Android closed deployment workflow). Builds a fresh Release IPA
# against the production backend, uploads it to TestFlight, then
# promotes that build to the external group and submits it for
# Beta App Review.
#
# The PR-preview build that ci.yml's deploy-testflight job uploaded is
# bound to the staging API URL; external testers need the production
# URL, so we rebuild from the same commit instead of promoting the
# staging-flavored IPA. Build numbers are per-run, so this run's
# `github.run_number` becomes the buildNumber Fastlane promotes below.
#
# A future App Store production release should use a separate label
# (and workflow), so this label-name guard keeps the two paths from
# colliding.
on:
  pull_request:
    types: [labeled]

# Per-SHA so different commits don't block each other; a re-label of
# the same SHA queues behind any in-flight submission.
concurrency:
  group: closed-beta-ios-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build with production API URL
    if: github.event.label.name == 'closed-beta'
    uses: ./.github/workflows/build-ios-testflight.yml
    with:
      expo-public-api-url: ${{ vars.EXPO_PUBLIC_API_URL_PRODUCTION }}
      app-env: production
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  submit:
    name: Submit to TestFlight Beta Review
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      TESTFLIGHT_EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP }}
      TESTFLIGHT_BETA_CONTACT_FIRST_NAME: ${{ vars.TESTFLIGHT_BETA_CONTACT_FIRST_NAME }}
      TESTFLIGHT_BETA_CONTACT_LAST_NAME: ${{ vars.TESTFLIGHT_BETA_CONTACT_LAST_NAME }}
      TESTFLIGHT_BETA_FEEDBACK_EMAIL: ${{ vars.TESTFLIGHT_BETA_FEEDBACK_EMAIL }}
      TESTFLIGHT_BETA_PRIVACY_URL: ${{ vars.TESTFLIGHT_BETA_PRIVACY_URL }}
      TESTFLIGHT_BETA_APP_DESCRIPTION: ${{ vars.TESTFLIGHT_BETA_APP_DESCRIPTION }}
      TESTFLIGHT_BETA_CONTACT_EMAIL: ${{ secrets.TESTFLIGHT_BETA_CONTACT_EMAIL }}
      TESTFLIGHT_BETA_CONTACT_PHONE: ${{ secrets.TESTFLIGHT_BETA_CONTACT_PHONE }}
      TESTFLIGHT_DEMO_ACCOUNT_EMAIL: ${{ secrets.TESTFLIGHT_DEMO_ACCOUNT_EMAIL }}
      TESTFLIGHT_DEMO_ACCOUNT_PASSWORD: ${{ secrets.TESTFLIGHT_DEMO_ACCOUNT_PASSWORD }}
      TESTFLIGHT_REVIEW_LOCALE: ${{ vars.TESTFLIGHT_REVIEW_LOCALE }}
      GIT_SHA: ${{ github.event.pull_request.head.sha }}
      TESTFLIGHT_BUILD_NUMBER: ${{ needs.build.outputs.build-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: app

      - name: Fastlane external_beta
        run: bundle exec fastlane external_beta
