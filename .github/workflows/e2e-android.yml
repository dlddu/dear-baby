name: E2E Tests (Android)

on:
  workflow_call:

jobs:
  e2e-android:
    name: E2E Tests (Android)
    # x86_64 Linux runner with KVM enabled for hardware-accelerated emulation.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      # Redis service container — backend/worker connect on localhost.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8080
      # Seeded password-backed test account (see backend/internal/auth/seed.go).
      # Same code path runs in production — the gesture on the landing
      # screen plus knowledge of the password is the only gate. CI uses
      # a fixed throwaway value; the App Store reviewer credential is
      # provisioned separately via TestFlight notes.
      TEST_USER_EMAIL: "tester@dear-baby.test"
      TEST_USER_PASSWORD: "ci-tester-password-do-not-reuse"
      TEST_USER_NAME: "CI Tester"
      MAESTRO_TEST_USER_EMAIL: "tester@dear-baby.test"
      MAESTRO_TEST_USER_PASSWORD: "ci-tester-password-do-not-reuse"
      REDIS_URL: "redis://localhost:6379"
      # Drive the voice maestro flow with a deterministic recorder + STT.
      # The upload step is NOT short-circuited — it actually hits the
      # MinIO instance set up below, so the records-audio backend
      # contract gets exercised end-to-end in CI.
      EXPO_PUBLIC_E2E_AUDIO_FIXTURE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Stand MinIO up first so its AWS_* env vars land in $GITHUB_ENV
      # before setup-backend reads them.
      - name: Setup MinIO
        uses: ./.github/actions/setup-minio

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          redis-url: ${{ env.REDIS_URL }}

      # Build the reset-user CLI alongside the server so the maestro
      # suite below can wipe the seeded test user's per-user state
      # (onboarding flags, children, fetuses, records) between runs
      # that need a fresh funnel. Lives inside the backend module so
      # it shares config + migrations.
      - name: Build reset-user tool
        working-directory: backend
        run: go build -o reset-user ./cmd/reset-user

      - name: Setup AI worker
        uses: ./.github/actions/setup-ai-worker
        with:
          redis-url: ${{ env.REDIS_URL }}
          # No openrouter-api-key / openrouter-base-url passed: the
          # action stands up the local mock server and points the
          # worker at it.
          langfuse-public-key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse-baseurl: ${{ secrets.LANGFUSE_BASEURL }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup JS
        uses: ./.github/actions/setup-js

      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro

      # Allow non-root access to /dev/kvm so the emulator can use hardware
      # acceleration (required for reasonable emulator boot/test times).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Expo prebuild (Android)
        working-directory: app
        run: npx expo prebuild --platform android --clean

      # Android 9+ blocks cleartext HTTP in release builds by default. The
      # Expo prebuild template only enables it for the debug variant (via
      # `debug/AndroidManifest.xml`). For this E2E test we hit the host
      # backend over plain http://10.0.2.2:8080 from a Release APK, so we
      # patch the main manifest to allow cleartext. CI-only hack.
      - name: Allow cleartext HTTP in Android manifest
        run: |
          MANIFEST=app/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application |<application android:usesCleartextTraffic="true" |' "$MANIFEST"
          grep -q 'usesCleartextTraffic="true"' "$MANIFEST" || { echo "manifest patch failed"; cat "$MANIFEST"; exit 1; }

      # Build the APK BEFORE starting the emulator. The assemble task does
      # not need a device, and running it inside the emulator-runner script
      # would leave the emulator idle for ~25 minutes, which reliably
      # triggers a "Pixel Launcher isn't responding" ANR dialog that
      # covers the app under test.
      - name: Build Android release APK
        working-directory: app/android
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8080
          EXPO_PUBLIC_E2E_AUDIO_FIXTURE: "1"
        run: |
          echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL"
          echo "EXPO_PUBLIC_E2E_AUDIO_FIXTURE=$EXPO_PUBLIC_E2E_AUDIO_FIXTURE"
          ./gradlew assembleRelease --no-daemon

      # reactivecircus/android-emulator-runner splits `script:` on newlines and
      # runs each line as its own `sh -c`, so `cd` and shell options don't
      # persist across lines. We instead write the whole flow to a file and
      # invoke it with a single-line command.
      - name: Prepare e2e script
        run: |
          cat > /tmp/e2e-android.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -eux

          # Give the system launcher time to fully settle on a cold boot and
          # dismiss any stray "isn't responding" dialogs before we start.
          adb shell input keyevent KEYCODE_WAKEUP || true
          adb shell input keyevent KEYCODE_HOME || true
          sleep 10
          for _ in 1 2 3; do
            if adb shell dumpsys window windows 2>/dev/null | grep -q "isn't responding"; then
              adb shell input keyevent KEYCODE_BACK || true
              sleep 2
            else
              break
            fi
          done

          # Reverse-port-forward MinIO so the app sees host:9000 as
          # localhost:9000 inside the emulator. The presigned PUT URL
          # the backend hands the app uses host=localhost (since
          # AWS_ENDPOINT_URL_S3 is set to http://localhost:9000), and
          # SigV4 ties the URL to that exact host — using 10.0.2.2
          # would break the signature.
          adb reverse tcp:9000 tcp:9000

          cd "$GITHUB_WORKSPACE/app"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          echo "Installing $APK"
          adb install -r "$APK"
          adb shell monkey -p com.dlddu.dearbaby -c android.intent.category.LAUNCHER 1
          sleep 3

          run_flow() {
            maestro test \
              --env MAESTRO_TEST_USER_EMAIL="$MAESTRO_TEST_USER_EMAIL" \
              --env MAESTRO_TEST_USER_PASSWORD="$MAESTRO_TEST_USER_PASSWORD" \
              "$1"
          }
          reset_user() {
            (cd "$GITHUB_WORKSPACE/backend" && ./reset-user "$TEST_USER_EMAIL")
          }

          run_flow .maestro/health.yaml
          reset_user
          run_flow .maestro/login.yaml
          reset_user
          run_flow .maestro/onboarding-caseA.yaml
          reset_user
          run_flow .maestro/onboarding-caseB.yaml
          reset_user
          run_flow .maestro/onboarding-caseC.yaml
          reset_user
          run_flow .maestro/home-record-ctas.yaml
          reset_user
          run_flow .maestro/home-question-card-undecided.yaml
          reset_user
          run_flow .maestro/home-voice-record.yaml
          SCRIPT
          chmod +x /tmp/e2e-android.sh

      - name: Run Android emulator and tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8080
          # Mirror the workflow-level env so the e2e script subshell
          # sees them when it invokes maestro and reset-user.
          TEST_USER_EMAIL: ${{ env.TEST_USER_EMAIL }}
          MAESTRO_TEST_USER_EMAIL: ${{ env.MAESTRO_TEST_USER_EMAIL }}
          MAESTRO_TEST_USER_PASSWORD: ${{ env.MAESTRO_TEST_USER_PASSWORD }}
        with:
          # API 30 + default profile is much more stable than API 34 + pixel_6
          # on a cold-booted emulator — the heavier Pixel Launcher on 34
          # reliably ANRs during the HOME transition that Maestro triggers
          # when it does `launchApp` with `clearState: true`.
          api-level: 30
          target: default
          arch: x86_64
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash /tmp/e2e-android.sh

      - name: Upload Maestro debug artifacts
        if: always()
        uses: ./.github/actions/upload-maestro-artifacts
        with:
          name: maestro-android-output

      - name: Upload backend + worker logs
        if: always()
        uses: ./.github/actions/upload-service-logs
        with:
          name: e2e-android

      - name: Stop worker
        if: always()
        working-directory: worker
        run: |
          if [ -f worker.pid ]; then
            kill "$(cat worker.pid)" || true
          fi

      - name: Stop openrouter-mock
        if: always()
        run: |
          if [ -f openrouter-mock.pid ]; then
            kill "$(cat openrouter-mock.pid)" || true
          fi

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
