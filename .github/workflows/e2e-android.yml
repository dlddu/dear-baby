name: E2E Tests (Android)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app/**"
      - ".github/workflows/e2e-android.yml"
  pull_request:
    paths:
      - "backend/**"
      - "app/**"
      - ".github/workflows/e2e-android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    # Native ARM64 Linux runner. Note: KVM is NOT exposed on this runner image
    # (see actions/partner-runner-images#147), so the emulator runs under
    # QEMU TCG. An arm64-v8a guest on an arm64 host still works (no instruction
    # translation), just slower than KVM-accelerated x86_64. If this proves too
    # slow, switch runs-on to ubuntu-latest and arch to x86_64 with api-level 35
    # (which supports ARM-on-x86 ABI translation).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build backend (linux/arm64)
        working-directory: backend
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -o server .

      - name: Start backend
        working-directory: backend
        run: |
          nohup ./server > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          cat server.log
          exit 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        working-directory: app
        run: npm ci

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Verify Maestro
        run: maestro --version

      # No-op on ubuntu-24.04-arm (no /dev/kvm), but harmless. Kept for clarity
      # and for the x86_64 fallback path.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true

      - name: Expo prebuild (Android)
        working-directory: app
        run: npx expo prebuild --platform android --clean

      - name: Run Android emulator and tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8080
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euxo pipefail
            cd app/android
            # Release build embeds the JS bundle via the RN Gradle plugin
            # (bundleReleaseJsAndAssets). Signed with the debug keystore by
            # default, which is fine for CI E2E runs.
            ./gradlew assembleRelease --no-daemon
            cd ..
            APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
            echo "Installing $APK"
            adb install -r "$APK"
            adb shell monkey -p com.dlddu.dearbaby -c android.intent.category.LAUNCHER 1
            sleep 3
            maestro test .maestro/health.yaml

      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-output
          path: |
            ~/.maestro/tests/
            app/.maestro/
          if-no-files-found: ignore

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
