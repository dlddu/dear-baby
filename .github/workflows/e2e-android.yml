name: E2E Tests (Android)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app/**"
      - ".github/workflows/e2e-android.yml"
  pull_request:
    paths:
      - "backend/**"
      - "app/**"
      - ".github/workflows/e2e-android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    # x86_64 Linux runner with KVM enabled for hardware-accelerated emulation.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build backend
        working-directory: backend
        run: go build -o server .

      - name: Start backend
        working-directory: backend
        run: |
          nohup ./server > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          cat server.log
          exit 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        working-directory: app
        run: npm ci

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Verify Maestro
        run: maestro --version

      # Allow non-root access to /dev/kvm so the emulator can use hardware
      # acceleration (required for reasonable emulator boot/test times).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Expo prebuild (Android)
        working-directory: app
        run: npx expo prebuild --platform android --clean

      # Android 9+ blocks cleartext HTTP in release builds by default. The
      # Expo prebuild template only enables it for the debug variant (via
      # `debug/AndroidManifest.xml`). For this E2E test we hit the host
      # backend over plain http://10.0.2.2:8080 from a Release APK, so we
      # patch the main manifest to allow cleartext. CI-only hack.
      - name: Allow cleartext HTTP in Android manifest
        run: |
          MANIFEST=app/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application |<application android:usesCleartextTraffic="true" |' "$MANIFEST"
          grep -q 'usesCleartextTraffic="true"' "$MANIFEST" || { echo "manifest patch failed"; cat "$MANIFEST"; exit 1; }

      # reactivecircus/android-emulator-runner splits `script:` on newlines and
      # runs each line as its own `sh -c`, so `cd` and shell options don't
      # persist across lines. We instead write the whole flow to a file and
      # invoke it with a single-line command.
      - name: Prepare e2e script
        run: |
          cat > /tmp/e2e-android.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -eux
          echo "EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-<unset>}"
          cd "$GITHUB_WORKSPACE/app/android"
          # Release build embeds the JS bundle via the RN Gradle plugin
          # (bundleReleaseJsAndAssets). Signed with the debug keystore by
          # default, which is fine for CI E2E runs.
          ./gradlew assembleRelease --no-daemon
          cd ..
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          echo "Installing $APK"
          adb install -r "$APK"
          adb shell monkey -p com.dlddu.dearbaby -c android.intent.category.LAUNCHER 1
          sleep 3
          maestro test .maestro/health.yaml
          SCRIPT
          chmod +x /tmp/e2e-android.sh

      - name: Run Android emulator and tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8080
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash /tmp/e2e-android.sh

      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-output
          path: |
            ~/.maestro/tests/
            app/.maestro/
          if-no-files-found: ignore

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
