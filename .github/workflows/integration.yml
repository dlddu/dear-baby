name: integration
on:
  workflow_call:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: ghcr.io/dlddu/dear-baby:ci
          cache-from: type=gha

      # LANGFUSE_{PUBLIC,SECRET}_KEY, when present, activate the
      # observeOpenAI wrapper inside the worker so CI runs ship traces.
      # Both keys are required together; the worker deployment references
      # langfuse-secret as optional, so absence is a no-op pass-through.
      - name: Check Langfuse keys
        id: has_langfuse_keys
        env:
          LF_PUB: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LF_SEC: ${{ secrets.LANGFUSE_SECRET_KEY }}
        run: |
          if [ -n "$LF_PUB" ] && [ -n "$LF_SEC" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "::warning::LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY not set — worker will run without Langfuse tracing"
          fi

      - name: Build worker image (local)
        uses: docker/build-push-action@v6
        with:
          context: worker
          file: worker/Dockerfile
          push: false
          load: true
          tags: ghcr.io/dlddu/dear-baby-worker:ci
          cache-from: type=gha

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: dear-baby-integration

      - name: Load backend image into kind
        run: kind load docker-image ghcr.io/dlddu/dear-baby:ci --name dear-baby-integration

      - name: Load worker image into kind
        run: kind load docker-image ghcr.io/dlddu/dear-baby-worker:ci --name dear-baby-integration

      # Seed the auth secret the backend reads from before applying the
      # Deployment — with this in place the AI-preview routes come online,
      # which the checks below exercise end-to-end.
      - name: Create auth secret
        run: |
          kubectl create secret generic auth-secret \
            --from-literal=JWT_SECRET=integration-jwt-secret

      # CI uses an in-cluster mock OpenRouter server (see step below), so
      # the API key is non-secret and just needs to be non-empty for the
      # worker's requireEnv check. OPENROUTER_MODEL also ships via this
      # secret (matches the production worker-deployment wiring).
      - name: Create OpenRouter secret (mock)
        run: |
          kubectl create secret generic openrouter-secret \
            --from-literal=OPENROUTER_API_KEY=ci-mock-key \
            --from-literal=OPENROUTER_MODEL=openrouter-mock

      # Worker's envFrom references langfuse-secret as optional: true, so
      # it's safe to skip this when keys aren't configured. Default base
      # URL is US (our account region); override by setting the
      # LANGFUSE_BASE_URL GitHub secret.
      - name: Create Langfuse secret
        if: steps.has_langfuse_keys.outputs.value == 'true'
        env:
          LF_PUB: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LF_SEC: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LF_BASE: ${{ secrets.LANGFUSE_BASE_URL }}
        run: |
          kubectl create secret generic langfuse-secret \
            --from-literal=LANGFUSE_PUBLIC_KEY="$LF_PUB" \
            --from-literal=LANGFUSE_SECRET_KEY="$LF_SEC" \
            --from-literal=LANGFUSE_BASE_URL="${LF_BASE:-https://us.cloud.langfuse.com}"

      # Stand up the mock OpenRouter server in-cluster. The worker's
      # OPENROUTER_BASE_URL env (set below) points its OpenAI client at
      # this Service so chat.completions calls never leave the cluster.
      - name: Deploy openrouter-mock
        run: |
          kubectl create configmap openrouter-mock-script \
            --from-file=server.js=scripts/openrouter-mock/server.js
          kubectl apply -f scripts/openrouter-mock/deployment.yaml

      # MinIO stands in for S3 inside the kind cluster. The backend
      # talks to it via AWS_ENDPOINT_URL_S3 + AWS_S3_FORCE_PATH_STYLE=1
      # (set further down). Bucket creation runs as a follow-up step
      # once the Deployment is ready.
      - name: Deploy MinIO
        run: |
          kubectl apply -f scripts/minio/deployment.yaml

      # Records-audio config secret. Prod ships AWS_ASSUME_ROLE_ARN
      # here and relies on IRSA for bootstrap creds (no static keys in
      # the secret). CI doesn't have IRSA, so this secret carries the
      # MinIO root credentials directly + the endpoint overrides.
      # AWS_ASSUME_ROLE_ARN is intentionally omitted: there's no STS
      # endpoint to call against MinIO.
      - name: Create aws-records-audio secret (MinIO config)
        run: |
          kubectl create secret generic aws-records-audio \
            --from-literal=AWS_REGION=us-east-1 \
            --from-literal=AWS_S3_BUCKET=dear-baby-ci \
            --from-literal=AWS_S3_KEY_PREFIX=ci/ \
            --from-literal=AWS_S3_FORCE_PATH_STYLE=1 \
            --from-literal=AWS_ENDPOINT_URL_S3=http://minio:9000 \
            --from-literal=AWS_ACCESS_KEY_ID=ci-minio-access-key \
            --from-literal=AWS_SECRET_ACCESS_KEY=ci-minio-secret-key

      - name: Apply backend + Redis manifests
        run: |
          sed -i \
            -e 's|ghcr.io/dlddu/dear-baby:latest|ghcr.io/dlddu/dear-baby:ci|' \
            -e 's|imagePullPolicy: Always|imagePullPolicy: Never|' \
            k8s/deployment.yaml
          kubectl apply \
            -f k8s/deployment.yaml \
            -f k8s/service.yaml \
            -f k8s/pvc.yaml \
            -f k8s/redis-deployment.yaml \
            -f k8s/redis-service.yaml

      - name: Apply worker manifest
        run: |
          sed -i \
            -e 's|ghcr.io/dlddu/dear-baby-worker:latest|ghcr.io/dlddu/dear-baby-worker:ci|' \
            -e 's|imagePullPolicy: Always|imagePullPolicy: Never|' \
            k8s/worker-deployment.yaml
          kubectl apply -f k8s/worker-deployment.yaml

      # Redirect the worker at the in-cluster mock. Triggers a rollout,
      # which the wait-for-worker step below blocks on.
      - name: Point worker at openrouter-mock
        run: |
          kubectl set env deployment/worker \
            OPENROUTER_BASE_URL=http://openrouter-mock:8088/v1

      # Enable /auth/test-login so the end-to-end test can mint a
      # session without going through Google OAuth. Only effective on
      # this cluster; the production manifests don't carry this env.
      # Triggers a backend rollout.
      - name: Enable test auth on backend
        run: |
          kubectl set env deployment/dear-baby TEST_AUTH_ENABLED=true

      - name: Wait for MinIO rollout
        run: kubectl rollout status deployment/minio --timeout=120s

      # Create the bucket using mc against the in-cluster Service. The
      # bucket name + access keys mirror the env wired into the backend
      # above. `--ignore-existing` keeps reruns safe.
      - name: Create MinIO bucket
        run: |
          kubectl run --rm -i --restart=Never --image=minio/mc:latest mc-mkbucket \
            -- sh -c '
              mc alias set local http://minio:9000 ci-minio-access-key ci-minio-secret-key &&
              mc mb -p local/dear-baby-ci
            '

      - name: Wait for Redis rollout
        run: kubectl rollout status deployment/redis --timeout=120s

      - name: Wait for backend rollout
        # Backend pings Redis at startup; a failure here means the pod
        # couldn't reach the Redis service or env vars weren't plumbed
        # through.
        run: kubectl rollout status deployment/dear-baby --timeout=180s

      - name: Wait for openrouter-mock rollout
        run: kubectl rollout status deployment/openrouter-mock --timeout=120s

      - name: Wait for worker rollout
        run: kubectl rollout status deployment/worker --timeout=120s

      - name: Diagnostics on rollout failure
        if: failure()
        run: |
          echo "::group::kubectl get all -o wide"
          kubectl get all -o wide || true
          echo "::endgroup::"
          echo "::group::kubectl describe deployment/dear-baby"
          kubectl describe deployment/dear-baby || true
          echo "::endgroup::"
          echo "::group::kubectl describe deployment/redis"
          kubectl describe deployment/redis || true
          echo "::endgroup::"
          echo "::group::kubectl describe deployment/worker"
          kubectl describe deployment/worker || true
          kubectl describe deployment/openrouter-mock || true
          kubectl describe deployment/minio || true
          echo "::endgroup::"
          echo "::group::kubectl describe pods"
          kubectl describe pods -l app=dear-baby || true
          kubectl describe pods -l app=redis || true
          kubectl describe pods -l app=worker || true
          kubectl describe pods -l app=openrouter-mock || true
          kubectl describe pods -l app=minio || true
          echo "::endgroup::"
          echo "::group::kubectl logs"
          kubectl logs deployment/dear-baby --tail=200 --all-containers=true || true
          kubectl logs deployment/dear-baby --tail=200 --all-containers=true --previous || true
          kubectl logs deployment/redis --tail=200 --all-containers=true || true
          kubectl logs deployment/worker --tail=200 --all-containers=true || true
          kubectl logs deployment/openrouter-mock --tail=200 --all-containers=true || true
          kubectl logs deployment/minio --tail=200 --all-containers=true || true
          echo "::endgroup::"
          echo "::group::kubectl get events"
          kubectl get events --sort-by=.lastTimestamp || true
          echo "::endgroup::"

      - name: Port-forward backend
        run: |
          kubectl port-forward svc/dear-baby 18080:8080 >/tmp/pf.log 2>&1 &
          echo $! > /tmp/pf.pid
          # Wait for the forward to accept.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              echo "port-forward ready"
              exit 0
            fi
            sleep 1
          done
          echo "port-forward never came up"
          cat /tmp/pf.log
          exit 1

      - name: Integration test /health via Service
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:18080/health >/tmp/resp.json
          echo "response: $(cat /tmp/resp.json)"
          grep -q '"status":"ok"' /tmp/resp.json
          echo "health check passed"

      - name: Backend connected to Redis
        # REDIS_URL is wired as a plain env var on the deployment; if
        # the backend failed to ping Redis on boot, the rollout above
        # would have timed out. Belt-and-braces: confirm the "disabled"
        # warning is not in the logs.
        run: |
          set -euo pipefail
          if kubectl logs deployment/dear-baby --tail=500 | grep -q 'REDIS_URL not set'; then
            echo "backend logs claim REDIS_URL is unset — secret wiring broken"
            kubectl logs deployment/dear-baby --tail=500
            exit 1
          fi
          echo "backend Redis wiring OK"

      - name: AI preview enqueue path is gated on Redis
        # POST /onboarding/ai-preview requires a valid access token from
        # the auth pipeline. Assert that the route exists (401) rather
        # than 404 — a 404 would mean the Redis-dependent route group
        # didn't mount.
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/body.txt -w '%{http_code}' \
            -X POST http://127.0.0.1:18080/onboarding/ai-preview)
          if [ "$code" != "401" ]; then
            echo "expected 401 (route exists, auth missing), got $code, body=$(cat /tmp/body.txt)"
            exit 1
          fi
          echo "AI preview route mounted (401 on unauth) OK"

      # ─── End-to-end: mock OpenRouter call via the worker ─────────────
      #
      # Goes all the way through: test-login → record save → AI preview
      # enqueue → worker reads queue → openrouter-mock chat completion →
      # publishes result → backend hub processor persists → /me reflects
      # ai_preview. Prints the generated preview to the job log for
      # visual inspection of each CI run.

      - name: AI preview end-to-end (test-login → record → worker → /me)
        run: |
          set -euo pipefail

          echo "::group::test-login"
          session=$(curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -d '{"email":"integration@dear-baby.test","onboarded":true}' \
            http://127.0.0.1:18080/auth/test-login)
          echo "$session" | head -c 200
          echo
          access_token=$(echo "$session" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          user_id=$(echo "$session" | python3 -c 'import json,sys; print(json.load(sys.stdin)["user"]["id"])')
          echo "user_id=$user_id"
          echo "::endgroup::"

          echo "::group::create record"
          curl -fsS -X POST \
            -H "Authorization: Bearer $access_token" \
            -H 'Content-Type: application/json' \
            -d '{"content":"today i felt you move for the first time"}' \
            http://127.0.0.1:18080/records >/tmp/record.json
          cat /tmp/record.json | head -c 400
          echo
          echo "::endgroup::"

          echo "::group::request AI preview"
          code=$(curl -s -o /tmp/req.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $access_token" \
            http://127.0.0.1:18080/onboarding/ai-preview)
          if [ "$code" != "202" ]; then
            echo "expected 202, got $code body=$(cat /tmp/req.txt)"
            exit 1
          fi
          echo "enqueue accepted (202)"
          echo "::endgroup::"

          echo "::group::poll /me for ai_preview (up to 45s)"
          preview=""
          for i in $(seq 1 45); do
            preview=$(curl -fsS \
              -H "Authorization: Bearer $access_token" \
              http://127.0.0.1:18080/me \
              | python3 -c 'import json,sys; v=json.load(sys.stdin).get("ai_preview") or ""; print(v)')
            if [ -n "$preview" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "$preview" ]; then
            echo "ai_preview did not arrive within 45s"
            echo "--- worker logs ---"
            kubectl logs deployment/worker --tail=300 --all-containers=true || true
            echo "--- backend logs ---"
            kubectl logs deployment/dear-baby --tail=300 --all-containers=true || true
            exit 1
          fi
          echo "ai_preview received:"
          echo "---"
          echo "$preview"
          echo "---"
          echo "::endgroup::"

          echo "::group::worker logs (preview_ready entry)"
          # The handler logs {preview, msg: "preview ready"} — grep it
          # so the exact model output is visible in the job log too.
          kubectl logs deployment/worker --tail=500 --all-containers=true \
            | grep -E 'preview ready|preview generation failed' \
            || { echo "no preview log line found"; kubectl logs deployment/worker --tail=500 --all-containers=true; exit 1; }
          echo "::endgroup::"

      # ─── End-to-end: voice record + audio upload via MinIO ────────────
      #
      # Verifies the full three-step contract documented in
      # docs/engineering/audio-storage.md:
      #
      #   1. POST /records {source: voice}         → record_id, audio_s3_key=null
      #   2. POST /records/{id}/audio/upload-url    → presigned PUT + key
      #   3. PUT presigned-url                      → bytes land in MinIO
      #   4. PATCH /records/{id} {audio_s3_key}     → server HEAD-checks, persists
      #
      # The PUT (step 3) runs from a one-shot pod inside the cluster
      # because the presigned URL points at http://minio:9000, which is
      # only resolvable in-cluster. The runner can't reach minio
      # directly even with port-forward — the host inside the URL
      # would still be `minio`.
      - name: Voice record + audio upload e2e
        run: |
          set -euo pipefail

          echo "::group::test-login"
          session=$(curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -d '{"email":"audio@dear-baby.test","onboarded":true}' \
            http://127.0.0.1:18080/auth/test-login)
          access_token=$(echo "$session" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          echo "::endgroup::"

          echo "::group::create voice record"
          curl -fsS -X POST \
            -H "Authorization: Bearer $access_token" \
            -H 'Content-Type: application/json' \
            -d '{"content":"오늘 처음으로 너의 발길질을 느꼈어","source":"voice"}' \
            http://127.0.0.1:18080/records >/tmp/voice-rec.json
          record_id=$(python3 -c 'import json; print(json.load(open("/tmp/voice-rec.json"))["record"]["id"])')
          source=$(python3 -c 'import json; print(json.load(open("/tmp/voice-rec.json"))["record"]["source"])')
          audio_key=$(python3 -c 'import json; print(json.load(open("/tmp/voice-rec.json"))["record"]["audio_s3_key"])')
          echo "record_id=$record_id source=$source audio_s3_key=$audio_key"
          if [ "$source" != "voice" ]; then
            echo "expected source=voice, got $source"; exit 1
          fi
          if [ "$audio_key" != "None" ]; then
            echo "expected audio_s3_key=null on creation, got $audio_key"; exit 1
          fi
          echo "::endgroup::"

          echo "::group::request presigned upload URL"
          curl -fsS -X POST \
            -H "Authorization: Bearer $access_token" \
            "http://127.0.0.1:18080/records/$record_id/audio/upload-url" >/tmp/presign.json
          upload_url=$(python3 -c 'import json; print(json.load(open("/tmp/presign.json"))["upload_url"])')
          server_audio_key=$(python3 -c 'import json; print(json.load(open("/tmp/presign.json"))["audio_s3_key"])')
          content_type=$(python3 -c 'import json; print(json.load(open("/tmp/presign.json"))["content_type"])')
          echo "audio_s3_key=$server_audio_key content_type=$content_type"
          # Backend should return the canonical key under our configured
          # prefix; "ci/users/{uid}/records/{rid}.m4a" shape.
          case "$server_audio_key" in
            ci/users/*/records/*.m4a) ;;
            *) echo "unexpected key shape: $server_audio_key"; exit 1 ;;
          esac
          echo "::endgroup::"

          echo "::group::PUT audio bytes via in-cluster pod"
          # Pass the URL via env (no quoting hell) and pipe a small
          # placeholder body. The Content-Type must match what the
          # backend signed — the SDK rejects mismatches with
          # SignatureDoesNotMatch.
          echo "fixture audio bytes - $(date -u +%s)" > /tmp/audio.m4a
          kubectl run --rm -i --restart=Never --image=curlimages/curl:latest s3-uploader \
            --env="UPLOAD_URL=$upload_url" \
            --env="CONTENT_TYPE=$content_type" \
            -- sh -c 'curl -fsS -X PUT -H "Content-Type: $CONTENT_TYPE" --data-binary @- "$UPLOAD_URL"' \
            < /tmp/audio.m4a
          echo "::endgroup::"

          echo "::group::PATCH record with audio_s3_key"
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $access_token" \
            -H 'Content-Type: application/json' \
            -d "{\"audio_s3_key\":\"$server_audio_key\"}" \
            "http://127.0.0.1:18080/records/$record_id" >/tmp/patched.json
          stored_key=$(python3 -c 'import json; print(json.load(open("/tmp/patched.json"))["record"]["audio_s3_key"])')
          if [ "$stored_key" != "$server_audio_key" ]; then
            echo "audio_s3_key mismatch: stored=$stored_key sent=$server_audio_key"; exit 1
          fi
          echo "audio_s3_key persisted: $stored_key"
          echo "::endgroup::"

          echo "::group::verify object exists in MinIO"
          kubectl run --rm -i --restart=Never --image=minio/mc:latest mc-stat \
            -- sh -c '
              mc alias set local http://minio:9000 ci-minio-access-key ci-minio-secret-key &&
              mc stat local/dear-baby-ci/'"$server_audio_key"'
            '
          echo "::endgroup::"

          echo "::group::PATCH again should 409 (one-way attach)"
          code=$(curl -s -o /tmp/patch2.txt -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $access_token" \
            -H 'Content-Type: application/json' \
            -d "{\"audio_s3_key\":\"$server_audio_key\"}" \
            "http://127.0.0.1:18080/records/$record_id")
          if [ "$code" != "409" ]; then
            echo "expected 409 (already attached), got $code body=$(cat /tmp/patch2.txt)"; exit 1
          fi
          echo "second PATCH correctly rejected with 409"
          echo "::endgroup::"

      - name: Audio upload e2e — cross-user prefix is rejected
        # Negative test: even with a valid presigned URL for one user,
        # PATCHing a different user's record with that key must 400 on
        # the server's prefix-validation check. This is the security
        # boundary preventing key tampering.
        run: |
          set -euo pipefail

          # Two sessions for two different users.
          a=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"email":"a@dear-baby.test","onboarded":true}' \
            http://127.0.0.1:18080/auth/test-login)
          a_token=$(echo "$a" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')

          b=$(curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"email":"b@dear-baby.test","onboarded":true}' \
            http://127.0.0.1:18080/auth/test-login)
          b_token=$(echo "$b" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')

          # B creates a record.
          b_rec=$(curl -fsS -X POST \
            -H "Authorization: Bearer $b_token" \
            -H 'Content-Type: application/json' \
            -d '{"content":"b transcript","source":"voice"}' \
            http://127.0.0.1:18080/records)
          b_record_id=$(echo "$b_rec" | python3 -c 'import json,sys; print(json.load(sys.stdin)["record"]["id"])')

          # A tries to PATCH B's record with a key from B's namespace
          # (after intercepting it somehow). The handler must reject
          # because the URL's record id is B's but the user context is A.
          b_presign=$(curl -fsS -X POST \
            -H "Authorization: Bearer $b_token" \
            "http://127.0.0.1:18080/records/$b_record_id/audio/upload-url")
          b_key=$(echo "$b_presign" | python3 -c 'import json,sys; print(json.load(sys.stdin)["audio_s3_key"])')

          code=$(curl -s -o /tmp/cross.txt -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $a_token" \
            -H 'Content-Type: application/json' \
            -d "{\"audio_s3_key\":\"$b_key\"}" \
            "http://127.0.0.1:18080/records/$b_record_id")
          # B's record is not A's, so A's PATCH should 404 (record not
          # found in A's namespace) before we even reach key validation.
          if [ "$code" != "404" ]; then
            echo "expected 404 cross-user PATCH, got $code body=$(cat /tmp/cross.txt)"; exit 1
          fi
          echo "cross-user PATCH correctly rejected with 404"

      - name: Full worker logs (debug)
        if: always()
        run: |
          kubectl logs deployment/worker --tail=500 --all-containers=true || true
          echo "--- openrouter-mock logs ---"
          kubectl logs deployment/openrouter-mock --tail=500 --all-containers=true || true
          echo "--- minio logs ---"
          kubectl logs deployment/minio --tail=500 --all-containers=true || true

      - name: Stop port-forward
        if: always()
        run: |
          if [ -f /tmp/pf.pid ]; then
            kill "$(cat /tmp/pf.pid)" || true
          fi
