name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      worker: ${{ steps.filter.outputs.worker }}
      app: ${{ steps.filter.outputs.app }}
      k8s: ${{ steps.filter.outputs.k8s }}
      e2e: ${{ steps.filter.outputs.e2e }}
      integration: ${{ steps.filter.outputs.integration }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-image.yml'
              - '.github/actions/setup-backend/**'
            worker:
              - 'worker/**'
              - '.github/workflows/worker-image.yml'
              - '.github/actions/setup-ai-worker/**'
              - 'scripts/openrouter-mock/**'
            # Maestro 플로우는 e2e/maestro/** 로 분리되어 app/** 밖에 있으므로
            # maestro-only 변경 시 deploy-testflight/play 가 자연스럽게 스킵된다.
            app:
              - 'app/**'
              - '.github/workflows/deploy-testflight.yml'
              - '.github/workflows/build-ios-testflight.yml'
              - '.github/workflows/deploy-play-internal.yml'
              - '.github/workflows/build-android-play.yml'
              - '.github/actions/setup-js/**'
            k8s:
              - 'k8s/**'
            e2e:
              - 'e2e/**'
              - '.github/workflows/e2e-ios.yml'
              - '.github/workflows/e2e-android.yml'
              - '.github/actions/setup-maestro/**'
              - '.github/actions/upload-maestro-artifacts/**'
              - '.github/actions/setup-minio/**'
              - '.github/actions/upload-service-logs/**'
            integration:
              - '.github/workflows/integration.yml'
              - 'scripts/minio/**'
              - 'scripts/openrouter-mock/**'
            ci:
              - '.github/workflows/ci.yml'

  integration:
    name: Integration Tests
    needs: [changes]
    if: >-
      needs.changes.outputs.backend == 'true' || needs.changes.outputs.worker == 'true' ||
      needs.changes.outputs.k8s == 'true' || needs.changes.outputs.integration == 'true' ||
      needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/integration.yml
    permissions:
      contents: read
    secrets: inherit

  e2e-ios:
    name: E2E Tests (iOS)
    needs: [changes]
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.worker == 'true' ||
      needs.changes.outputs.app == 'true' || needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/e2e-ios.yml
    secrets: inherit

  e2e-android:
    name: E2E Tests (Android)
    needs: [changes]
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.worker == 'true' ||
      needs.changes.outputs.app == 'true' || needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/e2e-android.yml
    secrets: inherit

  app-unit-tests:
    name: App Unit Tests
    needs: [changes]
    if: >-
      needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-js
      - name: Run Jest
        working-directory: app
        run: npm test -- --ci --colors=false

  build-image:
    name: Build & Push Backend Image
    needs: [integration, e2e-ios, e2e-android, changes]
    if: >-
      !failure() && !cancelled() &&
      needs.integration.result != 'cancelled' &&
      needs.e2e-ios.result != 'cancelled' &&
      needs.e2e-android.result != 'cancelled' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/backend-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  build-worker-image:
    name: Build & Push Worker Image
    needs: [integration, e2e-ios, e2e-android, changes]
    if: >-
      !failure() && !cancelled() &&
      needs.integration.result != 'cancelled' &&
      needs.e2e-ios.result != 'cancelled' &&
      needs.e2e-android.result != 'cancelled' &&
      (needs.changes.outputs.worker == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/worker-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  deploy-testflight:
    name: Deploy iOS to TestFlight
    needs: [integration, e2e-ios, e2e-android, app-unit-tests, changes]
    if: >-
      !failure() && !cancelled() &&
      needs.integration.result != 'cancelled' &&
      needs.e2e-ios.result != 'cancelled' &&
      needs.e2e-android.result != 'cancelled' &&
      needs.app-unit-tests.result != 'cancelled' &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/deploy-testflight.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  deploy-play-internal:
    name: Deploy Android to Play Store (Internal)
    needs: [integration, e2e-ios, e2e-android, app-unit-tests, changes]
    if: >-
      !failure() && !cancelled() &&
      needs.integration.result != 'cancelled' &&
      needs.e2e-ios.result != 'cancelled' &&
      needs.e2e-android.result != 'cancelled' &&
      needs.app-unit-tests.result != 'cancelled' &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/deploy-play-internal.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  ci-success:
    name: CI Success
    needs:
      - changes
      - integration
      - e2e-ios
      - e2e-android
      - app-unit-tests
      - build-image
      - build-worker-image
      - deploy-testflight
      - deploy-play-internal
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
          echo "::error::A required CI job failed or was cancelled"
          exit 1
      - name: Report success
        run: |
          echo "All required CI jobs passed or were skipped"
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
