name: CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app/**"
      - "k8s/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "app/**"
      - "k8s/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            app:
              - 'app/**'

  integration:
    name: Integration Tests
    uses: ./.github/workflows/integration.yml
    permissions:
      contents: read

  e2e-ios:
    name: E2E Tests (iOS)
    needs: [integration]
    uses: ./.github/workflows/e2e-ios.yml

  e2e-android:
    name: E2E Tests (Android)
    needs: [integration]
    uses: ./.github/workflows/e2e-android.yml

  build-image:
    name: Build & Push Backend Image
    needs: [e2e-ios, e2e-android, changes]
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  deploy-testflight:
    name: Deploy iOS to TestFlight
    needs: [e2e-ios, e2e-android, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/deploy-testflight.yml
    secrets: inherit
