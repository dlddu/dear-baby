name: CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "app/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration Tests
    uses: ./.github/workflows/integration.yml
    permissions:
      contents: read

  e2e-ios:
    name: E2E Tests (iOS)
    needs: [integration]
    uses: ./.github/workflows/e2e-ios.yml

  e2e-android:
    name: E2E Tests (Android)
    needs: [integration]
    uses: ./.github/workflows/e2e-android.yml

  build-image:
    name: Build & Push Backend Image
    needs: [e2e-ios, e2e-android]
    if: github.event_name == 'push'
    uses: ./.github/workflows/backend-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  deploy-testflight:
    name: Deploy iOS to TestFlight
    needs: [e2e-ios, e2e-android]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/deploy-testflight.yml
    secrets: inherit
