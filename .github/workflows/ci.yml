name: CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app/**"
      - "k8s/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "app/**"
      - "k8s/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
      k8s: ${{ steps.filter.outputs.k8s }}
      e2e: ${{ steps.filter.outputs.e2e }}
      integration: ${{ steps.filter.outputs.integration }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-image.yml'
              - '.github/actions/setup-backend/**'
            app:
              - 'app/**'
              - '.github/workflows/deploy-testflight.yml'
              - '.github/actions/setup-js/**'
              - '.github/actions/setup-maestro/**'
              - '.github/actions/upload-maestro-artifacts/**'
            k8s:
              - 'k8s/**'
            e2e:
              - '.github/workflows/e2e-ios.yml'
              - '.github/workflows/e2e-android.yml'
            integration:
              - '.github/workflows/integration.yml'
            ci:
              - '.github/workflows/ci.yml'

  integration:
    name: Integration Tests
    needs: [changes]
    if: >-
      needs.changes.outputs.backend == 'true' || needs.changes.outputs.k8s == 'true' ||
      needs.changes.outputs.integration == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/integration.yml
    permissions:
      contents: read

  e2e-ios:
    name: E2E Tests (iOS)
    needs: [changes]
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.e2e == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/e2e-ios.yml

  e2e-android:
    name: E2E Tests (Android)
    needs: [changes]
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.e2e == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/e2e-android.yml

  build-image:
    name: Build & Push Backend Image
    needs: [integration, e2e-ios, e2e-android, changes]
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/backend-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  deploy-testflight:
    name: Deploy iOS to TestFlight
    needs: [integration, e2e-ios, e2e-android, changes]
    if: >-
      !failure() && !cancelled() &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/deploy-testflight.yml
    secrets: inherit
