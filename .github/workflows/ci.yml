name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      worker: ${{ steps.filter.outputs.worker }}
      app: ${{ steps.filter.outputs.app }}
      k8s: ${{ steps.filter.outputs.k8s }}
      e2e: ${{ steps.filter.outputs.e2e }}
      integration: ${{ steps.filter.outputs.integration }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-image.yml'
              - '.github/actions/setup-backend/**'
            worker:
              - 'worker/**'
              - '.github/workflows/worker-image.yml'
              - '.github/actions/setup-ai-worker/**'
              - 'scripts/openrouter-mock/**'
            # Maestro 플로우는 e2e/maestro/** 로 분리되어 app/** 밖에 있으므로
            # maestro-only 변경 시 deploy-testflight/play 가 자연스럽게 스킵된다.
            app:
              - 'app/**'
              - '.github/workflows/build-ios-testflight.yml'
              - '.github/workflows/build-android-play.yml'
              - '.github/actions/setup-js/**'
            k8s:
              - 'k8s/**'
            e2e:
              - 'e2e/**'
              - '.github/workflows/e2e-ios.yml'
              - '.github/workflows/e2e-android.yml'
              - '.github/actions/setup-maestro/**'
              - '.github/actions/upload-maestro-artifacts/**'
              - '.github/actions/setup-minio/**'
              - '.github/actions/upload-service-logs/**'
            integration:
              - '.github/workflows/integration.yml'
              - 'scripts/minio/**'
              - 'scripts/openrouter-mock/**'
            ci:
              - '.github/workflows/ci.yml'

  integration:
    name: Integration Tests
    needs: [changes]
    if: >-
      needs.changes.outputs.backend == 'true' || needs.changes.outputs.worker == 'true' ||
      needs.changes.outputs.k8s == 'true' || needs.changes.outputs.integration == 'true' ||
      needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/integration.yml
    permissions:
      contents: read
    secrets: inherit

  e2e-ios:
    name: E2E Tests (iOS)
    needs: [changes]
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.worker == 'true' ||
      needs.changes.outputs.app == 'true' || needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/e2e-ios.yml
    secrets: inherit

  e2e-android:
    name: E2E Tests (Android)
    needs: [changes]
    if: >-
      !failure() && !cancelled() &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.worker == 'true' ||
      needs.changes.outputs.app == 'true' || needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/e2e-android.yml
    secrets: inherit

  app-unit-tests:
    name: App Unit Tests
    needs: [changes]
    if: >-
      needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-js
      # 의존성이 없어 setup-js 이전에도 돌지만, app 잡 안에 두어 changes 게이트를
      # 재사용한다. Jest 보다 훨씬 빨라 먼저 실패시키는 편이 피드백이 빠르다.
      - name: Check route conflicts
        working-directory: app
        run: npm run check:routes
      - name: Run Jest
        working-directory: app
        run: npm test -- --ci --colors=false

  backend-unit-tests:
    name: Backend Unit Tests
    needs: [changes]
    if: >-
      needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Run Go tests
        working-directory: backend
        run: make test

  # Single gate that absorbs the !failure() && !cancelled() check and
  # the `result != 'cancelled'` checks for every precheck. Downstream
  # build/deploy jobs depend on this instead of repeating the same
  # expression four times. When a precheck fails or is cancelled this
  # job skips, which transitively skips all four downstream jobs since
  # their `needs:` is no longer satisfied.
  prechecks-passed:
    name: All prechecks passed
    needs: [changes, integration, e2e-ios, e2e-android, app-unit-tests, backend-unit-tests]
    if: >-
      !failure() && !cancelled() &&
      needs.integration.result != 'cancelled' &&
      needs.e2e-ios.result != 'cancelled' &&
      needs.e2e-android.result != 'cancelled' &&
      needs.app-unit-tests.result != 'cancelled' &&
      needs.backend-unit-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - run: echo "All prechecks passed or were skipped."

  build-image:
    name: Build & Push Backend Image
    needs: [prechecks-passed, changes]
    # Same transitive-skip fix as the deploy jobs (PR #148): !cancelled()
    # disables GitHub's implicit auto-skip that otherwise propagates from
    # prechecks-passed's skipped upstreams, so a backend-only change (where
    # app-related prechecks are skipped) still builds and pushes the image.
    if: >-
      !cancelled() &&
      needs.prechecks-passed.result == 'success' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/backend-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  build-worker-image:
    name: Build & Push Worker Image
    needs: [prechecks-passed, changes]
    # Same transitive-skip fix as the deploy jobs (PR #148).
    if: >-
      !cancelled() &&
      needs.prechecks-passed.result == 'success' &&
      (needs.changes.outputs.worker == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/worker-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  deploy-testflight:
    name: Deploy iOS to TestFlight
    needs: [prechecks-passed, changes]
    # !cancelled() makes this if contain a status function, which disables
    # GitHub's implicit auto-skip. Without it, a skip propagates transitively
    # from prechecks-passed's skipped upstreams (integration / backend-unit-
    # tests) down to this job even though prechecks-passed itself succeeds —
    # verified in PR #148, which is why this deploy never ran on PRs.
    # prechecks-passed.result == 'success' then re-applies the original gate:
    # only deploy when the prechecks actually passed.
    if: >-
      !cancelled() &&
      needs.prechecks-passed.result == 'success' &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/build-ios-testflight.yml
    with:
      expo-public-api-url: ${{ vars.EXPO_PUBLIC_API_URL_STAGING }}
      ref: ${{ github.event.pull_request.head.sha }}
      lane: tf_internal
    secrets: inherit

  deploy-play-internal:
    name: Deploy Android to Play Store (Internal)
    needs: [prechecks-passed, changes]
    # Same transitive-skip fix as deploy-testflight above (see PR #148).
    if: >-
      !cancelled() &&
      needs.prechecks-passed.result == 'success' &&
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.app == 'true' || needs.changes.outputs.ci == 'true')
    uses: ./.github/workflows/build-android-play.yml
    with:
      expo-public-api-url: ${{ vars.EXPO_PUBLIC_API_URL_STAGING }}
      ref: ${{ github.event.pull_request.head.sha }}
      lane: play_internal
    secrets: inherit

  ci-success:
    name: CI Success
    needs:
      - changes
      - integration
      - e2e-ios
      - e2e-android
      - app-unit-tests
      - backend-unit-tests
      - prechecks-passed
      - build-image
      - build-worker-image
      - deploy-testflight
      - deploy-play-internal
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
          echo "::error::A required CI job failed or was cancelled"
          exit 1
      - name: Report success
        run: |
          echo "All required CI jobs passed or were skipped"
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
