name: E2E Tests (iOS)

on:
  workflow_call:

jobs:
  e2e-ios:
    name: E2E Tests (iOS)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: http://localhost:8080
      EXPO_PUBLIC_TEST_AUTH_ENABLED: "true"
      # Mirrors the app-side flag so the backend mounts /auth/test-login for
      # the Maestro login flow. CI/dev only — never enable in production.
      TEST_AUTH_ENABLED: "true"
      REDIS_URL: "redis://localhost:6379"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Redis
        run: |
          brew install redis
          brew services start redis
          # Wait for redis to accept connections.
          for i in $(seq 1 20); do
            if redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "redis is up"
              exit 0
            fi
            sleep 1
          done
          echo "redis failed to start"
          exit 1

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          redis-url: ${{ env.REDIS_URL }}

      - name: Setup AI worker
        uses: ./.github/actions/setup-ai-worker
        with:
          redis-url: ${{ env.REDIS_URL }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          langfuse-public-key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse-baseurl: ${{ secrets.LANGFUSE_BASEURL }}

      - name: Setup JS
        uses: ./.github/actions/setup-js

      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro

      - name: Boot iOS Simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: "iPhone 16"

      - name: Expo prebuild (iOS)
        working-directory: app
        run: npx expo prebuild --platform ios --clean

      # Release build embeds the JS bundle into the .app via
      # react-native-xcode.sh at build time, so no Metro is needed at runtime.
      # EXPO_PUBLIC_API_URL (job env) is inlined during the embed step.
      - name: Build and install app on simulator
        working-directory: app
        run: npx expo run:ios --configuration Release --no-bundler

      - name: Wait for app install
        run: |
          for i in $(seq 1 30); do
            if xcrun simctl listapps booted | grep -q "com.dlddu.dearbaby"; then
              echo "App is installed"
              exit 0
            fi
            sleep 1
          done
          echo "App did not install in time"
          exit 1

      - name: Run Maestro flows
        working-directory: app
        run: |
          maestro test .maestro/health.yaml
          maestro test .maestro/login.yaml
          maestro test .maestro/onboarding-stage1.yaml
          maestro test .maestro/onboarding-stage2.yaml

      - name: Upload Maestro debug artifacts
        if: always()
        uses: ./.github/actions/upload-maestro-artifacts
        with:
          name: maestro-ios-output

      - name: Upload backend + worker logs
        if: always()
        uses: ./.github/actions/upload-service-logs
        with:
          name: e2e-ios

      - name: Stop worker
        if: always()
        working-directory: worker
        run: |
          if [ -f worker.pid ]; then
            kill "$(cat worker.pid)" || true
          fi

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
