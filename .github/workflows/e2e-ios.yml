name: E2E Tests (iOS)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app/**"
      - ".github/workflows/e2e-ios.yml"
  pull_request:
    paths:
      - "backend/**"
      - "app/**"
      - ".github/workflows/e2e-ios.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build backend
        working-directory: backend
        run: go build -o server .

      - name: Start backend
        working-directory: backend
        run: |
          nohup ./server > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start"
          cat server.log
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        working-directory: app
        run: npm ci

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Verify Maestro
        run: maestro --version

      - name: Boot iOS Simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: "iPhone 16"

      - name: Expo prebuild (iOS)
        working-directory: app
        run: npx expo prebuild --platform ios --clean

      # Release build embeds the JS bundle into the .app via
      # react-native-xcode.sh at build time, so no Metro is needed at runtime.
      # EXPO_PUBLIC_API_URL (job env) is inlined during the embed step.
      - name: Build and install app on simulator
        working-directory: app
        run: npx expo run:ios --configuration Release --no-bundler

      - name: Wait for app install
        run: |
          for i in $(seq 1 30); do
            if xcrun simctl listapps booted | grep -q "com.dlddu.dearbaby"; then
              echo "App is installed"
              exit 0
            fi
            sleep 1
          done
          echo "App did not install in time"
          exit 1

      - name: Run Maestro flow
        working-directory: app
        run: maestro test .maestro/health.yaml

      - name: Upload Maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-output
          path: |
            ~/.maestro/tests/
            app/.maestro/
          if-no-files-found: ignore

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
