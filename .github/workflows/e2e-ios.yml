name: E2E Tests (iOS)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app/**"
      - ".github/workflows/e2e-ios.yml"
  pull_request:
    paths:
      - "backend/**"
      - "app/**"
      - ".github/workflows/e2e-ios.yml"

jobs:
  e2e-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build backend
        run: cd backend && go build -o server .

      - name: Start backend
        run: |
          cd backend && ./server &
          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i)"
            sleep 1
          done

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: cd app && flutter pub get

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | \
            python3 -c "import sys,json; devices=json.load(sys.stdin)['devices']; print(next(d['udid'] for runtime,devs in devices.items() if 'iPhone' in runtime or 'iOS' in runtime for d in devs if d['isAvailable'] and 'iPhone' in d['name']))")
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          xcrun simctl boot "$DEVICE_ID" || true

      - name: Run integration tests
        timeout-minutes: 10
        run: |
          cd app && flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/health_test.dart \
            -d "$DEVICE_ID" \
            --dart-define=BASE_URL=http://localhost:8080

      - name: Stop backend
        if: always()
        run: pkill -f "backend/server" || true
