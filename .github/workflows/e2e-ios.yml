name: E2E Tests (iOS)

on:
  workflow_call:

jobs:
  e2e-ios:
    name: E2E Tests (iOS)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_API_URL: http://localhost:8080
      EXPO_PUBLIC_TEST_AUTH_ENABLED: "true"
      # Audio fixture covers the mic + STT only — those can't run in a
      # simulator. The upload orchestrator runs for real against the
      # MinIO instance below, so the e2e flow exercises presign + S3
      # PUT + PATCH end-to-end.
      EXPO_PUBLIC_E2E_AUDIO_FIXTURE: "1"
      # Mirrors the app-side flag so the backend mounts /auth/test-login for
      # the Maestro login flow. CI/dev only — never enable in production.
      TEST_AUTH_ENABLED: "true"
      REDIS_URL: "redis://localhost:6379"
      # Audio storage — backend points at the MinIO instance below.
      # iOS simulator shares the host network, so 127.0.0.1 works for
      # both the backend (own HEAD calls) and the app (PUT to presigned
      # URL whose host comes from this endpoint).
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: dear-baby-records-e2e
      AWS_S3_KEY_PREFIX: e2e
      AWS_S3_ENDPOINT: http://127.0.0.1:9000
      AWS_S3_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Redis
        run: |
          brew install redis
          brew services start redis
          # Wait for redis to accept connections.
          for i in $(seq 1 20); do
            if redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "redis is up"
              exit 0
            fi
            sleep 1
          done
          echo "redis failed to start"
          exit 1

      # MinIO acts as an S3 substitute for the audio upload flow. The
      # macOS runner has no Docker, so we install the minio + mc
      # binaries directly via brew. Server runs in the background
      # bound to 127.0.0.1:9000; mc creates the bucket the test will
      # write to.
      - name: Install and start MinIO
        run: |
          brew install minio/stable/minio minio/stable/mc
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=minioadmin \
          MINIO_ROOT_PASSWORD=minioadmin \
            nohup minio server /tmp/minio-data --address :9000 \
            > /tmp/minio.log 2>&1 &
          echo $! > /tmp/minio.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio is up"
              break
            fi
            sleep 1
          done
          mc alias set local http://127.0.0.1:9000 minioadmin minioadmin
          mc mb --ignore-existing local/${AWS_S3_BUCKET}

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          redis-url: ${{ env.REDIS_URL }}

      - name: Setup AI worker
        uses: ./.github/actions/setup-ai-worker
        with:
          redis-url: ${{ env.REDIS_URL }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          langfuse-public-key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse-baseurl: ${{ secrets.LANGFUSE_BASEURL }}

      - name: Setup JS
        uses: ./.github/actions/setup-js

      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro

      - name: Boot iOS Simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: "iPhone 16"

      - name: Expo prebuild (iOS)
        working-directory: app
        run: npx expo prebuild --platform ios --clean

      # Release build embeds the JS bundle into the .app via
      # react-native-xcode.sh at build time, so no Metro is needed at runtime.
      # EXPO_PUBLIC_API_URL (job env) is inlined during the embed step.
      - name: Build and install app on simulator
        working-directory: app
        run: npx expo run:ios --configuration Release --no-bundler

      - name: Wait for app install
        run: |
          for i in $(seq 1 30); do
            if xcrun simctl listapps booted | grep -q "com.dlddu.dearbaby"; then
              echo "App is installed"
              exit 0
            fi
            sleep 1
          done
          echo "App did not install in time"
          exit 1

      - name: Run Maestro flows
        working-directory: app
        run: |
          maestro test .maestro/health.yaml
          maestro test .maestro/login.yaml
          maestro test .maestro/onboarding-stage1.yaml
          maestro test .maestro/onboarding-stage2.yaml
          maestro test .maestro/onboarding-stage2-voice.yaml

      - name: Upload Maestro debug artifacts
        if: always()
        uses: ./.github/actions/upload-maestro-artifacts
        with:
          name: maestro-ios-output

      - name: Upload backend + worker logs
        if: always()
        uses: ./.github/actions/upload-service-logs
        with:
          name: e2e-ios

      - name: Stop worker
        if: always()
        working-directory: worker
        run: |
          if [ -f worker.pid ]; then
            kill "$(cat worker.pid)" || true
          fi

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Stop MinIO
        if: always()
        run: |
          if [ -f /tmp/minio.pid ]; then
            kill "$(cat /tmp/minio.pid)" || true
          fi
