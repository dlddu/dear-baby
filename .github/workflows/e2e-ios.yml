name: E2E Tests (iOS)

on:
  workflow_call:

jobs:
  e2e-ios:
    name: E2E Tests (iOS)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_API_URL: http://localhost:8080
      # Seeded password-backed test account (see backend/internal/auth/seed.go).
      # Same code path runs in production — the gesture on the landing
      # screen plus knowledge of the password is the only gate. CI uses
      # a fixed throwaway value; the App Store reviewer credential is
      # provisioned separately via TestFlight notes.
      TEST_USER_EMAIL: "tester@dear-baby.test"
      TEST_USER_PASSWORD: "ci-tester-password-do-not-reuse"
      TEST_USER_NAME: "CI Tester"
      # Mirror to the names the maestro flows expect — the runner
      # passes these via `maestro test --env` below.
      MAESTRO_TEST_USER_EMAIL: "tester@dear-baby.test"
      MAESTRO_TEST_USER_PASSWORD: "ci-tester-password-do-not-reuse"
      REDIS_URL: "redis://localhost:6379"
      # Drive the voice maestro flow with a deterministic recorder + STT.
      # The upload step is NOT short-circuited — it actually hits the
      # MinIO instance set up below, so the records-audio backend
      # contract gets exercised end-to-end in CI.
      EXPO_PUBLIC_E2E_AUDIO_FIXTURE: "1"
      # Google OAuth client IDs are inlined into the JS bundle via
      # process.env.EXPO_PUBLIC_* — they're public values, so they live
      # in GitHub Variables rather than Secrets.
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      # Build identifiers — app.config.ts at prebuild time and the
      # maestro flows below read these. app.config.ts requires every key
      # listed in app/.env.example to be set, so Android-only values must
      # also be present on iOS prebuild (and vice versa).
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_IDENTIFIER: ${{ vars.APP_BUNDLE_IDENTIFIER }}
      APP_ANDROID_PACKAGE: ${{ vars.APP_ANDROID_PACKAGE }}
      GOOGLE_IOS_URL_SCHEME: ${{ vars.GOOGLE_IOS_URL_SCHEME }}
      APP_ID: ${{ vars.APP_BUNDLE_IDENTIFIER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Redis
        run: |
          brew install redis
          brew services start redis
          # Wait for redis to accept connections.
          for i in $(seq 1 20); do
            if redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "redis is up"
              exit 0
            fi
            sleep 1
          done
          echo "redis failed to start"
          exit 1

      # Stand MinIO up before setup-backend so the AWS_* env vars land
      # in $GITHUB_ENV first. iOS Simulator shares the host's network
      # namespace, so the presigned URL host=localhost works without
      # the adb-reverse trick the Android job needs.
      - name: Setup MinIO
        uses: ./.github/actions/setup-minio

      - name: Setup backend
        uses: ./.github/actions/setup-backend
        with:
          redis-url: ${{ env.REDIS_URL }}

      # Build the reset-user CLI alongside the server so the maestro
      # suite below can wipe the seeded test user's per-user state
      # (onboarding flags, children, fetuses, records) between runs
      # that need a fresh funnel. Lives inside the backend module so
      # it shares config + migrations.
      - name: Build reset-user tool
        working-directory: backend
        run: go build -o reset-user ./cmd/reset-user

      # seed-diary populates the tester user with a fixture set of
      # children / fetuses / records so the diary-tab maestro flows
      # have a deterministic target. Same host-based pattern as
      # reset-user — the e2e script calls it after a reset.
      - name: Build seed-diary tool
        working-directory: backend
        run: go build -o seed-diary ./cmd/seed-diary

      - name: Setup AI worker
        uses: ./.github/actions/setup-ai-worker
        with:
          redis-url: ${{ env.REDIS_URL }}
          # No openrouter-api-key / openrouter-base-url passed: the
          # action stands up the local mock server and points the
          # worker at it.
          langfuse-public-key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.LANGFUSE_SECRET_KEY }}

      - name: Setup JS
        uses: ./.github/actions/setup-js

      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro

      # ── Diagnostics for the intermittent "No devices found for the matching
      # requirements" failure from simulator-action. It only surfaces when the
      # runner has no *existing* device matching `model` — so we dump what this
      # particular runner image actually ships: Xcode version, installed iOS
      # runtimes, bootable devices, the iPhone device types, and whether an
      # "iPhone 16" device is present at all. `|| true` keeps the probe itself
      # from ever failing the job. Runs before the boot step so the snapshot is
      # captured even when the boot then fails. Remove once the flake is root-caused.
      - name: Diagnose iOS simulator availability
        run: |
          echo "::group::macOS + Xcode"
          sw_vers || true
          xcode-select -p || true
          xcodebuild -version || true
          xcrun --sdk iphonesimulator --show-sdk-version || true
          echo "::endgroup::"

          echo "::group::Installed simulator runtimes"
          xcrun simctl list runtimes || true
          echo "::endgroup::"

          echo "::group::Available devices (bootable)"
          xcrun simctl list devices available || true
          echo "::endgroup::"

          echo "::group::iPhone device types on this image"
          xcrun simctl list devicetypes | grep -i iphone || true
          echo "::endgroup::"

          echo "::group::Is an 'iPhone 16' device present?"
          if xcrun simctl list devices available | grep -i "iPhone 16"; then
            echo "-> matched an 'iPhone 16' device above"
          else
            echo "-> NO 'iPhone 16' device on this runner (this is what simulator-action matches on)"
          fi
          echo "::endgroup::"

      # `model` must name a device the runner has *already created* (visible
      # in the diagnostic step's "Available devices" list) — simulator-action
      # matches existing devices, not device types, and errors with "No devices
      # found for the matching requirements" otherwise. The macos-latest image
      # (Xcode 26.5 / iOS 26.x) pre-creates the iPhone 17 family + iPhone 16e
      # but no plain "iPhone 16", which is why `model: "iPhone 16"` failed on
      # the newer runners. "iPhone 17" is present on every installed iOS 26.x
      # runtime, so it matches regardless of which runtime is selected.
      - name: Boot iOS Simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: "iPhone 17"

      # Install an Apple Development cert + matching dev provisioning
      # profile into a temporary keychain so Xcode's automatic signing
      # has something to pick. The Apple Sign-In entitlement
      # (com.apple.developer.applesignin) is added to the build by the
      # expo-apple-authentication plugin, and Xcode refuses to build any
      # target with capability-bearing entitlements unless a code-signing
      # identity is available — even for the simulator. Mirrors the
      # `setup_ci` + `import_certificate` + `install_provisioning_profile`
      # flow in app/fastlane/Fastfile so the secrets stay consistent
      # across the TestFlight + E2E paths.
      #
      # Required secrets (Apple Developer portal → Certificates, Identifiers
      # & Profiles):
      #   IOS_DEVELOPMENT_CERTIFICATE_BASE64   — base64 of the .p12 export
      #     of an "Apple Development" identity.
      #   IOS_DEVELOPMENT_CERTIFICATE_PASSWORD — the .p12 export password.
      #   IOS_DEVELOPMENT_PROFILE_BASE64       — base64 of an iOS
      #     Development provisioning profile bound to the bundle id in
      #     APP_BUNDLE_IDENTIFIER and the same Apple team. Must include
      #     the Sign in with Apple capability so the entitlement validates.
      - name: Install iOS development signing assets
        env:
          DEV_CERT_B64: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_BASE64 }}
          DEV_CERT_PWD: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          DEV_PROFILE_B64: ${{ secrets.IOS_DEVELOPMENT_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEV_CERT_B64:-}" ] || [ -z "${DEV_CERT_PWD:-}" ] || [ -z "${DEV_PROFILE_B64:-}" ]; then
            echo "::error::Missing one of IOS_DEVELOPMENT_CERTIFICATE_BASE64, IOS_DEVELOPMENT_CERTIFICATE_PASSWORD, IOS_DEVELOPMENT_PROFILE_BASE64. The Apple Sign-In entitlement requires a development identity in the keychain — see e2e-ios.yml comments for setup."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/dear-baby-e2e.keychain-db"
          KEYCHAIN_PWD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/dev-cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/dev-profile.mobileprovision"

          # Persist the keychain path/password for the cleanup step.
          echo "E2E_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "E2E_KEYCHAIN_PWD=$KEYCHAIN_PWD" >> "$GITHUB_ENV"

          echo "$DEV_CERT_B64" | base64 -d > "$CERT_PATH"
          echo "$DEV_PROFILE_B64" | base64 -d > "$PROFILE_PATH"

          # Create + unlock the temporary keychain and put it FIRST in the
          # search list so codesign/xcodebuild can find the imported
          # identity without interfering with the runner's login keychain.
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          EXISTING=$(security list-keychains -d user | sed -e 's/^[ \t]*//' -e 's/"//g' | tr '\n' ' ')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING

          # Import the cert and authorize codesign/security to read its
          # private key without prompting (otherwise the build hangs on
          # the access-control dialog).
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$DEV_CERT_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          # Install the provisioning profile under the UUID-derived name
          # Xcode expects.
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$PROFILE_PATH" "$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"

          # Sanity check — fail loudly if the import did not produce a
          # signing identity.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Expo prebuild (iOS)
        working-directory: app
        run: npx expo prebuild --platform ios --clean

      # Release build embeds the JS bundle into the .app via
      # react-native-xcode.sh at build time, so no Metro is needed at runtime.
      # EXPO_PUBLIC_API_URL (job env) is inlined during the embed step.
      - name: Build and install app on simulator
        working-directory: app
        run: npx expo run:ios --configuration Release --no-bundler

      - name: Wait for app install
        run: |
          for i in $(seq 1 30); do
            if xcrun simctl listapps booted | grep -q "$APP_ID"; then
              echo "App is installed"
              exit 0
            fi
            sleep 1
          done
          echo "App did not install in time"
          exit 1

      - name: Run Maestro flows
        working-directory: e2e
        run: |
          set -euo pipefail
          run_flow() {
            maestro test \
              --env APP_ID="$APP_ID" \
              --env MAESTRO_TEST_USER_EMAIL="$MAESTRO_TEST_USER_EMAIL" \
              --env MAESTRO_TEST_USER_PASSWORD="$MAESTRO_TEST_USER_PASSWORD" \
              "$1"
          }
          reset_user() {
            (cd ../backend && ./reset-user "$TEST_USER_EMAIL")
          }
          seed_diary() {
            (cd ../backend && ./seed-diary "$TEST_USER_EMAIL")
          }

          run_flow maestro/health.yaml
          # login.yaml requires a fresh-onboarding state to assert the
          # welcome screen on landing.
          reset_user
          run_flow maestro/login.yaml
          # reset-user wipes the test account's onboarding state AND
          # leftover children/fetuses/records between flows so each
          # scenario lands back on the welcome screen with no stale
          # active-child rows polluting home.
          reset_user
          run_flow maestro/onboarding-caseA.yaml
          reset_user
          run_flow maestro/onboarding-caseB.yaml
          reset_user
          run_flow maestro/onboarding-caseC.yaml
          reset_user
          run_flow maestro/home-record-ctas.yaml
          reset_user
          run_flow maestro/home-question-card-undecided.yaml
          reset_user
          run_flow maestro/home-voice-record.yaml

          # Diary tab flows — empty state runs against a fresh reset,
          # then seed_diary installs the multi-subject fixture for the
          # list / detail / edit / delete / visibility / filter flows.
          reset_user
          run_flow maestro/diary-list-empty.yaml
          reset_user
          seed_diary
          run_flow maestro/diary-list-multichild.yaml
          reset_user
          seed_diary
          run_flow maestro/diary-detail-and-back.yaml
          reset_user
          seed_diary
          run_flow maestro/diary-edit.yaml
          reset_user
          seed_diary
          run_flow maestro/diary-delete-confirm.yaml
          reset_user
          seed_diary
          run_flow maestro/diary-visibility-toggle.yaml
          reset_user
          seed_diary
          run_flow maestro/diary-filter-by-child.yaml

      - name: Upload Maestro debug artifacts
        if: always()
        uses: ./.github/actions/upload-maestro-artifacts
        with:
          name: maestro-ios-output

      - name: Upload backend + worker logs
        if: always()
        uses: ./.github/actions/upload-service-logs
        with:
          name: e2e-ios

      - name: Stop worker
        if: always()
        working-directory: worker
        run: |
          if [ -f worker.pid ]; then
            kill "$(cat worker.pid)" || true
          fi

      - name: Stop openrouter-mock
        if: always()
        run: |
          if [ -f openrouter-mock.pid ]; then
            kill "$(cat openrouter-mock.pid)" || true
          fi

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

      # Drop the temporary keychain and provisioning profile we minted
      # for code signing. The macOS runner is ephemeral so this is
      # belt-and-suspenders, but it keeps logs clean if a future change
      # ever reuses runners.
      - name: Clean up signing assets
        if: always()
        run: |
          if [ -n "${E2E_KEYCHAIN_PATH:-}" ] && [ -f "${E2E_KEYCHAIN_PATH}" ]; then
            security delete-keychain "${E2E_KEYCHAIN_PATH}" || true
          fi
          rm -f "$RUNNER_TEMP/dev-cert.p12" "$RUNNER_TEMP/dev-profile.mobileprovision"
