name: Backend Build & K8s Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "k8s/**"
      - ".github/workflows/k8s-smoke-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - "k8s/**"
      - ".github/workflows/k8s-smoke-test.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dear-baby-backend:latest

jobs:
  k8s-smoke-test:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          config: k8s/kind-config.yaml

      - name: Load image into kind
        run: kind load docker-image ${{ env.IMAGE }}

      - name: Apply k8s manifests
        run: kubectl apply -f k8s/

      - name: Wait for rollout
        run: kubectl rollout status deployment/backend --timeout=60s

      - name: Smoke test – health endpoint
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -sf http://localhost:8080/health | jq -r .status) && break
            sleep 2
          done
          echo "Health status: ${STATUS}"
          [ "$STATUS" = "ok" ]

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: docker push ${{ env.IMAGE }}
