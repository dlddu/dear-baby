name: Build Android for Play Store

# Reusable workflow that bakes a Release AAB, signs it with the upload
# keystore, and uploads it to a Play Store track via the Fastlane lane
# selected by the `lane` input (`play_internal` for the PR-preview path,
# `play_closed` for closed/alpha external testing). Mirrors
# build-ios-testflight.yml so multiple trigger workflows share the same
# build steps.
#
# `version-code` mirrors the value `app/app.config.ts` stamps into
# AndroidManifest.xml's android:versionCode, so callers can promote the
# upload without a separate Play Store API lookup.

on:
  workflow_call:
    inputs:
      expo-public-api-url:
        type: string
        required: true
        description: Backend base URL baked into the AAB via EXPO_PUBLIC_API_URL.
      ref:
        type: string
        required: false
        default: ""
        description: Git ref to check out. Empty checks out the workflow's default ref.
      lane:
        type: string
        required: true
        description: Fastlane Android lane to invoke (e.g. play_internal, play_closed).
    outputs:
      version-code:
        description: Play Store versionCode stamped into the AAB.
        value: ${{ jobs.build.outputs.version-code }}

jobs:
  build:
    name: Build & upload to Play Store (${{ inputs.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    outputs:
      version-code: ${{ steps.version_code.outputs.value }}
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.expo-public-api-url }}
      EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
      EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
      # PostHog source-map upload. The posthog-react-native/expo config
      # plugin injects a Gradle step (com.posthog.android) at prebuild time
      # that runs posthog-cli to upload the composed Hermes source map for
      # the exact bundle this build ships, so JS stack traces symbolicate in
      # Error Tracking. POSTHOG_CLI_API_KEY must be a Personal API key with
      # `error tracking write` + `organization read` scopes. Host defaults to
      # https://us.posthog.com; EU/self-host must add a POSTHOG_CLI_HOST env
      # here with a full URL — an empty value makes posthog-cli fail with
      # "Invalid Host", so we omit it rather than pass an undefined var.
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
      # Opt this (release) build into source-map upload. app.config.ts and
      # metro.config.js only wire the posthog-react-native/expo plugin +
      # debug-id serializer when this is "1", so E2E/local builds don't need
      # posthog-cli. Deploy builds set it; nothing else does.
      POSTHOG_UPLOAD_SOURCEMAPS: "1"
      # Google OAuth client IDs are inlined into the JS bundle via
      # process.env.EXPO_PUBLIC_* — they're public values, so they live
      # in GitHub Variables rather than Secrets.
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      # Build identifiers consumed by app.config.ts at prebuild time and
      # by the Fastlane lanes below. app.config.ts requires every key
      # listed in app/.env.example to be set, so iOS-only values must
      # also be present on Android builds (and vice versa).
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_IDENTIFIER: ${{ vars.APP_BUNDLE_IDENTIFIER }}
      APP_ANDROID_PACKAGE: ${{ vars.APP_ANDROID_PACKAGE }}
      GOOGLE_IOS_URL_SCHEME: ${{ vars.GOOGLE_IOS_URL_SCHEME }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
      PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup JS
        uses: ./.github/actions/setup-js

      # posthog-cli is invoked by the Gradle plugin the config plugin adds
      # during prebuild; it must be on PATH before the Fastlane build runs.
      # It is a standalone tool, not an app dependency, so it isn't covered
      # by `npm ci` in setup-js.
      - name: Setup PostHog CLI (source-map upload)
        shell: bash
        run: npm install -g @posthog/cli@latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: app

      # Play Store requires a globally monotonic versionCode across the
      # app, so we can't rely on per-workflow `github.run_number` —
      # ci.yml's deploy-play-internal and any future production-promotion
      # workflow have independent counters and would collide. Query the
      # current latest from the Play Developer API and add one.
      - name: Compute next Play Store versionCode
        id: version_code
        env:
          BUILD_NUMBER_FILE: ${{ runner.temp }}/next_version_code.txt
        run: |
          set -euo pipefail
          bundle exec fastlane android next_play_version_code
          vc=$(cat "$BUILD_NUMBER_FILE")
          if [ -z "$vc" ]; then
            echo "::error::next_play_version_code lane produced empty file"
            exit 1
          fi
          echo "value=$vc" >> "$GITHUB_OUTPUT"
          # Picked up by app.config.ts during expo prebuild and stamped
          # into AndroidManifest.xml's android:versionCode.
          echo "ANDROID_VERSION_CODE=$vc" >> "$GITHUB_ENV"

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Fastlane ${{ inputs.lane }}
        run: bundle exec fastlane android ${{ inputs.lane }}

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/fastlane/report.xml
            app/android/app/build/outputs/bundle/release/
            app/android/app/build/outputs/logs/
          if-no-files-found: ignore
