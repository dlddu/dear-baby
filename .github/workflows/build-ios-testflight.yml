name: Build iOS for TestFlight

# Reusable workflow that bakes a Release IPA, signs it, and uploads it
# to TestFlight via the Fastlane iOS lane selected by `lane`
# (`tf_internal` for PR previews against staging, `tf_external` for
# closed-beta builds against production with external distribution).
# Callers select which backend the build talks to by passing
# `expo-public-api-url`. Mirrors build-android-play.yml on the iOS side.
#
# `build-number` mirrors the run number that `app/app.config.ts` stamps
# into Info.plist's CFBundleVersion, so callers can promote the upload
# without a separate App Store Connect lookup.

on:
  workflow_call:
    inputs:
      expo-public-api-url:
        type: string
        required: true
        description: Backend base URL baked into the IPA via EXPO_PUBLIC_API_URL.
      ref:
        type: string
        required: false
        default: ""
        description: Git ref to check out. Empty checks out the workflow's default ref.
      lane:
        type: string
        required: true
        description: Fastlane iOS lane to invoke (e.g. tf_internal, tf_external).
    outputs:
      build-number:
        description: TestFlight buildNumber stamped into the IPA.
        value: ${{ jobs.build.outputs.build-number }}

jobs:
  build:
    name: Build & upload to TestFlight (${{ inputs.lane }})
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    outputs:
      build-number: ${{ steps.build_number.outputs.value }}
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.expo-public-api-url }}
      EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
      EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
      # PostHog source-map upload. The posthog-react-native/expo config
      # plugin rewrites the "Bundle React Native code and images" Xcode phase
      # (and disables User Script Sandboxing) at prebuild time so posthog-cli
      # uploads the composed Hermes source map for the exact bundle this build
      # ships, letting JS stack traces symbolicate in Error Tracking.
      # POSTHOG_CLI_API_KEY must be a Personal API key with `error tracking
      # write` + `organization read` scopes. Host defaults to
      # https://us.posthog.com; EU/self-host must add a POSTHOG_CLI_HOST env
      # here with a full URL — an empty value makes posthog-cli fail with
      # "Invalid Host", so we omit it rather than pass an undefined var.
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: ${{ vars.POSTHOG_CLI_PROJECT_ID }}
      # Opt this (release) build into source-map upload. app.config.ts and
      # metro.config.js only wire the posthog-react-native/expo plugin +
      # debug-id serializer when this is "1", so E2E/local builds don't need
      # posthog-cli. Deploy builds set it; nothing else does.
      POSTHOG_UPLOAD_SOURCEMAPS: "1"
      # Google OAuth client IDs are inlined into the JS bundle via
      # process.env.EXPO_PUBLIC_* — they're public values, so they live
      # in GitHub Variables rather than Secrets.
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      # Build identifiers consumed by app.config.ts at prebuild time and
      # by the Fastlane lanes below. app.config.ts requires every key
      # listed in app/.env.example to be set, so Android-only values must
      # also be present on iOS builds (and vice versa).
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_IDENTIFIER: ${{ vars.APP_BUNDLE_IDENTIFIER }}
      APP_ANDROID_PACKAGE: ${{ vars.APP_ANDROID_PACKAGE }}
      GOOGLE_IOS_URL_SCHEME: ${{ vars.GOOGLE_IOS_URL_SCHEME }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      # Review metadata for `tf_external`'s external-group distribution.
      # `tf_internal` doesn't read these and is unaffected when they're
      # absent (PR-preview path doesn't configure them).
      TESTFLIGHT_EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP }}
      TESTFLIGHT_BETA_CONTACT_FIRST_NAME: ${{ vars.TESTFLIGHT_BETA_CONTACT_FIRST_NAME }}
      TESTFLIGHT_BETA_CONTACT_LAST_NAME: ${{ vars.TESTFLIGHT_BETA_CONTACT_LAST_NAME }}
      TESTFLIGHT_BETA_FEEDBACK_EMAIL: ${{ vars.TESTFLIGHT_BETA_FEEDBACK_EMAIL }}
      TESTFLIGHT_BETA_PRIVACY_URL: ${{ vars.TESTFLIGHT_BETA_PRIVACY_URL }}
      TESTFLIGHT_BETA_APP_DESCRIPTION: ${{ vars.TESTFLIGHT_BETA_APP_DESCRIPTION }}
      TESTFLIGHT_BETA_CONTACT_EMAIL: ${{ secrets.TESTFLIGHT_BETA_CONTACT_EMAIL }}
      TESTFLIGHT_BETA_CONTACT_PHONE: ${{ secrets.TESTFLIGHT_BETA_CONTACT_PHONE }}
      TESTFLIGHT_DEMO_ACCOUNT_EMAIL: ${{ secrets.TESTFLIGHT_DEMO_ACCOUNT_EMAIL }}
      TESTFLIGHT_DEMO_ACCOUNT_PASSWORD: ${{ secrets.TESTFLIGHT_DEMO_ACCOUNT_PASSWORD }}
      TESTFLIGHT_REVIEW_LOCALE: ${{ vars.TESTFLIGHT_REVIEW_LOCALE }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GIT_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup JS
        uses: ./.github/actions/setup-js

      # posthog-cli is invoked by the Xcode build phase the config plugin
      # rewrites during prebuild; it must be on PATH before the Fastlane
      # build runs. It is a standalone tool, not an app dependency, so it
      # isn't covered by `npm ci` in setup-js.
      - name: Setup PostHog CLI (source-map upload)
        shell: bash
        run: npm install -g @posthog/cli@latest

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: app

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Generate one-shot keychain password
        run: echo "MATCH_KEYCHAIN_PASSWORD=$(uuidgen)" >> "$GITHUB_ENV"

      # TestFlight requires a globally monotonic CFBundleVersion across
      # the app, so we can't rely on per-workflow `github.run_number` —
      # ci.yml's deploy-testflight and closed-beta.yml's ios job have
      # independent counters and would collide. Query the current
      # latest from App Store Connect and add one.
      - name: Compute next TestFlight build number
        id: build_number
        env:
          BUILD_NUMBER_FILE: ${{ runner.temp }}/next_build_number.txt
        run: |
          set -euo pipefail
          bundle exec fastlane next_build_number
          bn=$(cat "$BUILD_NUMBER_FILE")
          if [ -z "$bn" ]; then
            echo "::error::next_build_number lane produced empty file"
            exit 1
          fi
          echo "value=$bn" >> "$GITHUB_OUTPUT"
          # Picked up by app.config.ts during expo prebuild and stamped
          # into Info.plist's CFBundleVersion.
          echo "IOS_BUILD_NUMBER=$bn" >> "$GITHUB_ENV"

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: app/ios
        run: pod install --repo-update

      - name: Fastlane ${{ inputs.lane }}
        run: bundle exec fastlane ${{ inputs.lane }}

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/fastlane/report.xml
            app/build/
            ~/Library/Logs/gym/
          if-no-files-found: ignore
