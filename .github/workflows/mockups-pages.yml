name: Deploy Mockups to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/mockups/source/**"
      - ".github/workflows/mockups-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build mockups
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@24
          cache: true
          cache-dependency-path: docs/mockups/source/pnpm-lock.yaml
          install: false

      - name: Install dependencies
        working-directory: docs/mockups/source
        run: pnpm install --frozen-lockfile

      - name: Build mockups
        working-directory: docs/mockups/source
        run: pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/mockups/source/dist

  deploy:
    name: Deploy mockups
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
