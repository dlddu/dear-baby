name: Deploy iOS to TestFlight

# PR-preview path: build the iOS app against the staging backend and
# upload it to TestFlight (internal testers only). The actual build
# pipeline lives in build-ios-testflight.yml so the production-URL
# rebuild used by submit-testflight-beta.yml shares the same steps.

on:
  workflow_call:

jobs:
  deploy-testflight:
    name: Deploy iOS to TestFlight
    uses: ./.github/workflows/build-ios-testflight.yml
    with:
      expo-public-api-url: ${{ vars.EXPO_PUBLIC_API_URL_STAGING }}
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
