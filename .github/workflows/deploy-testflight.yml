name: Deploy iOS to TestFlight

# PR-preview path: build the iOS app against the staging backend and
# upload it to TestFlight (internal testers only). The actual build
# pipeline lives in build-ios-testflight.yml so the production-URL
# rebuild used by submit-testflight-beta.yml shares the same steps.
#
# `ref` is taken as an explicit input rather than reading
# `github.event.pull_request.head.sha` here, so this wrapper doesn't
# silently depend on its caller's event context — ci.yml passes the PR
# head SHA, any future workflow_dispatch run can pass an arbitrary ref.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
        description: Git ref to check out and build.

jobs:
  deploy-testflight:
    name: Deploy iOS to TestFlight
    uses: ./.github/workflows/build-ios-testflight.yml
    with:
      expo-public-api-url: ${{ vars.EXPO_PUBLIC_API_URL_STAGING }}
      ref: ${{ inputs.ref }}
    secrets: inherit
