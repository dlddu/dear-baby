name: Closed Beta Submission

# Triggered when a PR is labeled `closed-beta`. Orchestrates the full
# external-testing rollout for that commit:
#
#   1. ci-gate         — wait until ci.yml finishes on the PR head SHA
#                        and fail fast if it didn't conclude success.
#                        Labels can be applied while CI is still in
#                        flight, so we poll rather than hard-fail.
#   2. backend-image / worker-image
#                      — rebuild and push ghcr.io/dlddu/dear-baby{,-worker}
#                        tagged with the PR head SHA. ci.yml's image
#                        jobs are gated on a paths-filter, so a PR that
#                        doesn't touch backend/ or worker/ wouldn't
#                        have produced an image at this SHA — and the
#                        pin step below would then point prod at a tag
#                        that doesn't exist in GHCR. Re-running the
#                        build here unconditionally makes the pin safe
#                        regardless of which paths changed; the gha
#                        cache keeps the rebuild fast when nothing
#                        actually changed.
#   3. android / ios   — rebuild against the production backend URL
#                        and upload to Play Store closed (alpha) /
#                        TestFlight (external distribution + Beta App
#                        Review submission). The PR-preview builds from
#                        ci.yml are pinned to the staging API URL, so
#                        external testers need fresh builds.
#   4. pin-prod-image  — write the head SHA into the dear-baby-prod-app
#                        Flux Kustomization in flux-cd-apps so prod
#                        runs the exact backend + worker images the
#                        external testers' app was built against. The
#                        pin lives in flux-cd-apps (not this repo)
#                        because Flux's images: transformation is
#                        applied on top of the kustomize build and
#                        overrides whatever
#                        k8s/overlays/production/kustomization.yaml
#                        sets here.
#   5. auto-merge     —  enable squash auto-merge so the PR lands as
#                        soon as required checks are green.
#
# A future App Store / Play production-track release should use a
# separate label (and workflow), so the label-name guard on ci-gate
# keeps the two paths from colliding.
on:
  pull_request:
    types: [labeled]

# Per-SHA so different commits don't block each other; a re-label of
# the same SHA queues behind any in-flight submission.
concurrency:
  group: closed-beta-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Wait for CI to pass on this commit
    if: github.event.label.name == 'closed-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Poll ci.yml run for head SHA
        run: |
          set -euo pipefail
          # 60 * 30s = 30 minutes. CI's longest leg (e2e) typically
          # finishes well under that; integration+e2e together stay
          # under ~25min on the current runners.
          for attempt in $(seq 1 60); do
            run=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&per_page=1" \
              --jq '.workflow_runs[0]')
            if [ -z "$run" ] || [ "$run" = "null" ]; then
              echo "Attempt $attempt: no ci.yml run for $HEAD_SHA yet"
              sleep 30
              continue
            fi
            status=$(echo "$run" | jq -r '.status')
            conclusion=$(echo "$run" | jq -r '.conclusion')
            url=$(echo "$run" | jq -r '.html_url')
            echo "Attempt $attempt: status=$status conclusion=$conclusion ($url)"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed for $HEAD_SHA."
                exit 0
              fi
              echo "::error::ci.yml concluded '$conclusion' for $HEAD_SHA — refusing to ship to closed beta."
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for ci.yml to complete on $HEAD_SHA."
          exit 1

  backend-image:
    name: Build & Push Backend Image
    needs: ci-gate
    uses: ./.github/workflows/backend-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  worker-image:
    name: Build & Push Worker Image
    needs: ci-gate
    uses: ./.github/workflows/worker-image.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  android:
    name: Build & submit Android (closed)
    needs: ci-gate
    uses: ./.github/workflows/build-android-play.yml
    with:
      expo-public-api-url: ${{ vars.EXPO_PUBLIC_API_URL_PRODUCTION }}
      ref: ${{ github.event.pull_request.head.sha }}
      lane: play_closed
    secrets: inherit

  ios:
    name: Build & submit iOS (closed)
    needs: ci-gate
    uses: ./.github/workflows/build-ios-testflight.yml
    with:
      expo-public-api-url: ${{ vars.EXPO_PUBLIC_API_URL_PRODUCTION }}
      ref: ${{ github.event.pull_request.head.sha }}
      lane: tf_external
    secrets: inherit

  pin-prod-image:
    name: Pin prod backend + worker images to head SHA (flux-cd-apps)
    needs: [backend-image, worker-image, android, ios]
    uses: ./.github/workflows/pin-prod-image.yml
    with:
      head-sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  auto-merge:
    name: Enable auto-merge
    needs: pin-prod-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Enable squash auto-merge
        # pin-prod-image now writes only to flux-cd-apps, so nothing
        # in this workflow pushes back to this repo and ci.yml isn't
        # re-triggered; --auto generally merges immediately.
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
