services:
  redis:
    image: redis:7-alpine
    # Persistence is disabled on purpose — the task queue is ephemeral and
    # the worker's `sync()` path self-heals from DB state on boot.
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on:
      - redis
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "file:/data/dear-baby.db?_pragma=foreign_keys(1)&_pragma=journal_mode(wal)"
      REDIS_URL: "redis://redis:6379"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-local-dev-token}"
    volumes:
      - backend-data:/data

  worker:
    build: ./worker
    depends_on:
      - redis
      - backend
    environment:
      REDIS_URL: "redis://redis:6379"
      INTERNAL_API_URL: "http://backend:8080"
      INTERNAL_API_TOKEN: "${INTERNAL_API_TOKEN:-local-dev-token}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL}"

volumes:
  backend-data:
