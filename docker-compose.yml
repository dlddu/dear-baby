services:
  # Volatile Redis — no PVC, no AOF, no RDB. AI-preview jobs recover from
  # the onboarding table on worker boot, so losing the queue on a restart
  # is acceptable. See k8s/redis-deployment.yaml for the mirroring prod
  # configuration.
  redis:
    image: redis:7-alpine
    command: ["--appendonly", "no", "--save", ""]
    ports:
      - "6379:6379"

  # MinIO — S3-compatible storage for record audio. Local dev uses this
  # in place of AWS S3 so the upload/PATCH endpoints work without real
  # AWS credentials. The bootstrap container below pre-creates the bucket.
  # In production the backend talks to AWS S3 via AssumeRole; the
  # Endpoint/UsePathStyle env vars stay unset there.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot bucket bootstrap. Runs `mc mb` once minio is healthy; idempotent
  # on subsequent boots. Without this the backend's HEAD-on-bucket would 404.
  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/dear-baby-records-dev
      "

  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: "file:/data/dear-baby.db?_pragma=foreign_keys(1)&_pragma=journal_mode(wal)"
      REDIS_URL: "redis://redis:6379"
      # Audio uploads — MinIO acts as a local AWS S3. AssumeRole is
      # bypassed automatically when AWS_S3_ENDPOINT is set.
      AWS_REGION: "us-east-1"
      AWS_S3_BUCKET: "dear-baby-records-dev"
      AWS_S3_KEY_PREFIX: "dev"
      AWS_S3_ENDPOINT: "http://minio:9000"
      AWS_S3_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: "minioadmin"
      AWS_SECRET_ACCESS_KEY: "minioadmin"
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/data
    depends_on:
      - redis
      - minio-bootstrap

  worker:
    build:
      context: ./worker
    environment:
      REDIS_URL: "redis://redis:6379"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY required}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:?OPENROUTER_MODEL required}"
      # Langfuse keys are optional locally — without them the span
      # processor is never installed and observeOpenAI spans go nowhere.
      # LANGFUSE_BASE_URL defaults to US (our account region); set it
      # explicitly if you switch projects.
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-https://us.cloud.langfuse.com}"
    depends_on:
      - redis
      - backend

volumes:
  backend-data: {}
