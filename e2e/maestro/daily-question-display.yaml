appId: ${APP_ID}
---
# 검증 대상: AC-002-01 (오늘의 질문 표시 — PRD-002 오늘의 질문).
#           홈 질문 카드에 (1)오늘의 질문 본문과 (2)현재 임신 주차/D-day
#           컨텍스트가 함께 노출되는지를 주검증한다.
#
# 셋업은 CI 실행 형제 home-question-card-undecided.yaml(AC-007-04)·
# home-question-reroll.yaml(AC-007-05)과 동일한 Case A 경로
# (tester-login-fast · onboarding-q1-q2-caseA · onboarding-caseA-full)를
# 그대로 재사용한다. Case A(임신 O · 예정일 선택)라 카드의 컨텍스트 라벨은
# 임신 주차/D-day 포맷으로 노출된다.
#
# 단정은 testID 노출만으로 한다 — 질문 본문·컨텍스트 라벨은 한국어라
# Android Maestro(UiAutomator)가 한글/이모지 span 을 쪼개 부분문자열 매칭이
# 불안정하다(home-question-reroll.yaml · ChildContextChip.tsx 주석 참조).
# 요소 노출(home-question-card-question)이 곧 "오늘의 질문이 표시된다"의
# 결정적 증거다: HomeQuestionCard 는 questions.length > 0 일 때만 렌더되고
# 현재 인덱스 질문 본문을 home-question-card-question 에 싣는다
# (app/src/components/HomeQuestionCard.tsx).
#
# 구분: 카드 표시 자체 + CTA 구성은 AC-007-04(home-question-card-undecided),
# 회전 동작은 AC-007-05(home-question-reroll) 소관이며 둘 다
# home-question-card-question 을 단정하지 않는다 — 본 flow 의 주검증
# 요소가 그것이라 매핑이 겹치지 않는다. AC-002-01 조건3 "질문에 대한 짧은
# 안내 문구"의 마이크로카피 문구는 e2e 밖 잔여 = src/data/dailyQuestions
# 단위 + 수동 QA.
#
# CI must reset the seeded test user's onboarding state before running
# this flow.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login-fast.yaml

# Q1·Q2 (Case A: 임신 O · 양육 X) → a1
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml

# a1 → a2 → a3 → 홈 (예정일 선택 경로)
- runFlow:
    file: subflows/onboarding-caseA-full.yaml

# 홈 질문 카드에 오늘의 질문 본문과 임신 주차/D-day 컨텍스트가 함께 노출된다.
- assertVisible:
    id: "home-question-card"
- assertVisible:
    id: "home-question-card-context"
- assertVisible:
    id: "home-question-card-question"
