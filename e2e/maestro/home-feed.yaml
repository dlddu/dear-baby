appId: ${APP_ID}
---
# 검증 대상: AC-007-08 (타인 기록 피드 — 카드 표시).
# 타인 기록 피드 섹션.  (노출 로직 AC-007-09 는 전용 후속 flow 소관 — `home-feed-exposure.yaml`.)
#
# TC-007-08 (홈 진입 시 카드 3개 + alias·heart 가시성)
# TC-007-09 (“더보기” → 커뮤니티 탭 도착)
#
# 셀렉터의 필터·정렬·50자 컷 검증은 단위 테스트가 담당하고, 본 flow 는
# 홈 화면 표면에 mock data 가 올바르게 매달려 노출되는지만 확인한다.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login-fast.yaml

# 가장 짧은 경로 — Case A 예정일 선택 후 홈 도착.
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml
- runFlow:
    file: subflows/onboarding-caseA-full.yaml

# 홈 도착 — 피드 섹션과 mock data 3건이 모두 보여야 한다.
- assertVisible:
    id: "home-tab"
- assertVisible:
    id: "home-feed-section"
- assertVisible: "다른 엄마들의 기록"

# Mock 풀의 상위 3개는 heartCount 내림차순 (seo***1 365, cho***3 50, abc***9 12).
# 단위 테스트가 풀 구성을 잠그므로 여기서는 alias·heart 카운트 가시성만 본다.
- assertVisible:
    id: "home-feed-entry-feed-2"
- assertVisible:
    id: "home-feed-entry-feed-1"
- assertVisible:
    id: "home-feed-entry-feed-3"
- assertVisible: "seo***1"
- assertVisible: "cho***3"
- assertVisible: "abc***9"
- assertVisible: "365"
- assertVisible: "50"
- assertVisible: "12"

# “더보기” → 커뮤니티 탭 이동.
- tapOn:
    id: "home-feed-more"
- assertVisible:
    id: "community-tab"
