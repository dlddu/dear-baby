appId: ${APP_ID}
---
# 검증 대상: AC-009-14 (홈 "다른 엄마들의 기록" 섹션) + AC-009-13 (빈 상태).
#   구 AC-007-08 에서 이관 (2026-08-05, PRD-009 확정). 노출 로직은 AC 밖 —
#   ENG-007·008·010(미확정 초안) 소관이라 별도 flow 를 두지 않는다 (확정 시 ENG 매핑으로 재정의).
#
# TC-009-14-B (공개 기록 0건 → mock 없이 빈 카드 + `첫 기록을 공개해보세요` CTA)
#   + "더보기" → 커뮤니티 탭 라우팅.
#
# 왜 빈 상태인가: 섹션은 이제 `GET /v1/community/feed` 의 실제 응답을 그린다.
# CI DB 에는 시드된 테스터 한 명뿐이고 피드는 **타인의** 공개 기록만 노출하므로
# (ENG-010), 이 계정에서 보이는 것은 항상 0건이다. 2026-08-05 결정으로 mock
# data 조항이 삭제돼 0건일 때 가짜 카드를 그리지 않는 것이 곧 명세다.
#
# 범위 밖(후속): 카드 내용(마스킹 표시명·아이 현황·질문·미리보기) 자체의 표면
# 검증. 타 사용자의 공개 기록을 심는 시드가 필요하다 (현재 seed-diary 는 테스터
# 본인 기록만 만든다). 카드 렌더 자체는 app 단위 테스트
# (app/(tabs)/__tests__/index-feed.test.tsx · OtherEntryCard.test.tsx) 가 잠근다.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login-fast.yaml

# 가장 짧은 경로 — Case A 예정일 선택 후 홈 도착.
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml
- runFlow:
    file: subflows/onboarding-caseA-full.yaml

# 홈 도착 — 피드 섹션 자체(타이틀 + 더보기)는 0건일 때도 남는다.
- assertVisible:
    id: "home-tab"
- assertVisible:
    id: "home-feed-section"
- assertVisible: "다른 엄마들의 기록"

# 공개 기록 0건 → 빈 카드 + CTA. mock alias/하트가 하나도 없어야 한다.
- assertVisible:
    id: "home-feed-empty"
- assertVisible: "첫 기록을 공개해보세요"
- assertNotVisible:
    id: "home-feed-error"

# "더보기" → 커뮤니티 탭 이동.
- tapOn:
    id: "home-feed-more"
- assertVisible:
    id: "community-tab"
