appId: ${APP_ID}
---
# Record visibility select e2e — 기록 저장(확정) 화면의 공개/비공개 토글.
#
# 검증 대상: AC-001-06 (작성 시점 공개/비공개 선택 — TC-001-06).  [단독 소유]
#           (홈 카드에서의 텍스트 기록 진입 자체는 AC-007-06=home-record-ctas
#            소관, 사후 변경은 AC-008-07=diary-visibility-toggle 소관 — 여기선
#            둘 다 부수 경유이고 검증 대상이 아니다.)
#
# 세 시나리오로 TC-001-06 을 덮는다.
#   A. 기본값 확인 + 그대로 저장   — 토글 초기 상태가 비공개다 (TC step 2·3)
#   B. 공개로 전환 후 저장         — 선택이 반영된다 (TC step 4)
#   C. 재진입 시 기본값 복귀       — 공개 선택이 다음 기록으로 이월되지 않는다
#
# C 가 이 flow 의 핵심 단정이다. AC-001-06 의 "작성 시점 선택"은 선택이 그 기록
# 한 건에만 적용된다는 뜻이므로, 공개로 저장한 **직후** 다시 작성 화면에 들어가
# 기본값이 비공개로 돌아오는지까지 봐야 성질이 확인된다. 이 성질은 화면이
# 언마운트됐다가 다시 마운트될 때 useState 초기값이 재적용되는 데 의존하고
# (record-text 는 push 로 열려 저장/취소 시 router.back() 으로 pop 된다),
# 그 라이프사이클은 컴포넌트 단위 테스트가 재현하지 못한다 — 그래서 flow 다.
#
# 선택 상태는 컨테이너 testID 접미사(`record-text-visibility-private` /
# `-public`)로만 단정한다 — 칩 두 개는 항상 렌더되므로 칩 존재만으로는
# "무엇이 선택됐는지" 를 알 수 없고, 라벨(🔒 비공개 / 🌐 공개)은 한국어 +
# 이모지 혼합이라 Android Maestro 의 부분 매칭이 불안정하다. 같은 이유로
# 본문도 ASCII 로 입력한다(한글 IME 회피).
#
# 저장된 기록의 공개 상태를 상세 화면에서 재확인하는 것은 이 flow 범위 밖이다
# — 새로 만든 기록의 record id 를 flow 가 알 수 없어 `diary-list-card-<id>` 로
# 특정할 수 없다. 그 부분(payload 의 visibility 값)은
# app/app/__tests__/record-visibility.test.tsx 가 단정한다.
#
# Requires the seeded test user (TEST_USER_EMAIL / TEST_USER_PASSWORD)
# in a fresh onboarding state — CI calls
# `backend/reset-user $TEST_USER_EMAIL` before this flow runs.

# ─── Sign in and finish Case A onboarding so the home is unblocked ───────

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login-fast.yaml
# Q1·Q2 (Case A: 임신 O · 양육 X) → a1
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml
# a1 → a2 → a3 → 홈 (예정일 선택 경로)
- runFlow:
    file: subflows/onboarding-caseA-full.yaml

# ─── Scenario A: default is private, save as-is ───────────────────────────

- assertVisible:
    id: "home-text-cta"
- tapOn:
    id: "home-text-cta"
- assertVisible:
    id: "record-text-screen"

# 본문 입력 — 저장 버튼은 내용이 있어야 활성화된다. autoFocus 에 기대지 않고
# 입력 필드를 명시적으로 탭한다(이 레포의 다른 flow 도 예외 없이 그렇게 한다).
- tapOn:
    id: "record-text-input"
- inputText: "e2e visibility default"

# 키보드 내리기 — `hideKeyboard` 는 이 레포의 iOS 시뮬레이터에서 실패한 전력이
# 있어(subflows/onboarding-caseA-full.yaml 주석) 비인터랙티브 요소를 탭하는
# 관용구를 쓴다. 본문 ScrollView 가 keyboardShouldPersistTaps="handled" 라
# 질문 헤더 탭이 곧 키보드 해제다. 그래야 하단 footer(토글 + 저장)가 가려지지
# 않는다. 헤더는 홈 CTA 가 항상 question 파라미터를 넘기므로 늘 렌더된다.
- tapOn:
    id: "record-text-question-header"

# 토글이 저장 화면에 표시되고, 초기 선택은 비공개다 (TC-001-06 step 2).
- assertVisible:
    id: "record-text-visibility-private"
- assertVisible:
    id: "record-text-visibility-option-private"
- assertVisible:
    id: "record-text-visibility-option-public"

# 그대로 저장 — 비공개 기본값으로 확정된다 (TC-001-06 step 3).
- tapOn:
    id: "record-text-save"
- assertVisible:
    id: "home-tab"

# ─── Scenario B: switch to public before saving ───────────────────────────

- tapOn:
    id: "home-text-cta"
- assertVisible:
    id: "record-text-screen"
- tapOn:
    id: "record-text-input"
- inputText: "e2e visibility public"
- tapOn:
    id: "record-text-question-header"

# 두 번째 진입도 비공개에서 시작한다. 다만 직전 저장이 기본값(비공개) 그대로였
# 으므로 이 단정만으로는 "이월되지 않는다" 가 증명되지 않는다 — 이월될 수 있는
# 값(공개)을 앞세운 확인은 아래 Scenario C 가 한다.
- assertVisible:
    id: "record-text-visibility-private"

# 공개로 전환 — 컨테이너 testID 가 -public 으로 바뀐다 (TC-001-06 step 4).
- tapOn:
    id: "record-text-visibility-option-public"
- assertVisible:
    id: "record-text-visibility-public"
- assertNotVisible:
    id: "record-text-visibility-private"

- tapOn:
    id: "record-text-save"
- assertVisible:
    id: "home-tab"

# ─── Scenario C: the public choice does not carry over ────────────────────
#
# Scenario B 가 공개로 저장한 **직후** 다시 작성 화면에 들어간다. 화면은 pop 되며
# 언마운트됐으므로 새 마운트의 useState 초기값(비공개)이 다시 적용돼야 한다 —
# 직전 선택(공개)이 화면 밖으로 새어 이월되면 여기서 실패한다. 기록을 하나 더
# 만들 필요는 없으므로 취소로 나간다.

- tapOn:
    id: "home-text-cta"
- assertVisible:
    id: "record-text-screen"

# Scenario A·B 와 동일하게 키보드를 내려 하단 footer 를 드러낸다.
- tapOn:
    id: "record-text-question-header"

- assertVisible:
    id: "record-text-visibility-private"
- assertNotVisible:
    id: "record-text-visibility-public"

- tapOn:
    id: "record-text-cancel"
- assertVisible:
    id: "home-tab"
