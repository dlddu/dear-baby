appId: ${APP_ID}
---
# Reusable Case A a1 → a2 → a3 → home subflow (예정일 선택 경로).
#
# Caller must be on the a1 screen (id "onboarding-a1") — typically reached
# via subflows/onboarding-q1-q2-caseA.yaml. This subflow:
#
#   1. Selects 단태 (count=1) on a1 and taps [다음]
#   2. Opens the 예정일 picker, confirms the default date
#   3. Selects 성별 = 아직 몰라요
#   4. Inputs 임신 주차 = 17
#   5. Taps [다음] → a3 (기록 목적)
#   6. Keeps the default 칩 selection and taps [시작하기 ✨] → home
#
# After this subflow runs the user is on the home tab with onboarded_at
# stamped, due_date set, and one fetus row + 기본 purposes persisted.

- assertVisible:
    id: "onboarding-a1"

# 단태아 선택 → a2 진입
- tapOn:
    id: "onboarding-a1-count-1"
- tapOn:
    id: "onboarding-a1-next"
- assertVisible:
    id: "onboarding-a2"

# 예정일 picker 열기
- tapOn:
    id: "onboarding-a2-due-date-field"

# Android: native date-picker dialog — confirm the default date.
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

# iOS: inline spinner renders near the bottom of the screen. A
# center-of-screen swipe misses it, so we target the picker area with
# explicit coordinates to scroll a wheel and trigger onChange.
- runFlow:
    when:
      visible:
        id: "onboarding-a2-date-picker-done"
    commands:
      - swipe:
          start: "50%, 85%"
          end: "50%, 70%"
          duration: 400
      - tapOn:
          id: "onboarding-a2-date-picker-done"

# 성별 = 아직 몰라요
- tapOn:
    id: "onboarding-a2-gender-unknown"

# 임신 주차 = 17
- tapOn:
    id: "onboarding-a2-week"
- inputText: "17"
# 키보드 닫기 — iOS 의 number-pad 키보드는 return 키가 없어 hideKeyboard
# 가 실패한다. 비입력 텍스트를 탭해 키보드를 내린다.
- tapOn:
    text: "기록 가이드를 맞춰 보여드릴게요"

# [다음] → a3 (기록 목적)
- tapOn:
    id: "onboarding-a2-next"
- assertVisible:
    id: "onboarding-a3"

# 기본 선택(매일의 마음·몸의 변화) 그대로 [시작하기 ✨] → 홈
- tapOn:
    id: "onboarding-a3-cta"
- assertVisible:
    id: "home-tab"
