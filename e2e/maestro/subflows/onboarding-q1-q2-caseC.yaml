appId: com.dlddu.dearbaby
---
# Reusable Q1/Q2 subflow for the **Case C** path (임신 X · 양육 O).
# Caller must already be on the Q1 screen (id "onboarding-q1") — usually
# by having just signed in via subflows/tester-login.yaml.
#
# After this subflow runs the user is on the C1 screen
# (id "onboarding-c1"), Case C 의 첫 입력 화면(양육 아이 수)이다.

- assertVisible:
    id: "onboarding-q1"

# Q1 = 아니요, 임신 중이 아니에요
- tapOn:
    id: "onboarding-q1-no"

- assertVisible:
    id: "onboarding-q2"

# Q2 = 네, 키우고 있어요 → Case C → c1 화면
- tapOn:
    id: "onboarding-q2-yes"

- assertVisible:
    id: "onboarding-c1"
