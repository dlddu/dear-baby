appId: ${APP_ID}
---
# Credential half of the tester login, shared by both entry points
# (subflows/tester-login.yaml — the real 15-tap gesture — and
# subflows/tester-login-fast.yaml — the E2E-build shortcut). Callers must
# have already triggered the modal; this subflow waits for it, fills it,
# submits, and leaves the app on whatever screen the session lands on.
#
# Both callers therefore go through the exact same modal, the same
# POST /auth/password-login and the same session write. Only the way the
# modal is opened differs.
#
# Required env (passed via `maestro test --env`):
#   MAESTRO_TEST_USER_EMAIL
#   MAESTRO_TEST_USER_PASSWORD

# The macOS CI iOS 26 simulator is very slow, and the RN <Modal> present +
# animation occasionally lags past the old 5s window — an intermittent
# timeout, not a real failure (the modal does appear; other runs pass in
# <1s). Give it generous headroom.
- extendedWaitUntil:
    visible:
      id: "tester-login-modal"
    timeout: 20000

- tapOn:
    id: "tester-login-email"
# Deliberately still `inputText`, NOT setClipboard + pasteText. The
# clipboard pair looks like it should skip the ~10s-per-field typing cost
# on the CI iOS 26 simulator, but Maestro implements paste as a plain
# re-type of its in-memory clipboard:
#
#   private suspend fun pasteText(): Boolean {
#       copiedText?.let { maestro.inputText(it) }   // same driver call
#       return true
#   }
#   — maestro-orchestra/.../Orchestra.kt
#
# so it costs exactly what inputText costs, plus an extra command per
# field. If you are here looking for more login speed, the remaining cost
# is the driver's text entry itself; shortening the CI credentials or
# skipping the modal entirely are the levers, not the clipboard.
- inputText: ${MAESTRO_TEST_USER_EMAIL}
# Press the keyboard's Next key — the email TextInput has
# returnKeyType=next + onSubmitEditing focusing the password field.
# Avoids `hideKeyboard` mid-flow, which on iOS dismisses the modal
# (Maestro's hideKeyboard fires a screen-area gesture that the
# transparent modal then loses focus to).
- pressKey: Enter
- inputText: ${MAESTRO_TEST_USER_PASSWORD}
# Password TextInput has returnKeyType=done + onSubmitEditing=submit,
# so Enter triggers the login API call. On success the modal calls
# onClose(); on failure the error copy renders inline.
- pressKey: Enter
- assertNotVisible:
    id: "tester-login-modal"
# After the password is submitted, iOS 26 intermittently raises a "Save
# Password?" system dialog a beat LATER — during the transition to the next
# screen — which then covers it and breaks the caller's onboarding assert.
# A `runFlow when visible` check here raced: it evaluates once, and the dialog
# had not appeared yet, so it no-op'd and the dialog surfaced just afterwards.
# tapOn with optional:true instead WAITS for the button and taps it if/when it
# appears, and is a no-op when it never does (Android, or runs where iOS does
# not offer to save). CI evidence: a prior run showed the dialog still appearing
# even with the password field marked textContentType="oneTimeCode", so this
# dismiss — not source suppression — is what reliably handles it.
- tapOn:
    text: "Not Now"
    optional: true
