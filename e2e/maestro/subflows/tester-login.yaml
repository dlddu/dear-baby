appId: ${APP_ID}
---
# Reusable tester-login subflow. Caller must launch the app and arrive
# at the landing screen first. Drives the secret tap pattern (top-left
# 5 times, then top-right 10 times) and submits the test credentials —
# the same code path that ships in production.
#
# Required env (passed via `maestro test --env`):
#   MAESTRO_TEST_USER_EMAIL
#   MAESTRO_TEST_USER_PASSWORD

- assertVisible:
    id: "root"

- tapOn:
    id: "tester-corner-tl"
- tapOn:
    id: "tester-corner-tl"
- tapOn:
    id: "tester-corner-tl"
- tapOn:
    id: "tester-corner-tl"
- tapOn:
    id: "tester-corner-tl"

- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"

# The macOS CI iOS 26 simulator is very slow (a single inputText can take
# ~10s), and the RN <Modal> present + animation occasionally lags past the
# old 5s window — an intermittent timeout, not a real failure (the modal does
# appear; other runs pass in <1s). Give it generous headroom.
- extendedWaitUntil:
    visible:
      id: "tester-login-modal"
    timeout: 20000

- tapOn:
    id: "tester-login-email"
- inputText: ${MAESTRO_TEST_USER_EMAIL}
# Press the keyboard's Next key — the email TextInput has
# returnKeyType=next + onSubmitEditing focusing the password field.
# Avoids `hideKeyboard` mid-flow, which on iOS dismisses the modal
# (Maestro's hideKeyboard fires a screen-area gesture that the
# transparent modal then loses focus to).
- pressKey: Enter
- inputText: ${MAESTRO_TEST_USER_PASSWORD}
# Password TextInput has returnKeyType=done + onSubmitEditing=submit,
# so the second Enter triggers the login API call. On success the
# modal calls onClose(); on failure the error copy renders inline.
- pressKey: Enter
- assertNotVisible:
    id: "tester-login-modal"
# After the password is submitted, iOS 26 may raise a "Save Password?" system
# dialog that covers the next screen and breaks the caller's onboarding
# assert. Dismiss it defensively — `when visible` makes this a no-op when the
# prompt doesn't appear (it is intermittent) and on Android. The password field
# also sets textContentType="oneTimeCode" to suppress the prompt at the source;
# this is the belt-and-suspenders backstop for runs where iOS shows it anyway.
- runFlow:
    when:
      visible: "Save Password"
    commands:
      - tapOn: "Not Now"
