appId: ${APP_ID}
---
# Real tester-login subflow — drives the secret tap pattern (top-left 5
# times, then top-right 10 times) that gates the tester-login modal in the
# same code path that ships in production. Caller must launch the app and
# arrive at the landing screen first.
#
# Only e2e/maestro/login.yaml uses this: it is the flow whose *subject* is
# the login gate. Every other root flow logs in as setup and uses
# subflows/tester-login-fast.yaml instead, which reaches the same modal in
# one press on E2E builds. If you add a flow that must verify the gesture
# itself, point it here.
#
# Required env (passed via `maestro test --env`):
#   MAESTRO_TEST_USER_EMAIL
#   MAESTRO_TEST_USER_PASSWORD

- assertVisible:
    id: "root"

- tapOn:
    id: "tester-corner-tl"
- tapOn:
    id: "tester-corner-tl"
- tapOn:
    id: "tester-corner-tl"
- tapOn:
    id: "tester-corner-tl"
- tapOn:
    id: "tester-corner-tl"

- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"
- tapOn:
    id: "tester-corner-tr"

# Modal wait + credential entry + submit are shared with the fast path.
- runFlow:
    file: tester-login-credentials.yaml
