appId: com.dlddu.dearbaby
---
# Diary detail — open a card, verify detail content, return to list
# (PRD-008 AC-008-04).

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

- assertVisible:
    id: "home-tab"
- tapOn:
    id: "tab-button-diary"
- assertVisible:
    id: "diary-tab"

# Open the first seeded fixture record (id "diary-r1"). seed-diary
# pins this row's content; assertions check the detail screen surfaces it.
- tapOn:
    id: "diary-list-card-diary-r1"
- assertVisible:
    id: "diary-detail"

# Detail header chrome + record meta.
- assertVisible:
    id: "diary-detail-back"
- assertVisible:
    id: "diary-detail-more"
- assertVisible:
    id: "diary-detail-subject"
- assertVisible:
    id: "diary-detail-visibility"
- assertVisible:
    id: "diary-detail-content"

# Back via the topbar arrow returns to the list.
- tapOn:
    id: "diary-detail-back"
- assertVisible:
    id: "diary-tab"
- assertVisible:
    id: "diary-list-card-diary-r1"
