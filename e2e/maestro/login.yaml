appId: ${APP_ID}
---
# 검증 대상: docs/engineering/ENG-003-client-login-process.md (ENG-003)
#
# 인증은 제품 PRD/AC 계층이 아니라 엔지니어링 노트로 관리한다. 이 flow 는
# 그 노트가 기술한 "테스터 로그인 게이트 + 세션 수립 후 온보딩 분기" 동작을
# 검증한다 (ENG-003 §3.3, §4, §9). OAuth 경로(Apple/Google)는 외부 계정
# 의존으로 E2E 자동화 대상이 아니며, 테스터 로그인이 세션 수립 이후의 공통
# 경로를 대신 커버한다. 매핑 근거: docs/doc-tracker.md § "e2e flow 매핑".
#
# Verifies the password sign-in path that backs Apple beta review and
# the rest of the Maestro suite. The flow drives the secret tap pattern
# (top-left 5–7 times, then top-right 10+ times) that gates the
# tester-login modal in the same code path that ships in production —
# there is no build-time test-mode flag, only the seeded password
# (TEST_USER_PASSWORD) and the gesture.
#
# This is the ONLY flow that drives the real gesture. Every other root
# flow logs in as setup, not as its subject, so they use
# subflows/tester-login-fast.yaml — a one-press shortcut that exists only
# in E2E builds and reaches the identical modal / password-login call.
# Keep this flow on subflows/tester-login.yaml so the gesture, and the
# production path it stands for, stay covered.
#
# The MAESTRO_TEST_USER_EMAIL / MAESTRO_TEST_USER_PASSWORD env vars are
# injected by CI (see .github/workflows/e2e-*.yml) and must match the
# backend's TEST_USER_EMAIL / TEST_USER_PASSWORD secrets.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Newly seeded user has no onboarded_at, so login lands on the first
# onboarding screen — Q1 (임신 중인가요?). The dedicated onboarding
# flows verify the rest of the funnel.
- assertVisible:
    id: "onboarding-q1"
