appId: ${APP_ID}
---
# 검증 대상: AC-007-05 (오늘의 질문 카드 — 다른 질문 보기).  [TC-007-05]
#
# Case A(임신 O · 첫 아이) 사용자로 홈에 도착한 뒤, 질문 카드 말풍선 우측 하단의
# 회전 footer(◀ n/3 ▶)로 하루 최대 3개 질문을 회전할 수 있는지를 확인한다.
# 셋업은 CI 실행 형제 home-question-card-undecided.yaml(AC-007-04)과 동일한
# Case A 경로(tester-login-fast · onboarding-q1-q2-caseA · onboarding-caseA-full)를
# 그대로 재사용한다. 셋업 로그인은 E2E 전용 단축 진입점(tester-login-fast)을
# 쓴다 — 실 15탭 제스처(subflows/tester-login.yaml)는 login.yaml 이 단독으로
# 검증하도록 e2e/scripts/check-login-subflows.sh 가 강제한다(#160).
#
# 회전 상태는 인덱스 라벨 testID `home-question-card-index` 의 ASCII 문자열
# (`1/3`→`2/3`→`3/3`)로만 단정한다 — 질문 본문은 한국어라, Android Maestro 의
# UiAutomator 가 한글/이모지 span 을 쪼개 부분문자열 매칭이 불안정하다
# (diary-list-multichild.yaml · ChildContextChip.tsx 주석 참조). 인덱스가
# 한 칸씩 전진하는 것이 곧 "다른 질문으로 회전"의 결정적 증거다: 풀은
# getDailyQuestionTriplet 이 항상 서로 다른 3개(DAILY_QUESTION_SLOTS=3)를
# 돌려주므로 각 인덱스는 다른 질문 본문이다.
#
# 회전 한도(하루 3개)와 양끝 클램프는 app/app/(tabs)/index.tsx 의
# handleNextQuestion(curr < triplet.length-1 ? curr+1 : curr) ·
# handlePrevQuestion(curr > 0 ? curr-1 : curr) 로 소스 확인됨 — 3/3 에서 ▶ 는
# 비활성(onNext 미호출)이라 한 번 더 탭해도 3/3 을 유지한다.
#
# (표시 자체 — 카드·컨텍스트 라벨·CTA — 는 AC-007-04 home-question-card-undecided
#  소관. 본 flow 는 회전 동작·상한만 주검증한다. 자정 초기화(TC-007-05 step 6)는
#  시간 의존이라 e2e 밖 잔여 — src/data/dailyQuestions 단위 테스트 + 수동 QA.)

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login-fast.yaml

# Q1·Q2 (Case A: 임신 O · 양육 X) → a1
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml

# a1 → a2 → a3 → 홈 (예정일 선택 경로)
- runFlow:
    file: subflows/onboarding-caseA-full.yaml

# 카드와 회전 컨트롤(◀ n/3 ▶)이 노출되고, 첫 진입 인덱스는 1/3 이다.  [step 1]
- assertVisible:
    id: "home-question-card"
- assertVisible:
    id: "home-question-card-prev"
- assertVisible:
    id: "home-question-card-next"
- assertVisible:
    id: "home-question-card-index"
    text: "1/3"

# ▶ 1탭 → 2/3 (다음 질문으로 회전).  [step 2]
- tapOn:
    id: "home-question-card-next"
- assertVisible:
    id: "home-question-card-index"
    text: "2/3"

# ▶ 1탭 → 3/3 (마지막 질문).  [step 3]
- tapOn:
    id: "home-question-card-next"
- assertVisible:
    id: "home-question-card-index"
    text: "3/3"

# ▶ 한 번 더 → 하루 3개 상한이라 무시, 여전히 3/3.  [step 4]
- tapOn:
    id: "home-question-card-next"
- assertVisible:
    id: "home-question-card-index"
    text: "3/3"

# ◀ 1탭 → 2/3 (역방향 회전).  [step 5]
- tapOn:
    id: "home-question-card-prev"
- assertVisible:
    id: "home-question-card-index"
    text: "2/3"
