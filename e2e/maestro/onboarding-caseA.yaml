appId: ${APP_ID}
---
# Onboarding Case A — 임신만 (Q1=Y · Q2=N) 풀 시나리오.
#
# Verifies AC-006-02 의 전체 흐름: Q1 → Q2 → A1 → A2 (예정일 선택) → A3 →
# [시작하기 ✨] → 홈. A2 의 [아직 정해지지 않았어요] 분기와 화면 카피 어셋션은
# 사양에 없는 구현 디테일이라 app/(onboarding)/__tests__/a2.test.tsx 가
# 단위 검증으로 책임진다.
#
# CI must reset the seeded test user's onboarding state via
# `backend/reset-user $TEST_USER_EMAIL` before running this flow.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login-fast.yaml

# Q1·Q2 (Case A: 임신 O · 양육 X) → a1
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml

# a1 → a2 → a3 → 홈 (예정일 선택 경로)
- runFlow:
    file: subflows/onboarding-caseA-full.yaml

# PRD-007 AC-007-01·03 — 홈 도착 후 새 헤더가 보여야 한다.
- assertVisible:
    id: "home-header"
- assertVisible:
    id: "home-header-bell"
