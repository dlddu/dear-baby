appId: ${APP_ID}
---
# PRD-007 TC-007-02-B — 헤더 다자녀 전환.
#
# Case B 사용자(양육 2명 + 다태 2명 = 활성 아이 4명)로 홈에 도착한 뒤,
# 헤더 우측 ▶ 화살표가 활성 상태이며 탭할 때마다 헤더 중앙 이름이 다음
# 아이로 전환되는지를 확인한다. Case B subflow 의 입력 이름은
# subflows/onboarding-caseB-full.yaml 의 양육 아이(서연·이서) 와
# 태아 닉네임(콩이·샛별) — 정규화 순서상 children 먼저, fetuses 다음이다.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1·Q2 (Case B) → b0 진입
- runFlow:
    file: subflows/onboarding-q1-q2-caseB.yaml

# b0 → b6 → 홈
- runFlow:
    file: subflows/onboarding-caseB-full.yaml

# 홈 도착 후 헤더 가시성과 첫 활성 아이 이름.
- assertVisible:
    id: "home-header"
- assertVisible:
    id: "home-header-name"
- assertVisible: "서연"

# ▶ 탭 → 둘째 양육 아이 (이서)
- tapOn:
    id: "home-header-next"
- assertVisible: "이서"

# ▶ 탭 → 첫째 태아 (콩이)
- tapOn:
    id: "home-header-next"
- assertVisible: "콩이"

# ▶ 탭 → 둘째 태아 (샛별)
- tapOn:
    id: "home-header-next"
- assertVisible: "샛별"

# ◀ 탭 → 다시 콩이
- tapOn:
    id: "home-header-prev"
- assertVisible: "콩이"

# 콜드부트 — 마지막 활성 인덱스(콩이) 가 복원되는지 확인 (AsyncStorage 영속화).
- launchApp
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"
- assertVisible:
    id: "home-tab"
- assertVisible: "콩이"
