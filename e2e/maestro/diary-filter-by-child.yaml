appId: ${APP_ID}
---
# 검증 대상: AC-008-08 (필터 — 아이·날짜·미디어·공개 여부).
#
# Diary filter — 다자녀 사용자가 아이 칩을 사용해 특정 아이 기록만 본다
# (PRD-008 AC-008-08).
#
# seed_diary 는 콩이(fetus, subject_id="seed-fetus-1") + 하준(child,
# subject_id="seed-child-1") + 5개 기록을 시드한다. 필터 시트에서 하준만
# 선택 → 목록에 콩이 카드(diary-r1·r2·r4) 가 사라지고 하준 카드(diary-r3·r5)
# 만 남는다.
#
# 모든 assertion 은 testID 기반 — Android Maestro 가 emoji+Korean 혼합
# 텍스트의 부분 매칭에서 실패하는 경우가 있어 text matcher 를 피한다.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login-fast.yaml

- assertVisible:
    id: "home-tab"
- tapOn:
    id: "tab-button-diary"
- assertVisible:
    id: "diary-tab"

# 초기 상태: 두 아이 카드 모두 노출.
- assertVisible:
    id: "diary-list-card-diary-r1"
- assertVisible:
    id: "diary-list-card-diary-r3"

# 필터 시트 열기.
- tapOn:
    id: "diary-filter-open"
- assertVisible:
    id: "diary-filter-sheet"

# 하준 칩 탭 → 적용.
- tapOn:
    id: "diary-filter-child-seed-child-1"
- tapOn:
    id: "diary-filter-apply"

# 필터 적용 후: 하준 기록만 남고 콩이 카드는 사라진다.
- assertVisible:
    id: "diary-tab"
- assertVisible:
    id: "diary-list-card-diary-r3"
- assertNotVisible:
    id: "diary-list-card-diary-r1"

# 필터 활성 표시 점이 헤더에 노출됨.
- assertVisible:
    id: "diary-filter-active-dot"

# 다시 열어 초기화.
- tapOn:
    id: "diary-filter-open"
- tapOn:
    id: "diary-filter-reset"
- tapOn:
    id: "diary-filter-apply"
- assertVisible:
    id: "diary-list-card-diary-r1"
- assertVisible:
    id: "diary-list-card-diary-r3"
