appId: com.dlddu.dearbaby
---
# Diary filter — 다자녀 사용자가 아이 칩을 사용해 특정 아이 기록만 본다
# (PRD-008 AC-008-08).
#
# seed_diary 는 콩이(fetus) + 하준(child) 두 아이 + 5개 기록을 시드한다.
# 필터 시트에서 하준만 선택 → 목록에 콩이 기록이 사라지고 하준 카드만 남는다.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

- assertVisible:
    id: "home-tab"
- tapOn: "일기"
- assertVisible:
    id: "diary-tab"

# 초기 상태: 두 아이 모두 노출.
- assertVisible: "콩이"
- assertVisible: "하준"

# 필터 시트 열기.
- tapOn:
    id: "diary-filter-open"
- assertVisible:
    id: "diary-filter-sheet"

# 하준 칩 탭 → 적용.
- tapOn: "👶 하준"
- tapOn:
    id: "diary-filter-apply"

# 필터 적용 후: 하준 기록만 남고 콩이 카드는 사라진다.
- assertVisible:
    id: "diary-tab"
- assertVisible: "하준"
- assertNotVisible: "콩이"

# 필터 활성 표시 점이 헤더에 노출됨.
- assertVisible:
    id: "diary-filter-active-dot"

# 다시 열어 초기화.
- tapOn:
    id: "diary-filter-open"
- tapOn:
    id: "diary-filter-reset"
- tapOn:
    id: "diary-filter-apply"
- assertVisible: "콩이"
- assertVisible: "하준"
