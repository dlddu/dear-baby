appId: ${APP_ID}
---
# Diary list — multi-child integrated view (PRD-008 AC-008-01·02·03·10).
#
# Setup: seed_diary has installed a fixture user with 1 fetus (콩이) + 1
# child (하준) + 5 records spanning two months. The diary tab integrates
# all records regardless of active child (AC-008-01) — assertions verify
# cards from both children appear in the same list.
#
# Korean substring assertions on Android Maestro turned out to be unreliable
# (UiAutomator splits emoji + Korean spans so `assertVisible: "콩이"` times
# out even when the text is on screen). We assert by card testID instead —
# seed-diary pins record IDs to "diary-r1" … "diary-r5" and the cards
# expose testID="diary-list-card-<id>".

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# After tester-login, the AuthGate observes the seeded onboarded_at and
# routes straight to the home tab. Navigate to diary.
- assertVisible:
    id: "home-tab"
- tapOn:
    id: "tab-button-diary"
- assertVisible:
    id: "diary-tab"

# Diary-tab header has the title and notification bell, but NOT the
# left/right arrows the home header uses (AC-008-10).
- assertVisible:
    id: "diary-header"
- assertVisible:
    id: "diary-header-bell"
- assertNotVisible:
    id: "home-header-prev"
- assertNotVisible:
    id: "home-header-next"

# Records from both children appear — seed-diary pins diary-r1 (fetus 콩이),
# diary-r3 (child 하준). Their cards must both be on screen.
- assertVisible:
    id: "diary-list-card-diary-r1"
- assertVisible:
    id: "diary-list-card-diary-r3"
