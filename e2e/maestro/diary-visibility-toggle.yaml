appId: com.dlddu.dearbaby
---
# Diary visibility toggle — ⋯ 액션 시트의 공개·비공개 전환 (PRD-008
# AC-008-07). diary-r1 은 fixture 상 private 으로 시드되므로 토글 후
# 상세 배지 / 카드 배지가 "🌐 공개" 로 바뀐다.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

- assertVisible:
    id: "home-tab"
- tapOn: "일기"
- assertVisible:
    id: "diary-tab"

- tapOn:
    id: "diary-list-card-diary-r1"
- assertVisible:
    id: "diary-detail"

# 초기 상태: 비공개.
- assertVisible: "🔒 비공개"

# 액션 시트 → 공개로 전환.
- tapOn:
    id: "diary-detail-more"
- tapOn:
    id: "diary-action-visibility"

# 토글 후 상세 화면 배지가 공개로 갱신.
- assertVisible:
    id: "diary-detail"
- assertVisible: "🌐 공개"
- assertNotVisible: "🔒 비공개"

# 다시 토글 → 비공개.
- tapOn:
    id: "diary-detail-more"
- tapOn:
    id: "diary-action-visibility"
- assertVisible: "🔒 비공개"
