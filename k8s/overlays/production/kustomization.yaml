apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production environment — pinned to the dear-baby-prod namespace so
# the staging overlay (dear-baby-staging) can run alongside it on the
# same cluster without colliding on resource names. Resource names in
# base/ are intentionally unsuffixed; the namespace is the only
# differentiator across environments.
namespace: dear-baby-prod

resources:
  - ../../base
