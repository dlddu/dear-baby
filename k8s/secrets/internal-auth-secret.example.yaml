# Copy to internal-auth-secret.yaml and populate before applying. The SAME
# token must be set for both backend (env INTERNAL_API_TOKEN) and worker
# (env INTERNAL_API_TOKEN) — the backend middleware checks
# `X-Internal-Token` against this value.
apiVersion: v1
kind: Secret
metadata:
  name: internal-auth-secret
type: Opaque
stringData:
  INTERNAL_API_TOKEN: "CHANGE_ME"
