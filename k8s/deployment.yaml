apiVersion: apps/v1
kind: Deployment
metadata:
  name: dear-baby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dear-baby
  template:
    metadata:
      labels:
        app: dear-baby
    spec:
      # The distroless nonroot base runs the backend as uid/gid 65532, and the
      # backend opens a SQLite file on startup (before ListenAndServe), so it
      # needs a writable path. fsGroup makes the emptyDir below writable by
      # the nonroot group. TODO: replace emptyDir with a PVC once persistence
      # matters — this is intentionally ephemeral for now.
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/dlddu/dear-baby:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              value: "file:/data/dear-baby.db?_pragma=foreign_keys(1)&_pragma=journal_mode(wal)"
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
