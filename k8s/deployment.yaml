apiVersion: apps/v1
kind: Deployment
metadata:
  name: dear-baby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dear-baby
  template:
    metadata:
      labels:
        app: dear-baby
    spec:
      containers:
        - name: backend
          image: ghcr.io/dlddu/dear-baby:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              value: "file:/data/dear-baby.db?_pragma=foreign_keys(1)&_pragma=journal_mode(wal)"
            # In-cluster Redis is ClusterIP-only with no auth, so the URL
            # carries no secret material — keep it as plain config.
            - name: REDIS_URL
              value: "redis://redis:6379"
          envFrom:
            - secretRef:
                name: auth-secret
            # Required. Created from k8s/secrets/aws-assume-role-secret.example.
            # The pod refuses to schedule without it — that's deliberate, so
            # a missing secret surfaces immediately on rollout instead of as
            # silent 503s on the audio routes. Dev clusters without AWS
            # credentials should still apply the secret with empty values
            # (AWS_S3_BUCKET="" disables the audio routes at runtime via
            # Config.AudioUploadsEnabled).
            - secretRef:
                name: aws-assume-role-secret
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dear-baby-data
