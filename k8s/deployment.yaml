apiVersion: apps/v1
kind: Deployment
metadata:
  name: dear-baby
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dear-baby
  template:
    metadata:
      labels:
        app: dear-baby
    spec:
      containers:
        - name: backend
          image: ghcr.io/dlddu/dear-baby:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              value: "file:/data/dear-baby.db?_pragma=foreign_keys(1)&_pragma=journal_mode(wal)"
            # In-cluster Redis is ClusterIP-only with no auth, so the URL
            # carries no secret material — keep it as plain config.
            - name: REDIS_URL
              value: "redis://redis:6379"
          envFrom:
            - secretRef:
                name: auth-secret
            # Bootstrap AWS credentials for the records-audio pipeline.
            # The backend uses these only to call sts:AssumeRole — the
            # role then grants the S3 permissions for the bucket. Both
            # CI (MinIO root) and prod (an IAM user scoped to a single
            # AssumeRole call) carry the secret; the deployment will
            # not start without it.
            - secretRef:
                name: aws-credentials
            # Records-audio configuration: AWS_REGION, AWS_S3_BUCKET,
            # AWS_S3_KEY_PREFIX, AWS_ASSUME_ROLE_ARN. Prod ships the
            # writer-role ARN here; CI ships MinIO endpoint overrides
            # (AWS_ENDPOINT_URL_S3, AWS_S3_FORCE_PATH_STYLE) and omits
            # the role ARN so the SDK uses ambient creds directly.
            - secretRef:
                name: aws-records-audio
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dear-baby-data
