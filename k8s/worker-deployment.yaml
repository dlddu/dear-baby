apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/dlddu/dear-baby-worker:latest
          imagePullPolicy: Always
          env:
            - name: LOG_LEVEL
              value: "info"
            # Model is plain config, not a secret. Override via a
            # ConfigMap or literal env as needed.
            - name: OPENROUTER_MODEL
              value: "openai/gpt-4o-mini"
            - name: INTERNAL_API_URL
              value: "http://dear-baby:8080"
          envFrom:
            - secretRef:
                name: openrouter-secret
            - secretRef:
                name: redis-secret
            - secretRef:
                name: internal-auth-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
