apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/dlddu/dear-baby-worker:latest
          imagePullPolicy: Always
          env:
            - name: LOG_LEVEL
              value: "info"
            # In-cluster Redis is ClusterIP-only with no auth, so the URL
            # carries no secret material — keep it as plain config.
            - name: REDIS_URL
              value: "redis://redis:6379"
          envFrom:
            # Carries OPENROUTER_API_KEY plus OPENROUTER_MODEL — the model
            # slug rides the same secret so operators rotate the key/model
            # pair together without touching the manifest.
            - secretRef:
                name: openrouter-secret
            # Optional: when langfuse-secret is missing, observeOpenAI
            # degrades to a pass-through and the worker still ships.
            - secretRef:
                name: langfuse-secret
                optional: true
