apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/dlddu/dear-baby-worker:latest
          imagePullPolicy: Always
          env:
            - name: LOG_LEVEL
              value: "info"
            # Model is plain config, not a secret. Override via a
            # ConfigMap or literal env as needed. Defaults to OpenRouter's
            # free-tier auto-router (https://openrouter.ai/openrouter/free)
            # so dev/integration clusters don't need paid credits.
            - name: OPENROUTER_MODEL
              value: "openrouter/free"
            - name: INTERNAL_API_URL
              value: "http://dear-baby:8080"
            # In-cluster Redis is ClusterIP-only with no auth, so the URL
            # carries no secret material — keep it as plain config.
            - name: REDIS_URL
              value: "redis://redis:6379"
          envFrom:
            - secretRef:
                name: openrouter-secret
            - secretRef:
                name: internal-auth-secret
            # Optional: when langfuse-secret is missing, observeOpenAI
            # degrades to a pass-through and the worker still ships.
            - secretRef:
                name: langfuse-secret
                optional: true
