apiVersion: apps/v1
kind: Deployment
metadata:
  name: dear-baby
spec:
  replicas: 1
  # SQLite is a single-writer store living on a ReadWriteOnce PVC. The
  # default RollingUpdate briefly runs the old and new pods at once; when
  # they land on the same node both can mount the RWO volume and write the
  # same .db file, which corrupts it ("database disk image is malformed").
  # Recreate terminates the old pod before starting the new one, so there
  # is only ever one writer across a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dear-baby
  template:
    metadata:
      labels:
        app: dear-baby
    spec:
      containers:
        - name: backend
          image: ghcr.io/dlddu/dear-baby:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # journal_mode is DELETE, not WAL: /data is an EFS volume and WAL needs a
            # -shm mapping shared by every process holding the file open, which a
            # network filesystem does not guarantee. replicas=1 + Recreate below
            # keeps this a single-writer database, as the rollback journal assumes.
            - name: DATABASE_URL
              value: "file:/data/dear-baby.db?_pragma=foreign_keys(1)&_pragma=journal_mode(delete)"
            # In-cluster Redis is ClusterIP-only with no auth, so the URL
            # carries no secret material — keep it as plain config.
            - name: REDIS_URL
              value: "redis://redis:6379"
          envFrom:
            - secretRef:
                name: auth-secret
            # Records-audio configuration: AWS_REGION, AWS_S3_BUCKET,
            # AWS_S3_KEY_PREFIX, AWS_ASSUME_ROLE_ARN. Prod ships the
            # writer-role ARN here and relies on IRSA to provide the
            # bootstrap credentials the SDK uses to call sts:AssumeRole;
            # CI ships MinIO endpoint overrides (AWS_ENDPOINT_URL_S3,
            # AWS_S3_FORCE_PATH_STYLE) plus static AWS_ACCESS_KEY_ID /
            # AWS_SECRET_ACCESS_KEY (kind has no IRSA / OIDC) and omits
            # the role ARN so the SDK uses those static creds directly
            # against MinIO.
            - secretRef:
                name: aws-records-audio
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dear-baby-data
