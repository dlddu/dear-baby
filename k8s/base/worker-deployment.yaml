apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/dlddu/dear-baby-worker:latest
          imagePullPolicy: Always
          env:
            - name: LOG_LEVEL
              value: "info"
            # In-cluster Redis is ClusterIP-only with no auth, so the URL
            # carries no secret material — keep it as plain config.
            - name: REDIS_URL
              value: "redis://redis:6379"
          envFrom:
            # OPENROUTER_API_KEY only.
            - secretRef:
                name: openrouter-secret
            # OPENROUTER_MODEL — the model slug is not a secret, so it lives
            # in a ConfigMap and can change without touching the manifest.
            - configMapRef:
                name: openrouter-config
            # Optional: when langfuse-secret is missing, the worker's
            # tracing bootstrap returns a no-op handle and OpenRouter
            # spans are dropped silently, so the deployment still ships.
            # The Secret carries LANGFUSE_SECRET_KEY; the public key and
            # base URL live in the (equally optional) langfuse-config.
            - secretRef:
                name: langfuse-secret
                optional: true
            - configMapRef:
                name: langfuse-config
                optional: true
