appId: com.dlddu.dearbaby
---
# Onboarding Case B — 양육 + 임신 (양육 2명·다태 2명) 풀 시나리오.
#
# Verifies AC-006-03 의 전체 흐름: Q1·Q2 → b0 (안내 ①) → b1 → [b2 → b2-purpose]×2
# → b3 (안내 ②) → b4 → [b5]×2 → b6 (일괄 기록 목적) → completeAsB → 홈.
# 백엔드 측에서는 POST /me/onboarding/case-b 로 children + fetuses 행이
# 한 트랜잭션에 영속화된다.
#
# CI must reset the seeded test user's onboarding state via
# `backend/reset-onboarding $TEST_USER_EMAIL` before running this flow.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1·Q2 (Case B: 임신 O · 양육 O) → b0 진입
- runFlow:
    file: subflows/onboarding-q1-q2-caseB.yaml

# b0 → b1 → [b2 → b2-purpose]×2 → b3 → b4 → [b5]×2 → b6 → 홈
- runFlow:
    file: subflows/onboarding-caseB-full.yaml
