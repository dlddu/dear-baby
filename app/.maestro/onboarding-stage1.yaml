appId: com.dlddu.dearbaby
---
# Onboarding Stage 1 – E2E Tests
# Verifies the welcome screen where users enter their expected due date
# or skip it. Requires EXPO_PUBLIC_TEST_AUTH_ENABLED=true (app) and
# TEST_AUTH_ENABLED=true (backend).

# ─── Path 1: UI elements + skip → home ───────────────────────────

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

# Tester login is hidden behind a corner-tap gesture: 6 taps on the
# top-left overlay (inside the [5,7] window the gesture accepts), then
# 10 taps on the top-right overlay surfaces the tester modal.
- tapOn:
    id: "tester-gesture-top-left"
    repeat: 6
- tapOn:
    id: "tester-gesture-top-right"
    repeat: 10
- assertVisible:
    id: "tester-login-tester-onboarding@dear-baby.test"
- tapOn:
    id: "tester-login-tester-onboarding@dear-baby.test"
- assertVisible:
    id: "onboarding-welcome"

# Verify all welcome-screen copy & controls
- assertVisible: "DearBaby"
- assertVisible: "반가워요, 엄마 🌷"
- assertVisible: "아기를 만날 예정일을 알려주세요"
- assertVisible: "날짜 선택하기"
- assertVisible: "시작하기"
- assertVisible: "아직 정해지지 않았어요"

# Tap skip → should navigate to home
- tapOn:
    id: "onboarding-skip-button"
- assertVisible:
    id: "home-tab"

# ─── Path 2: Select due date → start → home ──────────────────────

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

# Tester login is hidden behind a corner-tap gesture: 6 taps on the
# top-left overlay (inside the [5,7] window the gesture accepts), then
# 10 taps on the top-right overlay surfaces the tester modal.
- tapOn:
    id: "tester-gesture-top-left"
    repeat: 6
- tapOn:
    id: "tester-gesture-top-right"
    repeat: 10
- assertVisible:
    id: "tester-login-tester-onboarding@dear-baby.test"
- tapOn:
    id: "tester-login-tester-onboarding@dear-baby.test"
- assertVisible:
    id: "onboarding-welcome"

# Open the date picker
- tapOn:
    id: "onboarding-due-date-field"

# Android: native date-picker dialog — confirm the default date.
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

# iOS: inline spinner renders near the bottom of the screen. A
# center-of-screen swipe misses it, so we target the picker area with
# explicit coordinates to scroll a wheel and trigger onChange.
- runFlow:
    when:
      visible:
        id: "onboarding-date-picker-done"
    commands:
      - swipe:
          start: "50%, 85%"
          end: "50%, 70%"
          duration: 400
      - tapOn:
          id: "onboarding-date-picker-done"

# Start button should now be enabled
- tapOn:
    id: "onboarding-start-button"
- assertVisible:
    id: "home-tab"
