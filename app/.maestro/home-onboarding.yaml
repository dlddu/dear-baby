appId: com.dlddu.dearbaby
---
# Home / Onboarding Stage 2 – E2E Tests (basic paths, no worker required)
# Verifies the home-screen voice-record coachmark + question card + dual CTAs
# + initial teaser state of the AI preview. Requires
# EXPO_PUBLIC_TEST_AUTH_ENABLED=true (app) and TEST_AUTH_ENABLED=true
# (backend), same as Stage 1. Test-login with onboarded=false also resets
# the server-side onboarding row (coachmark dismissal + first_record_at +
# ai_preview), so each run starts from a blank slate.
#
# Path 3 (first record → loading → ready via the worker + OpenRouter) lives
# in home-onboarding-ai.yaml and is gated on OPENROUTER_API_KEY.

# ─── Path 1: due date → home shows full Stage 2 + coachmark persists ───

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- assertVisible:
    id: "test-login-button"
- tapOn:
    id: "test-login-button"
- assertVisible:
    id: "onboarding-welcome"

- tapOn:
    id: "onboarding-due-date-field"

# Android: native date-picker dialog — confirm the default date.
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

# iOS: inline spinner — scroll wheel + Done, same pattern as stage1.
- runFlow:
    when:
      visible:
        id: "onboarding-date-picker-done"
    commands:
      - swipe:
          start: "50%, 85%"
          end: "50%, 70%"
          duration: 400
      - tapOn:
          id: "onboarding-date-picker-done"

- tapOn:
    id: "onboarding-start-button"
- assertVisible:
    id: "home-tab"

# Home UI
- assertVisible:
    id: "home-question-card"
- assertVisible: "첫 기록이 가장 소중해요 🌱"
- assertVisible:
    id: "home-week-badge"
- assertVisible:
    id: "home-coachmark"
- assertVisible: "🎙 말하기만 해도 기록이 돼요!"
- assertVisible:
    id: "home-voice-cta"
- assertVisible:
    id: "home-text-cta"
- assertVisible:
    id: "home-ai-preview"

# Dismiss the coachmark → it disappears immediately
- tapOn:
    id: "home-coachmark-dismiss"
- assertNotVisible:
    id: "home-coachmark"

# Relaunch without wiping state: the dismissal must be persisted by the
# backend, so the coachmark should NOT re-appear.
- launchApp
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"
- assertVisible:
    id: "home-tab"
- assertNotVisible:
    id: "home-coachmark"

# ─── Path 2: "undecided" → no week badge on home ────────────────────

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- assertVisible:
    id: "test-login-button"
- tapOn:
    id: "test-login-button"
- assertVisible:
    id: "onboarding-welcome"

- tapOn:
    id: "onboarding-skip-button"
- assertVisible:
    id: "home-tab"

- assertVisible:
    id: "home-question-card"
- assertVisible:
    id: "home-voice-cta"
- assertVisible:
    id: "home-text-cta"
- assertVisible:
    id: "home-ai-preview"
- assertNotVisible:
    id: "home-week-badge"

# Voice CTA still "coming soon".
- tapOn:
    id: "home-voice-cta"
- assertVisible: "곧 추가됩니다"
- tapOn: "OK"

# Voice tap also engages with the coachmark target → coachmark closes.
- assertNotVisible:
    id: "home-coachmark"
