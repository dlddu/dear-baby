appId: com.dlddu.dearbaby
---
# Home Onboarding – E2E Tests
# Verifies the home-screen voice-record coachmark + question card + dual CTAs
# + blurred AI preview shown to users who just completed Stage 1. Requires
# EXPO_PUBLIC_TEST_AUTH_ENABLED=true (app) and TEST_AUTH_ENABLED=true
# (backend), same as Stage 1. Test-login with onboarded=false resets the
# server-side onboarding state so each run starts from a blank slate.

# ─── Path 1: due date → home shows full coachmark + coachmark persists ───

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- assertVisible:
    id: "test-login-button"
- tapOn:
    id: "test-login-button"
- assertVisible:
    id: "onboarding-welcome"

- tapOn:
    id: "onboarding-due-date-field"

# Android: native date-picker dialog — confirm the default date.
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

# iOS: inline spinner — scroll wheel + Done, same pattern as stage1.
- runFlow:
    when:
      visible:
        id: "onboarding-date-picker-done"
    commands:
      - swipe:
          start: "50%, 85%"
          end: "50%, 70%"
          duration: 400
      - tapOn:
          id: "onboarding-date-picker-done"

- tapOn:
    id: "onboarding-start-button"
- assertVisible:
    id: "home-tab"

# Home UI
- assertVisible:
    id: "home-question-card"
- assertVisible: "첫 기록이 가장 소중해요 🌱"
- assertVisible:
    id: "home-week-badge"
- assertVisible:
    id: "home-coachmark"
- assertVisible: "🎙 말하기만 해도 기록이 돼요!"
- assertVisible:
    id: "home-voice-cta"
- assertVisible:
    id: "home-text-cta"
- assertVisible:
    id: "home-ai-preview"

# Dismiss the coachmark → it disappears immediately
- tapOn:
    id: "home-coachmark-dismiss"
- assertNotVisible:
    id: "home-coachmark"

# Relaunch without wiping state: the dismissal must be persisted by the
# backend, so the coachmark should NOT re-appear.
- launchApp
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"
- assertVisible:
    id: "home-tab"
- assertNotVisible:
    id: "home-coachmark"

# ─── Path 2: "undecided" → no week badge on home ────────────────────

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- assertVisible:
    id: "test-login-button"
- tapOn:
    id: "test-login-button"
- assertVisible:
    id: "onboarding-welcome"

- tapOn:
    id: "onboarding-skip-button"
- assertVisible:
    id: "home-tab"

- assertVisible:
    id: "home-question-card"
- assertVisible:
    id: "home-voice-cta"
- assertVisible:
    id: "home-text-cta"
- assertVisible:
    id: "home-ai-preview"
- assertNotVisible:
    id: "home-week-badge"

# ─── Path 3: voice is still "coming soon"; text flow saves + AI preview ──

- tapOn:
    id: "home-voice-cta"
- assertVisible: "곧 추가됩니다"
- tapOn: "OK"

# Voice tap also engages with the coachmark target → coachmark closes.
- assertNotVisible:
    id: "home-coachmark"

# Text CTA opens the record modal, save → backend stamps first_record_at →
# home subscribes to SSE → AI preview renders when the worker finishes.
# NOTE: Maestro's `inputText` does not support Unicode on Android
# (mobile-dev-inc/maestro#146), so the body here is ASCII. The assertions
# afterwards check the app's own status copy, not user-provided text.
- tapOn:
    id: "home-text-cta"
- assertVisible:
    id: "record-text-screen"
- tapOn:
    id: "record-text-input"
- inputText: "today i felt you move for the first time"
# Android 에선 soft keyboard 가 저장 버튼을 덮어 tapOn 이 실패한다. 입력
# 직후 키보드를 내려 버튼을 노출시킨다.
- hideKeyboard
- tapOn:
    id: "record-text-save"
- assertVisible:
    id: "home-tab"

# First-record save flips `first_record_at`, which auto-hides the coachmark.
- assertNotVisible:
    id: "home-coachmark"

# The home screen kicks off the AI preview request + SSE subscription on
# detecting the first-record transition. Loading copy shows while we wait.
- assertVisible: "AI가 당신의 기록을 정리하고 있어요"

# OpenRouter-backed worker may take up to ~30s on a cold CI runner.
- extendedWaitUntil:
    visible: "AI가 당신의 기록을 이렇게 정리했어요"
    timeout: 30000
