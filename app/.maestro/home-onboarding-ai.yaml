appId: com.dlddu.dearbaby
---
# Home / Onboarding Stage 2 – AI preview E2E (requires OPENROUTER_API_KEY)
# This flow is gated on the OpenRouter key being present in CI secrets.
# When the key is absent, CI skips this file — the worker isn't started
# and the ready-state assertion would never pass.
#
# Covers Path 3: first record → loading → ready via the worker + OpenRouter.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- assertVisible:
    id: "test-login-button"
- tapOn:
    id: "test-login-button"
- assertVisible:
    id: "onboarding-welcome"

- tapOn:
    id: "onboarding-skip-button"
- assertVisible:
    id: "home-tab"

# Text CTA opens the record modal, save → backend stamps first_record_at →
# home detects the transition and triggers the AI preview task. NOTE:
# Maestro's `inputText` does not support Unicode on Android
# (mobile-dev-inc/maestro#146), so the body here is ASCII.
- tapOn:
    id: "home-text-cta"
- assertVisible:
    id: "record-text-screen"
- tapOn:
    id: "record-text-input"
- inputText: "today i felt you move for the first time"
# Android 에선 soft keyboard 가 저장 버튼을 덮어 tapOn 이 실패한다. 입력
# 직후 키보드를 내려 버튼을 노출시킨다.
- hideKeyboard
- tapOn:
    id: "record-text-save"
- assertVisible:
    id: "home-tab"

# Loading → ready: the worker takes ≤30s to round-trip OpenRouter.
- assertVisible: "AI가 정리하는 중이에요"
- assertVisible:
    text: "AI가 당신의 기록을 이렇게 정리했어요"
    timeout: 30000

# Coachmark is auto-hidden once first_record_at is stamped.
- assertNotVisible:
    id: "home-coachmark"
