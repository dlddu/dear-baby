appId: com.dlddu.dearbaby
---
# Onboarding → Home (예정일 미정 경로) 확인.
#
# 예정일 스킵 사용자도 홈에 도착하면 1인칭 질문 카드 + 음성/텍스트 CTA 가
# 동일하게 노출된다. 컨텍스트 라벨(D-day/주차) 만 비어 있다.
#
# CI must reset the seeded test user's onboarding state before running
# this flow.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1·Q2 (Case A: 임신 O · 양육 X) → a1
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml

# a1 → a2 → 홈 (예정일 스킵 경로)
- runFlow:
    file: subflows/onboarding-caseA-a1-a2-skip.yaml

# PRD-007 AC-007-01·03 — 헤더(이름·종) + AC-007-04·06 1인칭 카드 + CTA.
- assertVisible:
    id: "home-header"
- assertVisible:
    id: "home-header-bell"
- assertVisible:
    id: "home-question-card"
- assertVisible:
    id: "home-voice-cta"
- assertVisible:
    id: "home-text-cta"
# 예정일 미정 경로 — 카드의 컨텍스트 라벨(D-36 등) 은 없다.
- assertNotVisible:
    id: "home-question-card-context"
