appId: com.dlddu.dearbaby
---
# Onboarding Stage 2 – undecided path.
#
# Verifies that skipping the due date still surfaces the Stage 2 home
# (question card + coachmark + voice/text CTAs + AI preview) but
# without the week badge, since week-of-pregnancy is undefined.
#
# CI must reset the seeded test user's onboarding state before running
# this flow.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1·Q2 (Case A: 임신 O · 양육 X) → a1
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml

# a1 → a2 → 홈 (예정일 스킵 경로)
- runFlow:
    file: subflows/onboarding-caseA-a1-a2-skip.yaml

# PRD-007 AC-007-01·03 — 헤더(이름·종) 는 예정일 미정 경로에서도 보여야 한다.
- assertVisible:
    id: "home-header"
- assertVisible:
    id: "home-header-bell"
- assertVisible:
    id: "stage2-question-card"
- assertVisible:
    id: "stage2-voice-cta"
- assertVisible:
    id: "stage2-text-cta"
- assertVisible:
    id: "stage2-ai-preview"
- assertNotVisible:
    id: "stage2-week-badge"
