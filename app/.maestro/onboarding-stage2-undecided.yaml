appId: com.dlddu.dearbaby
---
# Home (post-onboarding) — undecided / no-week path.
#
# Verifies that a user who completed onboarding without any pregnancy
# context (Case C) still sees the home stage 2 surfaces — question card,
# coachmark, dual CTAs, AI preview — but without the week badge, since
# pregnancy data only exists for Case A/B.
#
# CI must reset the seeded test user's onboarding state before running.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

- runFlow:
    file: subflows/onboarding-case-c-quick.yaml

- assertVisible:
    id: "stage2-question-card"
- assertVisible:
    id: "stage2-voice-cta"
- assertVisible:
    id: "stage2-text-cta"
- assertVisible:
    id: "stage2-ai-preview"
- assertNotVisible:
    id: "stage2-week-badge"
