appId: com.dlddu.dearbaby
---
# Onboarding Case A – select-date path.
#
# Verifies the full Case A flow (Q1 → Q2 → A1 → A2) with a 예정일 입력
# and the [시작하기] CTA that stamps onboarded_at + due_date and lands
# on home.
#
# CI must reset the seeded test user's onboarding state via
# `backend/reset-onboarding $TEST_USER_EMAIL` before running this flow.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1·Q2 (Case A: 임신 O · 양육 X) → a1
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml

# a1 → a2 → 홈 (예정일 선택 경로)
- runFlow:
    file: subflows/onboarding-caseA-a1-a2-date.yaml
