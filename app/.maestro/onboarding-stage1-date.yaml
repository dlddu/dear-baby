appId: com.dlddu.dearbaby
---
# Onboarding Stage 1 – select-date path.
#
# Verifies the due-date picker and the "start" CTA that stamps
# onboarded_at + due_date and lands on home.
#
# CI must reset the seeded test user's onboarding state via
# `backend/reset-onboarding $TEST_USER_EMAIL` before running this flow.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

- assertVisible:
    id: "onboarding-welcome"

# Open the date picker
- tapOn:
    id: "onboarding-due-date-field"

# Android: native date-picker dialog — confirm the default date.
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"

# iOS: inline spinner renders near the bottom of the screen. A
# center-of-screen swipe misses it, so we target the picker area with
# explicit coordinates to scroll a wheel and trigger onChange.
- runFlow:
    when:
      visible:
        id: "onboarding-date-picker-done"
    commands:
      - swipe:
          start: "50%, 85%"
          end: "50%, 70%"
          duration: 400
      - tapOn:
          id: "onboarding-date-picker-done"

# Start button should now be enabled
- tapOn:
    id: "onboarding-start-button"
- assertVisible:
    id: "home-tab"
