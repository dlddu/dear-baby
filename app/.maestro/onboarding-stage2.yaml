appId: com.dlddu.dearbaby
---
# Onboarding → Home (예정일 선택 경로) 확인.
#
# PRD-007 작업 C 이후의 홈은 1인칭 질문 카드(home-question-card) +
# 음성/텍스트 CTA(home-voice-cta / home-text-cta) 로 구성된다.
# 본 flow 는 Case A 예정일 선택 후 홈에 도착해 새 카드와 CTA 가
# 노출되는지, CTA 가 각 기록 화면을 띄우는지를 확인한다.
#
# CI must reset the seeded test user's onboarding state before running
# this flow; the undecided path lives in onboarding-stage2-undecided.yaml.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1·Q2 (Case A: 임신 O · 양육 X) → a1
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml

# a1 → a2 → 홈 (예정일 선택 경로)
- runFlow:
    file: subflows/onboarding-caseA-a1-a2-date.yaml

# 홈 진입 — PRD-007 AC-007-01·03 헤더 + AC-007-04·06 1인칭 카드 + CTA.
- assertVisible:
    id: "home-header"
- assertVisible:
    id: "home-header-bell"
- assertVisible:
    id: "home-question-card"
- assertVisible:
    id: "home-voice-cta"
- assertVisible:
    id: "home-text-cta"

# Voice CTA opens the recorder; back out without recording.
- tapOn:
    id: "home-voice-cta"
- assertVisible:
    id: "record-audio-screen"
- tapOn:
    id: "record-audio-cancel"
- assertVisible:
    id: "home-tab"

# Text CTA opens the text-record modal; cancel to return.
- tapOn:
    id: "home-text-cta"
- assertVisible:
    id: "record-text-screen"
- tapOn:
    id: "record-text-cancel"
- assertVisible:
    id: "home-tab"
