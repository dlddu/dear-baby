appId: com.dlddu.dearbaby
---
# Onboarding Stage 2 – with-due-date path.
#
# Verifies the home-screen voice-record coachmark + question card +
# dual CTAs + blurred AI preview shown to users who just completed
# Stage 1 with a due date. Combines what was previously Path 1
# (set due date → verify Stage 2 + coachmark dismissal) and Path 3
# (voice CTA navigation, text CTA save → AI preview) of the legacy
# multi-path flow — both paths consume the same onboarded-with-date
# state, so they stay together.
#
# CI must reset the seeded test user's onboarding state before running
# this flow; the undecided path lives in onboarding-stage2-undecided.yaml.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1·Q2 (Case A: 임신 O · 양육 X) → a1
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml

# a1 → a2 → 홈 (예정일 선택 경로)
- runFlow:
    file: subflows/onboarding-caseA-a1-a2-date.yaml

# Stage 2 UI — PRD-007 AC-007-01·03: 새 헤더(이름·종)가 홈 진입과 동시에 보여야 한다.
- assertVisible:
    id: "home-header"
- assertVisible:
    id: "home-header-bell"
- assertVisible:
    id: "stage2-question-card"
- assertVisible: "첫 기록이 가장 소중해요 🌱"
- assertVisible:
    id: "stage2-week-badge"
- assertVisible:
    id: "stage2-coachmark"
- assertVisible: "🎙 말하기만 해도 기록이 돼요!"
- assertVisible:
    id: "stage2-voice-cta"
- assertVisible:
    id: "stage2-text-cta"
- assertVisible:
    id: "stage2-ai-preview"

# Dismiss the coachmark → it disappears immediately
- tapOn:
    id: "stage2-coachmark-dismiss"
- assertNotVisible:
    id: "stage2-coachmark"

# Relaunch without wiping state: the dismissal must be persisted by the
# backend, so the coachmark should NOT re-appear.
- launchApp
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"
- assertVisible:
    id: "home-tab"
- assertNotVisible:
    id: "stage2-coachmark"

# Voice CTA opens the recorder; back out without recording.
- tapOn:
    id: "stage2-voice-cta"
- assertVisible:
    id: "record-audio-screen"
- tapOn:
    id: "record-audio-cancel"
- assertVisible:
    id: "home-tab"
- assertNotVisible:
    id: "stage2-coachmark"

# Text CTA opens the record modal, save → backend stamps first_record_at →
# home subscribes to SSE → AI preview renders when the worker finishes.
# NOTE: Maestro's `inputText` does not support Unicode on Android
# (mobile-dev-inc/maestro#146), so the body here is ASCII. The assertions
# afterwards check the app's own status copy, not user-provided text.
- tapOn:
    id: "stage2-text-cta"
- assertVisible:
    id: "record-text-screen"
- tapOn:
    id: "record-text-input"
- inputText: "today i felt you move for the first time"
# Android 에선 soft keyboard 가 저장 버튼을 덮어 tapOn 이 실패한다. 입력
# 직후 키보드를 내려 버튼을 노출시킨다.
- hideKeyboard
- tapOn:
    id: "record-text-save"
- assertVisible:
    id: "home-tab"

# First-record save flips `first_record_at`, which auto-hides the coachmark.
- assertNotVisible:
    id: "stage2-coachmark"

# Wait for the AI preview ready copy. The loading copy is intentionally
# not asserted — a fast free-tier model can flip from loading → ready
# before Maestro queries the UI, making that check flaky. The ready
# footer is the authoritative signal the pipeline succeeded.
- extendedWaitUntil:
    visible: "AI가 당신의 기록을 이렇게 정리했어요"
    timeout: 30000
