appId: com.dlddu.dearbaby
---
# Case-branching onboarding — Case A (임신 O · 양육 X). PRD-006 AC-006-02.
#
# Steps:
#   Q1 [예] → Q2 [아니요] → Case A 1/3 단태 → Case A 2/3 태아 정보 → Case A 3/3 목적 → 홈
#
# CI must reset the seeded test user's onboarding state via
# `backend/reset-onboarding $TEST_USER_EMAIL` before running this flow.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1 — 임신 여부
- assertVisible:
    id: "onboarding-q1"
- tapOn:
    id: "q1-option-yes"
- tapOn:
    id: "q1-next"

# Q2 — 양육 여부
- assertVisible:
    id: "onboarding-q2"
- tapOn:
    id: "q2-option-no"
- tapOn:
    id: "q2-next"

# Case A · 1/3 — 단태
- assertVisible:
    id: "case-a-count"
- tapOn:
    id: "case-a-count-single"
- tapOn:
    id: "case-a-count-next"

# Case A · 2/3 — 태아 정보 (태명·성별·주차·예정일)
- assertVisible:
    id: "case-a-fetus"
- tapOn:
    id: "case-a-fetus-name"
- inputText: "stronger"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "gender-undecided"
- tapOn:
    id: "case-a-fetus-weeks"
- inputText: "17"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "case-a-fetus-due-date"
# Android: native modal — confirm the default date with OK.
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
# iOS: inline spinner — swipe a wheel to fire onChange (the spinner
# does NOT emit a value on mount), then tap our 완료 button to dismiss.
# The 완료 button has its own testID so visibility checks are reliable
# (the spinner's testID does not propagate cleanly on iOS).
- runFlow:
    when:
      visible:
        id: "case-a-fetus-due-date-done"
    commands:
      - swipe:
          start: "50%, 85%"
          end: "50%, 70%"
          duration: 400
      - tapOn:
          id: "case-a-fetus-due-date-done"
- tapOn:
    id: "case-a-fetus-next"

# Case A · 3/3 — 기록 목적
- assertVisible:
    id: "case-a-purpose"
- tapOn:
    id: "case-a-purpose-book_making"
- tapOn:
    id: "case-a-purpose-finish"

- assertVisible:
    id: "home-tab"
