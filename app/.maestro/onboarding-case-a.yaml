appId: com.dlddu.dearbaby
---
# Case A 온보딩 플로우 — 임신 O · 양육 X (PRD-006 AC-006-02 / TC-006-04).
#
# 흐름: Q1 (예) → Q2 (아니오) → A1 단태 → A2 태아 정보 → A3 기록 목적 → 홈.
# 사진 없음. CI must reset the seeded test user's onboarding state before
# running this flow (backend reset-onboarding $TEST_USER_EMAIL).

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1 — 임신 여부
- assertVisible:
    id: "onboarding-q1"
- tapOn:
    id: "q1-yes"

# Q2 — 양육 여부
- assertVisible:
    id: "onboarding-q2"
- tapOn:
    id: "q2-no"

# A1 — 단태/다태 (단태 선택)
- assertVisible:
    id: "onboarding-case-a-count"
- tapOn:
    id: "case-a-count-1"
- tapOn:
    id: "case-a-count-next"

# A2 — 태아 정보
- assertVisible:
    id: "onboarding-case-a-fetus"
- tapOn:
    id: "case-a-fetus-display-name"
- inputText: "Tunggi"
- hideKeyboard
- tapOn:
    id: "case-a-fetus-gender-undecided"
- tapOn:
    id: "case-a-fetus-weeks"
- inputText: "20"
- hideKeyboard
- tapOn:
    id: "case-a-fetus-due-date-field"
# Android: native date-picker dialog
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
# iOS: inline spinner — scroll wheel + Done
- runFlow:
    when:
      visible:
        id: "case-a-fetus-due-date-done"
    commands:
      - tapOn:
          id: "case-a-fetus-due-date-done"
- tapOn:
    id: "case-a-fetus-next"

# A3 — 기록 목적
- assertVisible:
    id: "onboarding-case-a-purpose"
- tapOn:
    id: "case-a-purpose-book_making"
- tapOn:
    id: "case-a-purpose-emotion_diary"
- tapOn:
    id: "case-a-purpose-submit"

# 홈 진입
- assertVisible:
    id: "home-tab"
