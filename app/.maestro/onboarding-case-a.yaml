appId: com.dlddu.dearbaby
---
# Onboarding Case A — 첫 아이 임신 중 (임신 O · 양육 X).
# 와이어프레임 docs/wireframes/onboarding/case-a.svg 참조.
# CI 는 시나리오 시작 전 backend/reset-onboarding $TEST_USER_EMAIL 로
# 시드 사용자의 온보딩 상태를 비워야 한다.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1 임신 여부 → 예
- assertVisible:
    id: "onboarding-q1"
- tapOn:
    id: "q1-yes"
- tapOn:
    id: "q1-next"

# Q2 양육 여부 → 아니요  → Case A 진입
- assertVisible:
    id: "onboarding-q2"
- tapOn:
    id: "q2-no"
- tapOn:
    id: "q2-next"

# A1 단태 선택
- assertVisible:
    id: "onboarding-a1"
- tapOn:
    id: "a1-single"
- tapOn:
    id: "a1-next"

# A2 태아 정보 — 태명·성별·임신주차·예정일
- assertVisible:
    id: "onboarding-a2"
- tapOn:
    id: "a2-name"
# Maestro inputText does not support Hangul on Android (mobile-dev-inc/
# maestro#146), so the test fixture uses an ASCII placeholder. The
# field is "(선택) 태명" so the value itself is cosmetic.
- inputText: "tunturee"
- tapOn:
    id: "a2-gender-undecided"
- tapOn:
    id: "a2-weeks"
- inputText: "17"
# Android 의 soft keyboard 가 due-date 버튼을 덮고, 키보드를 내려도
# A2 의 ScrollView 가 길어 viewport 밖에 위치하는 경우가 있다.
# 좌표 탭으로 키보드 dismiss 후 element 가 보일 때까지 스크롤한다.
- tapOn:
    point: "50%, 10%"
- scrollUntilVisible:
    element:
      id: "a2-due-date"
    direction: DOWN
- tapOn:
    id: "a2-due-date"
# Android: native modal — confirm 기본 날짜로 닫기.
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
# iOS: inline spinner — 스피너를 살짝 굴려서 onChange 발화 후 완료 탭.
- runFlow:
    when:
      visible:
        id: "onboarding-date-picker-done"
    commands:
      - swipe:
          start: "50%, 85%"
          end: "50%, 70%"
          duration: 400
      - tapOn:
          id: "onboarding-date-picker-done"
- tapOn:
    id: "a2-next"

# A3 기록 목적 → 책 만들기 + 가족과 공유 → 홈으로
- assertVisible:
    id: "onboarding-a3"
- tapOn:
    id: "a3-book_making"
- tapOn:
    id: "a3-family_share"
- tapOn:
    id: "a3-submit"
- assertVisible:
    id: "home-tab"
