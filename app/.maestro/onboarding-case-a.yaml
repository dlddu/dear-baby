appId: com.dlddu.dearbaby
---
# Onboarding Case A — pregnancy only (AC-006-02).
#
# Verifies the (Q1=yes, Q2=no) → Case A funnel: A1 단태 → A2 fetus
# row → A3 purpose → /me.case_kind = "A" + onboarded_at stamped.
#
# CI must reset the seeded test user's onboarding state via
# `backend/reset-onboarding $TEST_USER_EMAIL` before running this flow.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

- runFlow:
    file: subflows/complete-onboarding-case-a.yaml
