appId: com.dlddu.dearbaby
---
# Case-branching onboarding — Case A (임신 O · 양육 X). PRD-006 AC-006-02.
#
# Steps:
#   Q1 [예] → Q2 [아니요] → Case A 1/3 단태 → Case A 2/3 태아 정보 → Case A 3/3 목적 → 홈
#
# CI must reset the seeded test user's onboarding state via
# `backend/reset-onboarding $TEST_USER_EMAIL` before running this flow.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1 — 임신 여부
- assertVisible:
    id: "onboarding-q1"
- tapOn:
    id: "q1-option-yes"
- tapOn:
    id: "q1-next"

# Q2 — 양육 여부
- assertVisible:
    id: "onboarding-q2"
- tapOn:
    id: "q2-option-no"
- tapOn:
    id: "q2-next"

# Case A · 1/3 — 단태
- assertVisible:
    id: "case-a-count"
- tapOn:
    id: "case-a-count-single"
- tapOn:
    id: "case-a-count-next"

# Case A · 2/3 — 태아 정보 (태명·성별·주차·예정일)
- assertVisible:
    id: "case-a-fetus"
- tapOn:
    id: "case-a-fetus-name"
- inputText: "stronger"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "gender-undecided"
- tapOn:
    id: "case-a-fetus-weeks"
- inputText: "17"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "case-a-fetus-due-date"
# Tapping the field pre-fills a sensible default (DateField.tsx —
# defaultDueDate for 예정일 / today for 생년월일) and opens the picker.
# Dismiss the platform dialog so the bottom CTA is visible again.
# Android: native modal — confirm with OK.
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
# iOS: tap the modal backdrop to dismiss. The date is already
# committed by the field tap above, so the spinner doesn't need to
# be driven explicitly.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "case-a-fetus-due-date-backdrop"
- tapOn:
    id: "case-a-fetus-next"

# Case A · 3/3 — 기록 목적
- assertVisible:
    id: "case-a-purpose"
- tapOn:
    id: "case-a-purpose-book_making"
- tapOn:
    id: "case-a-purpose-finish"

- assertVisible:
    id: "home-tab"
