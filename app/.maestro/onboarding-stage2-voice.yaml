appId: com.dlddu.dearbaby
---
# Onboarding Stage 2 – Voice record E2E.
#
# Verifies the three end-states of the voice-record flow:
#
#   A. 저장만             — transcript on server, audio in local archive
#   B. 저장 후 업로드      — transcript on server, audio uploaded (or fixture)
#   C. 저장 후 보관함 삭제  — transcript on server, local audio gone
#
# Requires the seeded test user (TEST_USER_EMAIL / TEST_USER_PASSWORD)
# in a fresh onboarding state — CI calls
# `backend/reset-onboarding $TEST_USER_EMAIL` before this flow runs —
# plus EXPO_PUBLIC_E2E_AUDIO_FIXTURE=1 in the app build.
#
# The fixture flag is critical: Maestro can't drive the microphone, the
# whisper model would have to be downloaded on every run, and CI doesn't
# carry AWS credentials. With the flag set, the recorder produces a
# placeholder file, the STT returns a canned Korean transcript, and
# uploadAudio short-circuits to a successful state.

# ─── Sign in fresh and skip due-date so the home is unblocked ────────────

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/case-a-fastpath.yaml
- assertVisible:
    id: "home-tab"

# ─── Scenario A: save only — audio stays in the local archive ──────────────

- assertVisible:
    id: "stage2-voice-cta"
- tapOn:
    id: "stage2-voice-cta"
- assertVisible:
    id: "record-audio-screen"
- tapOn:
    id: "record-audio-start"
- assertVisible:
    id: "record-audio-stop"
- tapOn:
    id: "record-audio-stop"

- assertVisible:
    id: "record-audio-review-screen"
# STT runs, then the editable input appears with the canned transcript.
- extendedWaitUntil:
    visible:
      id: "record-audio-review-input"
    timeout: 10000
- tapOn:
    id: "record-audio-review-save"

- assertVisible:
    id: "home-tab"
# First voice record stamps first_record_at → coachmark hides; banner
# surfaces because the audio is now in the local archive.
- assertNotVisible:
    id: "stage2-coachmark"
- assertVisible:
    id: "drafts-banner"

# AI preview ready — same path as the text flow.
- extendedWaitUntil:
    visible: "AI가 당신의 기록을 이렇게 정리했어요"
    timeout: 30000

# Drafts contains exactly one row that we can act on. Buttons carry
# per-record testIDs (drafts-upload-{uuid} / drafts-delete-{uuid});
# match by testID prefix via regex so we don't have to know the UUID.
- tapOn:
    id: "drafts-banner"
- assertVisible:
    id: "drafts-screen"
- tapOn:
    id: "drafts-upload-.+"
- extendedWaitUntil:
    visible:
      id: "drafts-empty"
    timeout: 15000
- tapOn:
    id: "drafts-back"
- assertVisible:
    id: "home-tab"
- assertNotVisible:
    id: "drafts-banner"

# ─── Scenario B: save + upload in one shot ─────────────────────────────────

- tapOn:
    id: "stage2-voice-cta"
- assertVisible:
    id: "record-audio-screen"
- tapOn:
    id: "record-audio-start"
- tapOn:
    id: "record-audio-stop"
- assertVisible:
    id: "record-audio-review-screen"
- extendedWaitUntil:
    visible:
      id: "record-audio-review-input"
    timeout: 10000
- tapOn:
    id: "record-audio-review-save-and-upload"
- assertVisible:
    id: "home-tab"
# Both transcript + audio handled; archive must be empty.
- assertNotVisible:
    id: "drafts-banner"

# ─── Scenario C: save then delete from drafts ──────────────────────────────

- tapOn:
    id: "stage2-voice-cta"
- tapOn:
    id: "record-audio-start"
- tapOn:
    id: "record-audio-stop"
- assertVisible:
    id: "record-audio-review-screen"
- extendedWaitUntil:
    visible:
      id: "record-audio-review-input"
    timeout: 10000
- tapOn:
    id: "record-audio-review-save"
- assertVisible:
    id: "home-tab"
- assertVisible:
    id: "drafts-banner"

- tapOn:
    id: "drafts-banner"
- assertVisible:
    id: "drafts-screen"
- tapOn:
    id: "drafts-delete-.+"
# Native confirm dialog from RN's Alert.alert. The dialog's
# destructive button label is the same as the row's delete button
# ("삭제") and both surface to a11y, so we anchor the tap to the
# dialog title to avoid ambiguity.
- assertVisible: "음성 파일을 삭제할까요?"
- tapOn:
    text: "삭제"
    below: "음성 파일을 삭제할까요?"
- extendedWaitUntil:
    visible:
      id: "drafts-empty"
    timeout: 5000
- tapOn:
    id: "drafts-back"
- assertVisible:
    id: "home-tab"
- assertNotVisible:
    id: "drafts-banner"
