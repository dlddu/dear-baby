appId: com.dlddu.dearbaby
---
# Verifies the password sign-in path that backs Apple beta review and
# the rest of the Maestro suite. The flow drives the secret tap pattern
# (top-left 5–7 times, then top-right 10+ times) that gates the
# tester-login modal in the same code path that ships in production —
# there is no build-time test-mode flag, only the seeded password
# (TEST_USER_PASSWORD) and the gesture.
#
# The MAESTRO_TEST_USER_EMAIL / MAESTRO_TEST_USER_PASSWORD env vars are
# injected by CI (see .github/workflows/e2e-*.yml) and must match the
# backend's TEST_USER_EMAIL / TEST_USER_PASSWORD secrets.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Newly seeded user has no onboarded_at, so login lands on the
# PRD-006 onboarding intro screen. The dedicated onboarding flows verify
# the rest of the funnel.
- assertVisible:
    id: "onboarding-intro"
