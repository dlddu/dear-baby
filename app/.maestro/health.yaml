appId: com.dlddu.dearbaby
---
- launchApp:
    clearState: true
# If a system "isn't responding" dialog covers the app (Pixel Launcher
# can ANR on cold-booted CI emulators), tap "Wait" to dismiss it.
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"
- assertVisible:
    id: "root"
# The landing screen auto-fires GET /health on mount and only renders
# `health-error-toast` when the call fails or returns a non-ok status.
# CI runs against a live backend, so the toast must NOT appear — its
# absence is the smoke-test signal that the API is reachable. The
# timeout gives the fetch + animation enough time to settle on a slow
# emulator.
- assertNotVisible:
    id: "health-error-toast"
    timeout: 10000
