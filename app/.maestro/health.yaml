appId: com.dlddu.dearbaby
---
- launchApp:
    clearState: true
# If a system "isn't responding" dialog covers the app (Pixel Launcher
# can ANR on cold-booted CI emulators), tap "Wait" to dismiss it.
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"
- assertVisible:
    id: "root"
# The landing screen auto-fires GET /health on mount and only renders
# `health-error-toast` when the call fails or returns a non-ok status.
# `health-check-complete` flips on once the fetch settles (success or
# failure) — wait for it first so the next assertion isn't racing the
# async fetch. CI runs against a live backend, so the toast must NOT
# appear; its absence is the smoke-test signal that the API is reachable.
- extendedWaitUntil:
    visible:
      id: "health-check-complete"
    timeout: 10000
- assertNotVisible:
    id: "health-error-toast"
