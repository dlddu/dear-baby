appId: com.dlddu.dearbaby
---
# Case C 온보딩 플로우 — 임신 X · 양육 O (PRD-006 AC-006-04 / TC-006-06).
#
# 흐름: Q1 (아니오) → Q2 (예) → C1 1명 → C2 양육 아이 정보 (사진은 건너뜀)
#       → C3 기록 목적 → 홈.
# 사진 입력은 expo-image-picker가 시스템 다이얼로그를 띄우므로 E2E에서
# 자동화하기 어렵다 — 시나리오는 사진 없는 경로만 검증한다.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1 — 임신 여부 (아니오)
- assertVisible:
    id: "onboarding-q1"
- tapOn:
    id: "q1-no"

# Q2 — 양육 여부 (예)
- assertVisible:
    id: "onboarding-q2"
- tapOn:
    id: "q2-yes"

# C1 — 양육 아이 수 (1명)
- assertVisible:
    id: "onboarding-case-c-count"
- tapOn:
    id: "case-c-count-1"
- tapOn:
    id: "case-c-count-next"

# C2 — 양육 아이 정보 (사진은 건너뜀)
- assertVisible:
    id: "onboarding-case-c-child"
- tapOn:
    id: "case-c-child-name"
- inputText: "Jiyu"
- hideKeyboard
- tapOn:
    id: "case-c-child-gender-female"
- tapOn:
    id: "case-c-child-birth-date-field"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible:
        id: "case-c-child-birth-date-done"
    commands:
      - tapOn:
          id: "case-c-child-birth-date-done"
- tapOn:
    id: "case-c-child-next"

# C3 — 기록 목적
- assertVisible:
    id: "onboarding-case-c-purpose"
- tapOn:
    id: "case-c-purpose-memory_keeping"
- tapOn:
    id: "case-c-purpose-family_share"
- tapOn:
    id: "case-c-purpose-submit"

# 홈 진입
- assertVisible:
    id: "home-tab"
