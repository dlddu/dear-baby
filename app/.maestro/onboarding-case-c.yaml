appId: com.dlddu.dearbaby
---
# Case-branching onboarding — Case C (임신 X · 양육 O). PRD-006 AC-006-04.
#
# Steps:
#   Q1 [아니요] → Q2 [예] → Case C 1/3 1명 → Case C 2/3 아이 정보 (사진 건너뛰기) → Case C 3/3 목적 → 홈
#
# 사진 입력은 시스템 image picker 의 시뮬레이션이 어려워 (Maestro 한계),
# 와이어프레임의 (선택) 흐름대로 사진 없이 진행한다.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1 — 임신 X
- assertVisible:
    id: "onboarding-q1"
- tapOn:
    id: "q1-option-no"
- tapOn:
    id: "q1-next"

# Q2 — 양육 O
- assertVisible:
    id: "onboarding-q2"
- tapOn:
    id: "q2-option-yes"
- tapOn:
    id: "q2-next"

# Case C · 1/3 — 1명
- assertVisible:
    id: "case-c-count"
- tapOn:
    id: "case-c-count-1"
- tapOn:
    id: "case-c-count-next"

# Case C · 2/3 — 아이 정보 (사진 건너뛰기)
- assertVisible:
    id: "case-c-child"
- tapOn:
    id: "case-c-child-0-name"
- inputText: "jiyoo"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "gender-female"
- tapOn:
    id: "case-c-child-0-birth-date"
# Field tap pre-fills today as the default. Android's modal dialog
# needs an explicit OK; iOS uses an inline calendar that doesn't
# block the footer CTA, so no explicit dismissal needed.
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- tapOn:
    id: "case-c-child-next"

# Case C · 3/3 — 기록 목적
- assertVisible:
    id: "case-c-purpose"
- tapOn:
    id: "case-c-purpose-memory_keeping"
- tapOn:
    id: "case-c-purpose-finish"

- assertVisible:
    id: "home-tab"
