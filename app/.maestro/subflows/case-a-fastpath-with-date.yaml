appId: com.dlddu.dearbaby
---
# Same as case-a-fastpath.yaml but picks a real due date instead of
# checking "예정일 미정". stage2.yaml (with-due-date path) needs the
# week badge to render, which depends on user.children[i].due_date
# being non-null after the funnel completes.

- runFlow:
    file: tester-login.yaml

- assertVisible:
    id: "onboarding-intro"
- tapOn:
    id: "onboarding-intro-start"

- assertVisible:
    id: "onboarding-case-pregnancy"
- tapOn:
    id: "onboarding-pregnant-yes"

- assertVisible:
    id: "onboarding-case-children"
- tapOn:
    id: "onboarding-children-no"

- assertVisible:
    id: "case-a-multiple"
- tapOn:
    id: "case-a-single"

- assertVisible:
    id: "case-a-fetus"
- tapOn:
    id: "fetus-0-due-date"
# Android: native picker dialog — confirm default (today + 40w).
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
# iOS: inline spinner — spin the wheel to fire onChange, then dismiss.
- runFlow:
    when:
      visible:
        id: "fetus-0-due-date-done"
    commands:
      - swipe:
          start: "50%, 85%"
          end: "50%, 70%"
          duration: 400
      - tapOn:
          id: "fetus-0-due-date-done"
- scrollUntilVisible:
    element:
      id: "case-a-fetus-next"
- tapOn:
    id: "case-a-fetus-next"

- assertVisible:
    id: "case-a-purpose"
- tapOn:
    id: "purpose-letter"
- scrollUntilVisible:
    element:
      id: "case-a-finish"
- tapOn:
    id: "case-a-finish"

- extendedWaitUntil:
    visible:
      id: "home-tab"
    timeout: 8000
