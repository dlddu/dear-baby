appId: com.dlddu.dearbaby
---
# Subflow: walk a freshly-reset test user through the simplest case-
# branching onboarding path (Case A — pregnancy only, single fetus,
# minimum required fields). Used by the Stage 2 home-screen flows that
# need a signed-in user past the funnel without re-encoding the funnel
# in every test.
#
# Caller is responsible for `clearKeychain` + `launchApp` + tester-login
# *before* invoking this subflow. The subflow lands the user on the
# home tab (`home-tab` testID).

- assertVisible:
    id: "onboarding-q1"
- tapOn:
    id: "onboarding-q1-yes"
- tapOn:
    id: "onboarding-q1-next"

- assertVisible:
    id: "onboarding-q2"
- tapOn:
    id: "onboarding-q2-no"
- tapOn:
    id: "onboarding-q2-next"

# A1 — choose 단태 so we only fill one fetus row.
- assertVisible:
    id: "onboarding-a1"
- tapOn:
    id: "onboarding-a1-singleton"
- tapOn:
    id: "onboarding-a1-next"

# A2 — gender / weeks. due_date 는 slot 시드에서 기본값(오늘 +40주)이
# 미리 채워져 있어 픽커를 건드릴 필요가 없다. iOS spinner mode 의
# 픽커는 Next 버튼을 가려서 dismiss 가 까다롭기 때문에 일부러 생략한다.
- assertVisible:
    id: "onboarding-a2"
- tapOn:
    id: "onboarding-a2-form-gender-undecided"
- tapOn:
    id: "onboarding-a2-form-weeks"
- inputText: "20"
# 키보드 처리:
#   iOS — number-pad 는 dismiss 액션이 없어 hideKeyboard 가 실패한다.
#   Android — soft keyboard 가 Next 버튼을 가린다.
# scrollUntilVisible 로 Next 버튼을 노출시키며 키보드를 자연스럽게 닫는다.
- scrollUntilVisible:
    element:
      id: "onboarding-a2-next"
- tapOn:
    id: "onboarding-a2-next"

# A3 — pick at least one purpose.
- assertVisible:
    id: "onboarding-a3"
- tapOn:
    id: "onboarding-a3-purposes-book_making"
- tapOn:
    id: "onboarding-a3-submit"

- assertVisible:
    id: "home-tab"
