appId: com.dlddu.dearbaby
---
# Reusable Q1/Q2 subflow for the **Case A** path (임신 O · 양육 X).
# Caller must already be on the Q1 screen (id "onboarding-q1") — usually
# by having just signed in via subflows/tester-login.yaml.
#
# After this subflow runs the user is on the welcome screen
# (id "onboarding-welcome"), which is Stage 1 의 예정일 입력 단계다.

- assertVisible:
    id: "onboarding-q1"

# Q1 = 네, 임신 중이에요
- tapOn:
    id: "onboarding-q1-yes"

- assertVisible:
    id: "onboarding-q2"

# Q2 = 아니요, 첫 아이예요 → Case A → welcome 화면
- tapOn:
    id: "onboarding-q2-no"

- assertVisible:
    id: "onboarding-welcome"
