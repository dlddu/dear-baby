appId: com.dlddu.dearbaby
---
# Reusable Q1/Q2 subflow for the **Case B** path (임신 O · 양육 O).
# Caller must already be on the Q1 screen (id "onboarding-q1") — usually
# by having just signed in via subflows/tester-login.yaml.
#
# After this subflow runs the user is on the B0 screen
# (id "onboarding-b0"), Case B 의 첫 안내 화면이다.

- assertVisible:
    id: "onboarding-q1"

# Q1 = 네, 임신 중이에요
- tapOn:
    id: "onboarding-q1-yes"

- assertVisible:
    id: "onboarding-q2"

# Q2 = 네, 있어요 → Case B → b0 (안내 ①) 화면
- tapOn:
    id: "onboarding-q2-yes"

- assertVisible:
    id: "onboarding-b0"
