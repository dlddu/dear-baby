appId: com.dlddu.dearbaby
---
# Onboarding Stage 1 – skip path.
#
# Verifies the welcome screen UI and the "skip due date" escape hatch
# that lands the user on home with no due_date stored.
#
# CI must reset the seeded test user's onboarding state via
# `backend/reset-onboarding $TEST_USER_EMAIL` before running this flow,
# otherwise the user already has onboarded_at set and login skips
# straight to the home tab. The shared password-login pattern is
# documented in subflows/tester-login.yaml.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1·Q2 (Case A: 임신 O · 양육 X) → welcome
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml

# Verify all welcome-screen copy & controls
- assertVisible: "DearBaby"
- assertVisible: "반가워요, 엄마 🌷"
- assertVisible: "아기를 만날 예정일을 알려주세요"
- assertVisible: "날짜 선택하기"
- assertVisible: "시작하기"
- assertVisible: "아직 정해지지 않았어요"

# Tap skip → should navigate to home
- tapOn:
    id: "onboarding-skip-button"
- assertVisible:
    id: "home-tab"
