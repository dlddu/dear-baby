appId: com.dlddu.dearbaby
---
# Onboarding Case A – skip-date path.
#
# Verifies the A2 screen UI and the [아직 정해지지 않았어요] escape hatch
# that lands the user on home with no due_date stored.
#
# CI must reset the seeded test user's onboarding state via
# `backend/reset-onboarding $TEST_USER_EMAIL` before running this flow,
# otherwise the user already has onboarded_at set and login skips
# straight to the home tab. The shared password-login pattern is
# documented in subflows/tester-login.yaml.

- clearKeychain
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"

- runFlow:
    file: subflows/tester-login.yaml

# Q1·Q2 (Case A: 임신 O · 양육 X) → a1
- runFlow:
    file: subflows/onboarding-q1-q2-caseA.yaml

# A1 단태 선택 → A2 진입
- assertVisible:
    id: "onboarding-a1"
- tapOn:
    id: "onboarding-a1-count-1"
- tapOn:
    id: "onboarding-a1-next"

# Verify A2 copy & controls. 헤더 타이틀(serif h2)은 RN 의 multiline Text
# 가 Maestro 의 텍스트 트리에서 안정적으로 잡히지 않아 단정 대상에서 제외
# — 화면 식별은 testID 로 충분하고, 헬퍼·필드라벨·CTA 카피로 시각 검증을
# 갈음한다.
- assertVisible:
    id: "onboarding-a2"
- assertVisible: "기록 가이드를 맞춰 보여드릴게요"
- assertVisible: "예정일"
- assertVisible: "날짜 선택하기"
- assertVisible: "아직 정해지지 않았어요"
- assertVisible: "여자아이"
- assertVisible: "남자아이"
- assertVisible: "임신 주차"
- assertVisible: "시작하기"

# 예정일 스킵 → 성별·주차만 입력 → 홈으로
- tapOn:
    id: "onboarding-a2-due-date-skip"
- tapOn:
    id: "onboarding-a2-gender-unknown"
- tapOn:
    id: "onboarding-a2-week"
- inputText: "12"
# 키보드 닫기 — iOS 의 number-pad 키보드는 return 키가 없어 hideKeyboard
# 가 실패한다. 비입력 텍스트를 탭해 키보드를 내린다.
- tapOn:
    text: "기록 가이드를 맞춰 보여드릴게요"
- tapOn:
    id: "onboarding-a2-next"
- assertVisible:
    id: "home-tab"
